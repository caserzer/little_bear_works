const episodes = [{"id": 1, "title": "The Lunchbox Detective", "title_zh": "午餐盒侦探", "category": "校园里的好奇心", "focus": "my/mine、your/yours；观察与推测", "summary_zh": "两个一样的午餐盒引出一场小侦探游戏：怎样用线索找到主人？", "words": {"clue": "线索", "label": "标签", "evidence": "证据"}, "story": "At Maple School, Maya puts a blue lunchbox on the table. Leo puts another blue lunchbox beside it. They look exactly the same.\n\nIs this yours? Maya asks.\n\nI think so, Leo says. He opens it. Inside are rice, carrots, and an egg. That is strange. My dad made me a sandwich.\n\nThen this one is mine, says Maya. But wait. My lunch has noodles today.\n\nNow they have two lunchboxes and no lunch they recognize. Pip, their small classroom robot, rolls over. I have a solution. Eat both lunches.\n\nThat is not a solution, says Maya. That is your lunch plan.\n\nMs. Park asks them to look for clues without eating anything. One box has a tiny star on the bottom. The other has a name under the handle.\n\nThis says Sam, Leo reads. So it is his.\n\nA girl named June arrives. The star is mine, she says. My brother drew it.\n\nMaya looks under the table. There is her lunchbox, still inside her backpack. Leo checks his bag, too. His sandwich is there.\n\nWe were looking at their lunches, says Maya, but we did not check our own bags.\n\nPip thinks for a moment. My first clue is that I am still hungry.\n\nYou do not eat sandwiches, Leo tells him.\n\nCorrect, says Pip. But I can appreciate a good mystery.", "fact": "A clue is something that helps you answer a question. Evidence supports an idea. A blue box is a weak clue when many people have blue boxes. A name label is stronger evidence. Good detectives check their ideas before deciding they are right.", "recap": "Maya and Leo saw two blue lunchboxes and guessed they were theirs. Labels showed that the boxes belonged to Sam and June. Their own lunches were still in their bags. Looking carefully solved the mystery.", "phrases": ["Is this yours?", "No, that one is mine.", "Let us check the evidence."], "question": "What finally helped the children find the owners: the color or the labels?", "answer": "The labels helped them. Both boxes were blue, so color alone was not enough.", "wonder": "If you had to describe your backpack without using its color, what clues would you give?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 228.552, "word_count": 460, "words_per_minute_including_pauses": 120.8, "input_sha256": "7504d71431644f7d84835fd9266b188b1ae4ddfce79acb4c48788feaea6a37a4", "audio_sha256": "4df80cbbd764d77bcb9b25cab4955fcaa3361ea9626ecce9edc037ece145ee97", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/01_the_lunchbox_detective.mp3", "transcript": "transcripts/01_the_lunchbox_detective.md", "subtitle": "subtitles/01_the_lunchbox_detective.srt", "speech": "The Curiosity Club. Episode 1. The Lunchbox Detective.\n\nHere is something to listen for. What finally helped the children find the owners: the color or the labels?\n\nReady? Let us find out.\n\nAt Maple School, Maya puts a blue lunchbox on the table. Leo puts another blue lunchbox beside it. They look exactly the same.\n\nIs this yours? Maya asks.\n\nI think so, Leo says. He opens it. Inside are rice, carrots, and an egg. That is strange. My dad made me a sandwich.\n\nThen this one is mine, says Maya. But wait. My lunch has noodles today.\n\nNow they have two lunchboxes and no lunch they recognize. Pip, their small classroom robot, rolls over. I have a solution. Eat both lunches.\n\nThat is not a solution, says Maya. That is your lunch plan.\n\nMs. Park asks them to look for clues without eating anything. One box has a tiny star on the bottom. The other has a name under the handle.\n\nThis says Sam, Leo reads. So it is his.\n\nA girl named June arrives. The star is mine, she says. My brother drew it.\n\nMaya looks under the table. There is her lunchbox, still inside her backpack. Leo checks his bag, too. His sandwich is there.\n\nWe were looking at their lunches, says Maya, but we did not check our own bags.\n\nPip thinks for a moment. My first clue is that I am still hungry.\n\nYou do not eat sandwiches, Leo tells him.\n\nCorrect, says Pip. But I can appreciate a good mystery.\n\nNow, a little more to discover.\n\nA clue is something that helps you answer a question. Evidence supports an idea. A blue box is a weak clue when many people have blue boxes. A name label is stronger evidence. Good detectives check their ideas before deciding they are right.\n\nLet us hear the main idea again.\n\nMaya and Leo saw two blue lunchboxes and guessed they were theirs. Labels showed that the boxes belonged to Sam and June. Their own lunches were still in their bags. Looking carefully solved the mystery.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIs this yours?\nIs this yours?\n\nNo, that one is mine.\nNo, that one is mine.\n\nLet us check the evidence.\nLet us check the evidence.\n\nRemember our listening question? What finally helped the children find the owners: the color or the labels?\n\nHere is the answer. The labels helped them. Both boxes were blue, so color alone was not enough.\n\nAnd here is a question just for your imagination. If you had to describe your backpack without using its color, what clues would you give?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 2, "title": "Pip and the Upside-Down Library", "title_zh": "机器人整理图书馆", "category": "校园里的好奇心", "focus": "they/them/their；分类标准", "summary_zh": "Pip按书的颜色整理书架，却让大家找不到书。好用的分类需要什么规则？", "words": {"sort": "分类整理", "shelf": "书架的一层", "system": "系统；有规则的方法"}, "story": "The school library needs help. Books are on tables, chairs, and even a windowsill. Pip is excited. I can sort them, he says.\n\nWhen Maya returns, every shelf looks beautiful. Red books are together. Blue books are together. One green book sits beside a green plant.\n\nWhere is the book about sharks? she asks.\n\nWhat color is it? Pip replies.\n\nI do not remember.\n\nThen we have a small problem.\n\nLeo wants a story by his favorite author. Pip asks whether the cover is dark blue or light blue. Leo does not know that either.\n\nMs. Park brings three books to the table. One is about whales. One is about the Moon. One is a story about a whale visiting the Moon.\n\nThey all have blue covers, Maya says, but their subjects are different.\n\nThe librarian explains their system. Stories are in one section. Books that explain real things are in another. Signs and labels help readers find smaller groups.\n\nLet me help you, Leo says to Pip. They check the labels together and move the books. The shark book joins the animal books. The Moon book joins the space books.\n\nWhere do I put the plant? Pip asks.\n\nBy the window, says the librarian.\n\nPip adds a little sign: Not a book. Please do not return it through the book slot.", "fact": "Sorting means putting things into groups using a rule. You can sort the same objects in different ways: by size, color, or purpose. A useful system depends on what you need to find. Libraries use organized systems and labels so that other people can follow the rules, too.", "recap": "Pip sorted books by color. The shelves looked nice, but readers could not easily find a subject or an author. The children followed the library's labels instead. A good sorting rule helps people do a job.", "phrases": ["They need our help.", "Let me help you sort them.", "What rule are we using?"], "question": "Why was sorting only by color a problem?", "answer": "Readers often knew a subject or an author, but they did not remember the color of the cover.", "wonder": "How would you organize a box of toys so that a friend could find one quickly?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 222.504, "word_count": 465, "words_per_minute_including_pauses": 125.4, "input_sha256": "e667c50206599c2fbab0f0ef21aad8245e961052856cb7eb7316b6d86cc27b2d", "audio_sha256": "f9b7aa241d394717068c17e6e7538ee655bd565489fac1d142975709d33caa71", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/02_pip_and_the_upside_down_library.mp3", "transcript": "transcripts/02_pip_and_the_upside_down_library.md", "subtitle": "subtitles/02_pip_and_the_upside_down_library.srt", "speech": "The Curiosity Club. Episode 2. Pip and the Upside-Down Library.\n\nHere is something to listen for. Why was sorting only by color a problem?\n\nReady? Let us find out.\n\nThe school library needs help. Books are on tables, chairs, and even a windowsill. Pip is excited. I can sort them, he says.\n\nWhen Maya returns, every shelf looks beautiful. Red books are together. Blue books are together. One green book sits beside a green plant.\n\nWhere is the book about sharks? she asks.\n\nWhat color is it? Pip replies.\n\nI do not remember.\n\nThen we have a small problem.\n\nLeo wants a story by his favorite author. Pip asks whether the cover is dark blue or light blue. Leo does not know that either.\n\nMs. Park brings three books to the table. One is about whales. One is about the Moon. One is a story about a whale visiting the Moon.\n\nThey all have blue covers, Maya says, but their subjects are different.\n\nThe librarian explains their system. Stories are in one section. Books that explain real things are in another. Signs and labels help readers find smaller groups.\n\nLet me help you, Leo says to Pip. They check the labels together and move the books. The shark book joins the animal books. The Moon book joins the space books.\n\nWhere do I put the plant? Pip asks.\n\nBy the window, says the librarian.\n\nPip adds a little sign: Not a book. Please do not return it through the book slot.\n\nNow, a little more to discover.\n\nSorting means putting things into groups using a rule. You can sort the same objects in different ways: by size, color, or purpose. A useful system depends on what you need to find. Libraries use organized systems and labels so that other people can follow the rules, too.\n\nLet us hear the main idea again.\n\nPip sorted books by color. The shelves looked nice, but readers could not easily find a subject or an author. The children followed the library's labels instead. A good sorting rule helps people do a job.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nThey need our help.\nThey need our help.\n\nLet me help you sort them.\nLet me help you sort them.\n\nWhat rule are we using?\nWhat rule are we using?\n\nRemember our listening question? Why was sorting only by color a problem?\n\nHere is the answer. Readers often knew a subject or an author, but they did not remember the color of the cover.\n\nAnd here is a question just for your imagination. How would you organize a box of toys so that a friend could find one quickly?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 3, "title": "The Paper Bridge Challenge", "title_zh": "一张纸的桥梁挑战", "category": "校园里的好奇心", "focus": "let us、try again；比较与改进", "summary_zh": "同样一张纸，改变形状能否让桥更结实？", "words": {"bridge": "桥", "fold": "折叠", "design": "设计"}, "story": "The science club has a challenge. Build a bridge between two books using one sheet of paper. Then see how many small blocks it can hold.\n\nLeo lays his paper flat. This is a very fast bridge, he says.\n\nThe first block stays on it. The second block makes the middle bend. The third block falls through, taking the bridge with it.\n\nFast to build, Maya says, and fast to fall.\n\nPip offers to hold the paper up. Ms. Park smiles. The bridge has to work without a robot underneath it.\n\nMaya folds her paper back and forth, like a small fan. She puts it across the same gap. It holds more blocks before it bends.\n\nDid you use thicker paper? Leo asks.\n\nNo. We used the same kind. I changed the shape.\n\nLeo wants to make the gap smaller, add tape, and use two sheets at once.\n\nLet us change one thing first, says Maya. Then we can understand what helped.\n\nThey fold a new sheet and test it over the original gap. This time, they write down the result. They also put the blocks in the same place each time.\n\nPip names the bridge The Great Paper Highway.\n\nCan a bus cross it? he asks.\n\nA toy bus, perhaps, says Leo.\n\nPip makes a sign: Small vehicles only. Large robots must go around.", "fact": "An object's shape can affect how it bends under a load. Folding paper can make it harder to bend in some directions. Engineers compare designs, test them, and improve them. When you change one feature at a time, it is easier to understand why a result changed.", "recap": "A flat paper bridge bent quickly. Maya folded the paper and tested it across the same gap. The new shape held more blocks in their test. The club learned to compare designs carefully and keep a record.", "phrases": ["Let us try again.", "What did you change?", "We used the same kind of paper."], "question": "What did Maya change in the first improved bridge?", "answer": "She changed the shape by folding the paper. She did not use a thicker sheet.", "wonder": "Where can you see folds, curves, or triangles in things that need to be strong?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 216.672, "word_count": 464, "words_per_minute_including_pauses": 128.5, "input_sha256": "75c0aa352a2b84b3a4cef01c23ccc173f0b6ba74b57d2b0e0a6c840353da30ad", "audio_sha256": "3fe7f1a78e5275d3c63219488b16e212071e10640111bcf830a5eb051b34b6a5", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/03_the_paper_bridge_challenge.mp3", "transcript": "transcripts/03_the_paper_bridge_challenge.md", "subtitle": "subtitles/03_the_paper_bridge_challenge.srt", "speech": "The Curiosity Club. Episode 3. The Paper Bridge Challenge.\n\nHere is something to listen for. What did Maya change in the first improved bridge?\n\nReady? Let us find out.\n\nThe science club has a challenge. Build a bridge between two books using one sheet of paper. Then see how many small blocks it can hold.\n\nLeo lays his paper flat. This is a very fast bridge, he says.\n\nThe first block stays on it. The second block makes the middle bend. The third block falls through, taking the bridge with it.\n\nFast to build, Maya says, and fast to fall.\n\nPip offers to hold the paper up. Ms. Park smiles. The bridge has to work without a robot underneath it.\n\nMaya folds her paper back and forth, like a small fan. She puts it across the same gap. It holds more blocks before it bends.\n\nDid you use thicker paper? Leo asks.\n\nNo. We used the same kind. I changed the shape.\n\nLeo wants to make the gap smaller, add tape, and use two sheets at once.\n\nLet us change one thing first, says Maya. Then we can understand what helped.\n\nThey fold a new sheet and test it over the original gap. This time, they write down the result. They also put the blocks in the same place each time.\n\nPip names the bridge The Great Paper Highway.\n\nCan a bus cross it? he asks.\n\nA toy bus, perhaps, says Leo.\n\nPip makes a sign: Small vehicles only. Large robots must go around.\n\nNow, a little more to discover.\n\nAn object's shape can affect how it bends under a load. Folding paper can make it harder to bend in some directions. Engineers compare designs, test them, and improve them. When you change one feature at a time, it is easier to understand why a result changed.\n\nLet us hear the main idea again.\n\nA flat paper bridge bent quickly. Maya folded the paper and tested it across the same gap. The new shape held more blocks in their test. The club learned to compare designs carefully and keep a record.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nLet us try again.\nLet us try again.\n\nWhat did you change?\nWhat did you change?\n\nWe used the same kind of paper.\nWe used the same kind of paper.\n\nRemember our listening question? What did Maya change in the first improved bridge?\n\nHere is the answer. She changed the shape by folding the paper. She did not use a thicker sheet.\n\nAnd here is a question just for your imagination. Where can you see folds, curves, or triangles in things that need to be strong?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 4, "title": "The Mystery Humming Box", "title_zh": "嗡嗡响的神秘盒子", "category": "校园里的好奇心", "focus": "hear、noise/noisy；声音与振动", "summary_zh": "音乐教室里的盒子为什么会嗡嗡响？", "words": {"vibrate": "振动", "sound": "声音", "tight": "紧的"}, "story": "A strange humming sound comes from the music room. Maya stops outside the door. Is someone singing inside a box?\n\nLeo listens. It sounds like a very small monster with a cold.\n\nThey knock and enter. Their music teacher is holding an empty tissue box with rubber bands stretched around it.\n\nMeet my new instrument, she says.\n\nPip looks into the box. No monster detected.\n\nThe teacher gently plucks a rubber band. It moves back and forth so quickly that its middle looks blurry. The box makes a soft musical sound.\n\nThat movement is called vibration, she explains. The moving band makes the air around it vibrate, too.\n\nMaya touches the band gently. The movement stops, and the sound stops.\n\nLeo tries a tighter band. It makes a higher sound. He tries again, listening carefully.\n\nCan we play a song? Maya asks.\n\nYou can try, says the teacher, but first listen to the notes you have.\n\nTheir first song is not beautiful. Pip calls it A Robot Falling Down the Stairs. Their second song is better.\n\nMaya hums along and puts a hand lightly on her throat. She feels a tiny movement.\n\nMy voice makes vibrations, too!\n\nPip records the concert. He saves it under Music, then thinks for a moment and adds a second label: Very Interesting Noise.", "fact": "Sound begins with vibration. Moving objects can make nearby air vibrate, and those changes travel to our ears. Vocal folds in your throat vibrate when you speak. A tighter string usually makes a higher note when its other important features stay the same.", "recap": "The mystery sound came from a rubber-band instrument. When the band vibrated, the children heard a note. When Maya stopped the movement, the note stopped. They discovered that their own voices involve vibration, too.", "phrases": ["What can you hear?", "The room is noisy.", "I can feel it moving."], "question": "What happened when Maya gently stopped the rubber band from moving?", "answer": "The sound stopped because the rubber band was no longer vibrating.", "wonder": "Which objects around you vibrate when they make a sound?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 217.344, "word_count": 443, "words_per_minute_including_pauses": 122.3, "input_sha256": "5cc8a50c103b29183180d667cad824688acd61fd7a25c351bdb59a7fc4637c01", "audio_sha256": "153b37412617f19138c7c4d8d2ddc170c10e4b2900cefd34fe14ee9e01a7c1ff", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/04_the_mystery_humming_box.mp3", "transcript": "transcripts/04_the_mystery_humming_box.md", "subtitle": "subtitles/04_the_mystery_humming_box.srt", "speech": "The Curiosity Club. Episode 4. The Mystery Humming Box.\n\nHere is something to listen for. What happened when Maya gently stopped the rubber band from moving?\n\nReady? Let us find out.\n\nA strange humming sound comes from the music room. Maya stops outside the door. Is someone singing inside a box?\n\nLeo listens. It sounds like a very small monster with a cold.\n\nThey knock and enter. Their music teacher is holding an empty tissue box with rubber bands stretched around it.\n\nMeet my new instrument, she says.\n\nPip looks into the box. No monster detected.\n\nThe teacher gently plucks a rubber band. It moves back and forth so quickly that its middle looks blurry. The box makes a soft musical sound.\n\nThat movement is called vibration, she explains. The moving band makes the air around it vibrate, too.\n\nMaya touches the band gently. The movement stops, and the sound stops.\n\nLeo tries a tighter band. It makes a higher sound. He tries again, listening carefully.\n\nCan we play a song? Maya asks.\n\nYou can try, says the teacher, but first listen to the notes you have.\n\nTheir first song is not beautiful. Pip calls it A Robot Falling Down the Stairs. Their second song is better.\n\nMaya hums along and puts a hand lightly on her throat. She feels a tiny movement.\n\nMy voice makes vibrations, too!\n\nPip records the concert. He saves it under Music, then thinks for a moment and adds a second label: Very Interesting Noise.\n\nNow, a little more to discover.\n\nSound begins with vibration. Moving objects can make nearby air vibrate, and those changes travel to our ears. Vocal folds in your throat vibrate when you speak. A tighter string usually makes a higher note when its other important features stay the same.\n\nLet us hear the main idea again.\n\nThe mystery sound came from a rubber-band instrument. When the band vibrated, the children heard a note. When Maya stopped the movement, the note stopped. They discovered that their own voices involve vibration, too.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat can you hear?\nWhat can you hear?\n\nThe room is noisy.\nThe room is noisy.\n\nI can feel it moving.\nI can feel it moving.\n\nRemember our listening question? What happened when Maya gently stopped the rubber band from moving?\n\nHere is the answer. The sound stopped because the rubber band was no longer vibrating.\n\nAnd here is a question just for your imagination. Which objects around you vibrate when they make a sound?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 5, "title": "Pancakes with Tiny Rooms", "title_zh": "煎饼里的小房间", "category": "校园里的好奇心", "focus": "cooking club、some/any；气泡与食物", "summary_zh": "松软煎饼里的小孔从哪里来？", "words": {"batter": "面糊", "bubble": "气泡", "ingredient": "原料"}, "story": "Today the cooking club is making pancakes. An adult handles the hot pan. Maya reads the recipe, and Leo measures the ingredients.\n\nPip wants to help. I have added an important ingredient, he announces.\n\nWhat ingredient? asks Maya.\n\nEncouragement. You are doing very well.\n\nThey mix flour, milk, an egg, and a little baking powder. Leo sees bubbles appearing in the batter.\n\nIs it breathing? he asks.\n\nNo, says Ms. Park. The baking powder helps make gas. That gas forms bubbles.\n\nWhen the first pancake is ready, she cuts it open. Inside are many tiny holes.\n\nIt has rooms! says Maya.\n\nCan I move in? Pip asks.\n\nOnly if you become much smaller, Leo says.\n\nThey compare the fluffy pancake with a thin piece that has fewer little spaces. The textures feel different.\n\nMaya writes a note for the club: Tiny bubbles can make a big difference.\n\nLeo wants to add ten times as much baking powder. Then we could make the tallest pancake in the world.\n\nMs. Park shakes her head. More is not always better. Recipes use amounts that work together.\n\nPip makes a menu. Today's special: a pancake with many rooms, no windows, and a very short life.\n\nWhy a short life? Maya asks.\n\nBecause Leo is about to eat it.", "fact": "Baking powder can release carbon dioxide gas when it becomes wet, and many kinds release more when heated. Bubbles help batter rise. As the pancake cooks, its structure firms up around tiny spaces. Those spaces help make the pancake feel light and soft.", "recap": "The cooking club found tiny holes inside a pancake. Gas bubbles helped create those spaces. They followed a recipe instead of simply adding more baking powder. Pip supplied encouragement, but no real ingredients.", "phrases": ["Would you like some pancakes?", "Yes, please. They look delicious.", "Let me read the recipe."], "question": "What helped make the tiny spaces inside the pancake?", "answer": "Gas bubbles in the batter helped make the spaces as the pancake cooked.", "wonder": "What other foods have little holes or bubbles inside them?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 227.952, "word_count": 438, "words_per_minute_including_pauses": 115.3, "input_sha256": "6f3105a0ff2fd6cb90249e7a7f0d6cc98a1fcbabc53e139441ccaa1569697ac9", "audio_sha256": "ef79d4e7374d3b94195180a27e2e96a927a587b441d5b04d7771184f2f6c9164", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/05_pancakes_with_tiny_rooms.mp3", "transcript": "transcripts/05_pancakes_with_tiny_rooms.md", "subtitle": "subtitles/05_pancakes_with_tiny_rooms.srt", "speech": "The Curiosity Club. Episode 5. Pancakes with Tiny Rooms.\n\nHere is something to listen for. What helped make the tiny spaces inside the pancake?\n\nReady? Let us find out.\n\nToday the cooking club is making pancakes. An adult handles the hot pan. Maya reads the recipe, and Leo measures the ingredients.\n\nPip wants to help. I have added an important ingredient, he announces.\n\nWhat ingredient? asks Maya.\n\nEncouragement. You are doing very well.\n\nThey mix flour, milk, an egg, and a little baking powder. Leo sees bubbles appearing in the batter.\n\nIs it breathing? he asks.\n\nNo, says Ms. Park. The baking powder helps make gas. That gas forms bubbles.\n\nWhen the first pancake is ready, she cuts it open. Inside are many tiny holes.\n\nIt has rooms! says Maya.\n\nCan I move in? Pip asks.\n\nOnly if you become much smaller, Leo says.\n\nThey compare the fluffy pancake with a thin piece that has fewer little spaces. The textures feel different.\n\nMaya writes a note for the club: Tiny bubbles can make a big difference.\n\nLeo wants to add ten times as much baking powder. Then we could make the tallest pancake in the world.\n\nMs. Park shakes her head. More is not always better. Recipes use amounts that work together.\n\nPip makes a menu. Today's special: a pancake with many rooms, no windows, and a very short life.\n\nWhy a short life? Maya asks.\n\nBecause Leo is about to eat it.\n\nNow, a little more to discover.\n\nBaking powder can release carbon dioxide gas when it becomes wet, and many kinds release more when heated. Bubbles help batter rise. As the pancake cooks, its structure firms up around tiny spaces. Those spaces help make the pancake feel light and soft.\n\nLet us hear the main idea again.\n\nThe cooking club found tiny holes inside a pancake. Gas bubbles helped create those spaces. They followed a recipe instead of simply adding more baking powder. Pip supplied encouragement, but no real ingredients.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWould you like some pancakes?\nWould you like some pancakes?\n\nYes, please. They look delicious.\nYes, please. They look delicious.\n\nLet me read the recipe.\nLet me read the recipe.\n\nRemember our listening question? What helped make the tiny spaces inside the pancake?\n\nHere is the answer. Gas bubbles in the batter helped make the spaces as the pancake cooked.\n\nAnd here is a question just for your imagination. What other foods have little holes or bubbles inside them?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 6, "title": "The Map with a Missing Key", "title_zh": "缺少图例的寻宝地图", "category": "校园里的好奇心", "focus": "where、turn left/right、next to；地图符号", "summary_zh": "地图上的星星真的是宝藏吗？先读懂符号的意思。", "words": {"map": "地图", "symbol": "符号", "key": "图例；此处不是钥匙"}, "story": "Maya finds a map for the school treasure hunt. A star sits beside a square. A blue line crosses the page. Three green circles stand near the bottom.\n\nThe star must be treasure, says Leo.\n\nPip disagrees. It could be a spaceship parking area.\n\nThey walk to the place marked with a star. It is the school office. There is no treasure, and the secretary has not seen any spaceships.\n\nDo you have the map key? she asks.\n\nWe do not need a key, says Leo. Nothing is locked.\n\nA map key explains the symbols, she tells him. It is also called a legend.\n\nMaya unfolds the bottom of the paper. There it is. The star means information desk. The square means building. The blue line is a stream, and the green circles are large trees.\n\nNow the first clue makes sense. Start at the information desk. Turn right at the stream. Look beside the three trees.\n\nThey follow the instructions and find a small box. Inside is the next clue.\n\nPip looks proud. My navigation system is excellent.\n\nYou thought the office was a spaceship parking area, Leo reminds him.\n\nThat possibility has now been removed, says Pip.\n\nMaya puts the map away carefully, with the key still visible. This time, they know what their information means.", "fact": "Maps use symbols to show places without drawing every detail. A map key explains those symbols. A direction arrow can help you orient the map. Symbols are useful only when readers know what they mean; a star does not always mean the same thing on every map.", "recap": "The children guessed what the map's symbols meant and went to the wrong place. After reading the key, they understood the star, stream, and trees. Clear meanings turned a confusing picture into useful directions.", "phrases": ["Excuse me. Where is the office?", "Turn right at the stream.", "It is next to the trees."], "question": "What did the star mean on this particular map?", "answer": "It meant the information desk. The map key explained its meaning.", "wonder": "What symbol would you invent for a quiet reading spot? How would you explain it?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 223.176, "word_count": 456, "words_per_minute_including_pauses": 122.6, "input_sha256": "974918fcb13f1ddc3e1147b4ae1982468af10541bed379ed3ec77b85905f5a2d", "audio_sha256": "08e82c2102e7c6a9057d6e0084436b4ea4dbf85d7f00c36e074e087f3aaa1bbd", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/06_the_map_with_a_missing_key.mp3", "transcript": "transcripts/06_the_map_with_a_missing_key.md", "subtitle": "subtitles/06_the_map_with_a_missing_key.srt", "speech": "The Curiosity Club. Episode 6. The Map with a Missing Key.\n\nHere is something to listen for. What did the star mean on this particular map?\n\nReady? Let us find out.\n\nMaya finds a map for the school treasure hunt. A star sits beside a square. A blue line crosses the page. Three green circles stand near the bottom.\n\nThe star must be treasure, says Leo.\n\nPip disagrees. It could be a spaceship parking area.\n\nThey walk to the place marked with a star. It is the school office. There is no treasure, and the secretary has not seen any spaceships.\n\nDo you have the map key? she asks.\n\nWe do not need a key, says Leo. Nothing is locked.\n\nA map key explains the symbols, she tells him. It is also called a legend.\n\nMaya unfolds the bottom of the paper. There it is. The star means information desk. The square means building. The blue line is a stream, and the green circles are large trees.\n\nNow the first clue makes sense. Start at the information desk. Turn right at the stream. Look beside the three trees.\n\nThey follow the instructions and find a small box. Inside is the next clue.\n\nPip looks proud. My navigation system is excellent.\n\nYou thought the office was a spaceship parking area, Leo reminds him.\n\nThat possibility has now been removed, says Pip.\n\nMaya puts the map away carefully, with the key still visible. This time, they know what their information means.\n\nNow, a little more to discover.\n\nMaps use symbols to show places without drawing every detail. A map key explains those symbols. A direction arrow can help you orient the map. Symbols are useful only when readers know what they mean; a star does not always mean the same thing on every map.\n\nLet us hear the main idea again.\n\nThe children guessed what the map's symbols meant and went to the wrong place. After reading the key, they understood the star, stream, and trees. Clear meanings turned a confusing picture into useful directions.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nExcuse me. Where is the office?\nExcuse me. Where is the office?\n\nTurn right at the stream.\nTurn right at the stream.\n\nIt is next to the trees.\nIt is next to the trees.\n\nRemember our listening question? What did the star mean on this particular map?\n\nHere is the answer. It meant the information desk. The map key explained its meaning.\n\nAnd here is a question just for your imagination. What symbol would you invent for a quiet reading spot? How would you explain it?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 7, "title": "A Day for a Tiny Planet", "title_zh": "小地球的一天", "category": "校园里的好奇心", "focus": "every day、now、at night；昼夜", "summary_zh": "用地球仪和灯，弄明白为什么一边白天、一边黑夜。", "words": {"globe": "地球仪", "rotate": "旋转", "surface": "表面"}, "story": "Leo draws a picture of the Sun going to bed. It wears pajamas and carries a toothbrush.\n\nIs that why it gets dark? Pip asks.\n\nIn my picture, yes, says Leo. In real life, probably not.\n\nMs. Park puts a globe beside a lamp. The lamp represents the Sun. She places a small sticker on the globe for their school.\n\nAt first, the sticker faces the lamp. This side is receiving sunlight, Maya says.\n\nThen Ms. Park turns the globe. The sticker moves into the dark side.\n\nDid the lamp turn off? she asks.\n\nNo. Our part of the globe turned away, says Leo.\n\nThey slowly rotate the globe again. Their school moves back into the light.\n\nGood morning, tiny school, says Pip. I hope your tiny students remembered their homework.\n\nMaya adds another sticker on a distant part of the globe. When our sticker is in the light, that one can be in the dark.\n\nSo people do not all eat breakfast at the same moment, Leo says.\n\nPip is worried. How do I know when to announce lunch?\n\nUse the clock where you are, says Maya.\n\nLeo changes his drawing. Now the Sun stays in place while a little Earth turns beside it. He keeps the pajamas in one corner.\n\nThose are for me, he explains. Learning about night has made me sleepy.", "fact": "Earth rotates. A full turn relative to the Sun takes about twenty-four hours, giving us the familiar day-and-night cycle. The side facing the Sun has daylight; the side facing away has night. Earth's yearly trip around the Sun is a different movement.", "recap": "A lamp and a globe helped the club model day and night. Their school sticker moved into light and then darkness as the globe turned. The Sun did not need to switch off or go to bed.", "phrases": ["What time is it where you are?", "It is daytime here.", "Our part of Earth is turning away."], "question": "What movement mainly causes day and night on Earth?", "answer": "Earth's rotation causes different parts of its surface to face toward or away from the Sun.", "wonder": "If you could call a friend on the other side of Earth, what might that friend be doing?", "sources": ["https://spaceplace.nasa.gov/days/en/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 212.976, "word_count": 474, "words_per_minute_including_pauses": 133.5, "input_sha256": "6f27da2b99488f2ac28de7ed6bde4f56503726f12e54f959bce588fcf84c8c9a", "audio_sha256": "120dea615b3ed85d5bde05a2dc24e65ef220c64e310c6175037757fa5381cc54", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/07_a_day_for_a_tiny_planet.mp3", "transcript": "transcripts/07_a_day_for_a_tiny_planet.md", "subtitle": "subtitles/07_a_day_for_a_tiny_planet.srt", "speech": "The Curiosity Club. Episode 7. A Day for a Tiny Planet.\n\nHere is something to listen for. What movement mainly causes day and night on Earth?\n\nReady? Let us find out.\n\nLeo draws a picture of the Sun going to bed. It wears pajamas and carries a toothbrush.\n\nIs that why it gets dark? Pip asks.\n\nIn my picture, yes, says Leo. In real life, probably not.\n\nMs. Park puts a globe beside a lamp. The lamp represents the Sun. She places a small sticker on the globe for their school.\n\nAt first, the sticker faces the lamp. This side is receiving sunlight, Maya says.\n\nThen Ms. Park turns the globe. The sticker moves into the dark side.\n\nDid the lamp turn off? she asks.\n\nNo. Our part of the globe turned away, says Leo.\n\nThey slowly rotate the globe again. Their school moves back into the light.\n\nGood morning, tiny school, says Pip. I hope your tiny students remembered their homework.\n\nMaya adds another sticker on a distant part of the globe. When our sticker is in the light, that one can be in the dark.\n\nSo people do not all eat breakfast at the same moment, Leo says.\n\nPip is worried. How do I know when to announce lunch?\n\nUse the clock where you are, says Maya.\n\nLeo changes his drawing. Now the Sun stays in place while a little Earth turns beside it. He keeps the pajamas in one corner.\n\nThose are for me, he explains. Learning about night has made me sleepy.\n\nNow, a little more to discover.\n\nEarth rotates. A full turn relative to the Sun takes about twenty-four hours, giving us the familiar day-and-night cycle. The side facing the Sun has daylight; the side facing away has night. Earth's yearly trip around the Sun is a different movement.\n\nLet us hear the main idea again.\n\nA lamp and a globe helped the club model day and night. Their school sticker moved into light and then darkness as the globe turned. The Sun did not need to switch off or go to bed.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat time is it where you are?\nWhat time is it where you are?\n\nIt is daytime here.\nIt is daytime here.\n\nOur part of Earth is turning away.\nOur part of Earth is turning away.\n\nRemember our listening question? What movement mainly causes day and night on Earth?\n\nHere is the answer. Earth's rotation causes different parts of its surface to face toward or away from the Sun.\n\nAnd here is a question just for your imagination. If you could call a friend on the other side of Earth, what might that friend be doing?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 8, "title": "The Dinosaur at the Window", "title_zh": "窗边的小恐龙", "category": "校园里的好奇心", "focus": "was/were、is/are；比较过去和现在", "summary_zh": "博物馆里的恐龙和窗外的小鸟，竟然存在联系。", "words": {"fossil": "化石", "feather": "羽毛", "relative": "亲属；有亲缘关系的生物"}, "story": "At the museum, Maya stands under an enormous dinosaur skeleton. Leo looks at its teeth.\n\nI am glad it does not want my sandwich, he says.\n\nPip reads a sign. Some dinosaurs had feathers.\n\nLike a chicken? asks Maya.\n\nThe guide smiles. Birds belong to a branch of the dinosaur family tree. They are living dinosaurs.\n\nLeo looks toward the window. A small bird is sitting outside.\n\nThat little bird?\n\nYes, says the guide. Not every dinosaur was huge. Scientists compare fossils and living animals to understand their relationships.\n\nPip imagines the little bird carrying the giant skeleton away. His screen displays a warning: Size mismatch.\n\nBeing related does not mean being the same size, Maya tells him.\n\nThe guide shows them a fossil with marks left by feathers. They cannot hear the animal or see it move, but the fossil preserves clues from long ago.\n\nDid this dinosaur sound like a duck? Leo asks.\n\nThat is an interesting question, says the guide. We cannot know every ancient sound just by looking at bones.\n\nOutside, the little bird chirps. Leo holds his sandwich close.\n\nI respect your family history, he tells the bird, but this lunch is mine.\n\nPip writes in his museum notebook: Today we met a giant dinosaur indoors and a very small living one outdoors.", "fact": "Modern birds evolved within a group of dinosaurs. Fossils can preserve bones, footprints, and sometimes impressions of feathers. They provide evidence about ancient life, but they do not answer every question. Scientists separate what evidence supports from what remains uncertain.", "recap": "The museum visit connected a huge skeleton with a small bird outside. Birds are part of the dinosaur family tree. Fossils helped scientists discover that relationship, while some questions, such as many ancient sounds, remain difficult to answer.", "phrases": ["What was it like long ago?", "They are related, but they are different.", "We need more evidence."], "question": "Are all dinosaurs completely gone from Earth?", "answer": "No. Modern birds are living members of the dinosaur family tree, although the other dinosaur groups died out.", "wonder": "What would you ask a scientist who studies fossils?", "sources": ["https://www.nhm.ac.uk/discover/why-are-birds-the-only-surviving-dinosaurs.html"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 224.616, "word_count": 449, "words_per_minute_including_pauses": 119.9, "input_sha256": "5c7a89663bc050da980b297df01020198f1bcdc3a10bb918a90bdab5204a2311", "audio_sha256": "9414d69c64f331688e51c21cb21e5661e14cb1aa30504f88b4e3d465f3cb53e3", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/08_the_dinosaur_at_the_window.mp3", "transcript": "transcripts/08_the_dinosaur_at_the_window.md", "subtitle": "subtitles/08_the_dinosaur_at_the_window.srt", "speech": "The Curiosity Club. Episode 8. The Dinosaur at the Window.\n\nHere is something to listen for. Are all dinosaurs completely gone from Earth?\n\nReady? Let us find out.\n\nAt the museum, Maya stands under an enormous dinosaur skeleton. Leo looks at its teeth.\n\nI am glad it does not want my sandwich, he says.\n\nPip reads a sign. Some dinosaurs had feathers.\n\nLike a chicken? asks Maya.\n\nThe guide smiles. Birds belong to a branch of the dinosaur family tree. They are living dinosaurs.\n\nLeo looks toward the window. A small bird is sitting outside.\n\nThat little bird?\n\nYes, says the guide. Not every dinosaur was huge. Scientists compare fossils and living animals to understand their relationships.\n\nPip imagines the little bird carrying the giant skeleton away. His screen displays a warning: Size mismatch.\n\nBeing related does not mean being the same size, Maya tells him.\n\nThe guide shows them a fossil with marks left by feathers. They cannot hear the animal or see it move, but the fossil preserves clues from long ago.\n\nDid this dinosaur sound like a duck? Leo asks.\n\nThat is an interesting question, says the guide. We cannot know every ancient sound just by looking at bones.\n\nOutside, the little bird chirps. Leo holds his sandwich close.\n\nI respect your family history, he tells the bird, but this lunch is mine.\n\nPip writes in his museum notebook: Today we met a giant dinosaur indoors and a very small living one outdoors.\n\nNow, a little more to discover.\n\nModern birds evolved within a group of dinosaurs. Fossils can preserve bones, footprints, and sometimes impressions of feathers. They provide evidence about ancient life, but they do not answer every question. Scientists separate what evidence supports from what remains uncertain.\n\nLet us hear the main idea again.\n\nThe museum visit connected a huge skeleton with a small bird outside. Birds are part of the dinosaur family tree. Fossils helped scientists discover that relationship, while some questions, such as many ancient sounds, remain difficult to answer.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat was it like long ago?\nWhat was it like long ago?\n\nThey are related, but they are different.\nThey are related, but they are different.\n\nWe need more evidence.\nWe need more evidence.\n\nRemember our listening question? Are all dinosaurs completely gone from Earth?\n\nHere is the answer. No. Modern birds are living members of the dinosaur family tree, although the other dinosaur groups died out.\n\nAnd here is a question just for your imagination. What would you ask a scientist who studies fossils?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 9, "title": "Eight Arms and Three Hearts", "title_zh": "八只腕足与三颗心", "category": "动物世界", "focus": "how many、can/cannot；生物特征", "summary_zh": "水族馆里，一只章鱼把自己藏进了背景。", "words": {"octopus": "章鱼", "camouflage": "伪装；保护色", "gill": "鳃"}, "story": "Maya and Leo visit an aquarium. A sign says that an octopus lives in the tank in front of them. They can see rocks, water, and a small crab. They cannot see an octopus.\n\nPerhaps it went shopping, Leo says. With eight arms, it could carry all the bags.\n\nThe keeper points to a shape beside a rock. Watch closely.\n\nThe shape slowly moves. A brown arm uncurls, and two eyes appear. The octopus has been there all along.\n\nIts color looked like the rocks, says Maya.\n\nThe keeper explains that many octopuses can change their color and the appearance of their skin. That helps them blend into their surroundings.\n\nPip tries to hide by standing beside a gray trash can.\n\nWe can still see your flashing lights, Leo tells him.\n\nThe octopus crawls into a sheltered space. The crab moves away in another direction.\n\nDoes it have eight hearts for its eight arms? Maya asks.\n\nThree hearts, says the keeper. Two send blood through the gills, and one sends it around the rest of the body.\n\nPip counts on his metal fingers. Eight arms, three hearts, and excellent hiding skills.\n\nWould you like eight arms? Leo asks Maya.\n\nOnly until it is time to put on my jacket, she replies. Finding eight sleeves every morning would take forever.", "fact": "An octopus has eight arms and three hearts. Its gills take oxygen from water. Many octopuses use changes in color and skin texture as camouflage. These features belong to the animal's biology; the shopping trip and eight-sleeved jacket belong only to our imagination.", "recap": "The octopus was hiding in plain sight. Its appearance blended with the rocks. At the aquarium, the children learned about its arms, hearts, and camouflage. Pip discovered that flashing lights are not useful when trying to hide.", "phrases": ["I cannot see it yet.", "Look closely beside the rock.", "How many hearts does it have?"], "question": "Why was the octopus difficult to see at first?", "answer": "Its appearance blended with the rocks around it. That kind of disguise is called camouflage.", "wonder": "If you designed a jacket for eight arms, where would you put the pockets?", "sources": ["https://ocean.si.edu/ocean-life/invertebrates/octopuses-squids-and-relatives"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 216.288, "word_count": 457, "words_per_minute_including_pauses": 126.8, "input_sha256": "8525147de6e674b6dadee06a0420983e0e0b42a17fde6d0bea37ff067b00e434", "audio_sha256": "8321633ab0b5fc5df08d0dd918a8b39f8439d1d30f3f66202391596edcec1c27", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/09_eight_arms_and_three_hearts.mp3", "transcript": "transcripts/09_eight_arms_and_three_hearts.md", "subtitle": "subtitles/09_eight_arms_and_three_hearts.srt", "speech": "The Curiosity Club. Episode 9. Eight Arms and Three Hearts.\n\nHere is something to listen for. Why was the octopus difficult to see at first?\n\nReady? Let us find out.\n\nMaya and Leo visit an aquarium. A sign says that an octopus lives in the tank in front of them. They can see rocks, water, and a small crab. They cannot see an octopus.\n\nPerhaps it went shopping, Leo says. With eight arms, it could carry all the bags.\n\nThe keeper points to a shape beside a rock. Watch closely.\n\nThe shape slowly moves. A brown arm uncurls, and two eyes appear. The octopus has been there all along.\n\nIts color looked like the rocks, says Maya.\n\nThe keeper explains that many octopuses can change their color and the appearance of their skin. That helps them blend into their surroundings.\n\nPip tries to hide by standing beside a gray trash can.\n\nWe can still see your flashing lights, Leo tells him.\n\nThe octopus crawls into a sheltered space. The crab moves away in another direction.\n\nDoes it have eight hearts for its eight arms? Maya asks.\n\nThree hearts, says the keeper. Two send blood through the gills, and one sends it around the rest of the body.\n\nPip counts on his metal fingers. Eight arms, three hearts, and excellent hiding skills.\n\nWould you like eight arms? Leo asks Maya.\n\nOnly until it is time to put on my jacket, she replies. Finding eight sleeves every morning would take forever.\n\nNow, a little more to discover.\n\nAn octopus has eight arms and three hearts. Its gills take oxygen from water. Many octopuses use changes in color and skin texture as camouflage. These features belong to the animal's biology; the shopping trip and eight-sleeved jacket belong only to our imagination.\n\nLet us hear the main idea again.\n\nThe octopus was hiding in plain sight. Its appearance blended with the rocks. At the aquarium, the children learned about its arms, hearts, and camouflage. Pip discovered that flashing lights are not useful when trying to hide.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nI cannot see it yet.\nI cannot see it yet.\n\nLook closely beside the rock.\nLook closely beside the rock.\n\nHow many hearts does it have?\nHow many hearts does it have?\n\nRemember our listening question? Why was the octopus difficult to see at first?\n\nHere is the answer. Its appearance blended with the rocks around it. That kind of disguise is called camouflage.\n\nAnd here is a question just for your imagination. If you designed a jacket for eight arms, where would you put the pockets?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 10, "title": "The Nighttime Sound Map", "title_zh": "夜空中的声音地图", "category": "动物世界", "focus": "hear/listen、because；回声定位", "summary_zh": "跟随自然观察员，发现蝙蝠怎样利用回声。", "words": {"bat": "蝙蝠", "echo": "回声", "insect": "昆虫"}, "story": "At sunset, a nature guide takes the club to a park. Everyone stays on the path and watches the sky.\n\nA small shape flies above the trees. Then another appears.\n\nAre those birds? Maya asks.\n\nThey are bats, says the guide. Bats are mammals, and they can truly fly.\n\nLeo has heard that bats cannot see. The guide explains that bats have eyes and are not blind. Many also use sound to find their way and catch insects.\n\nShe turns on a special detector. It changes some bat calls into sounds people can hear. The speaker makes quick clicks.\n\nPip listens carefully. That sounds like someone typing a very urgent message.\n\nA bat sends out calls, the guide says. Sound bounces off objects, and returning echoes give it information.\n\nLike shouting in a large empty hall? Leo asks.\n\nThe idea of an echo is similar, though a bat uses much finer information.\n\nMaya imagines a picture made from returning sounds. The bat turns quickly, then disappears over the pond.\n\nCould I find my missing sock by shouting at it? Leo asks.\n\nYou could begin by looking under your bed, says Maya.\n\nPip records a message for the sock: Please report your location.\n\nThere is no reply. Some mysteries still need a flashlight and a careful search.", "fact": "Many bats use echolocation: they produce calls and listen to returning echoes. Those echoes can help them locate objects and prey. Many of the calls are too high-pitched for human ears. Bats also have vision, and different species rely on different senses to different degrees.", "recap": "The club watched bats and heard a detector turn high calls into audible clicks. Returning echoes help many bats navigate. The guide also corrected a common mistake: bats are not blind.", "phrases": ["Listen carefully to the sound.", "What does it tell us?", "It helps them find their way."], "question": "What information returns to a bat after its call reaches an object?", "answer": "An echo returns. The bat can use that returning sound to learn about what is nearby.", "wonder": "Where have you heard an echo, and what made it different from the original sound?", "sources": ["https://www.si.edu/spotlight/bats/batfacts"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 219.912, "word_count": 457, "words_per_minute_including_pauses": 124.7, "input_sha256": "e95451c1bb6f8d2bb525a5f3d24bdae9fe712b7849dbe450c5d60cc1175933fd", "audio_sha256": "61eb1a7c53b4d9c92207c044a8b8b1ce4efdab732fa238eaccab8b66a1db4bcf", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/10_the_nighttime_sound_map.mp3", "transcript": "transcripts/10_the_nighttime_sound_map.md", "subtitle": "subtitles/10_the_nighttime_sound_map.srt", "speech": "The Curiosity Club. Episode 10. The Nighttime Sound Map.\n\nHere is something to listen for. What information returns to a bat after its call reaches an object?\n\nReady? Let us find out.\n\nAt sunset, a nature guide takes the club to a park. Everyone stays on the path and watches the sky.\n\nA small shape flies above the trees. Then another appears.\n\nAre those birds? Maya asks.\n\nThey are bats, says the guide. Bats are mammals, and they can truly fly.\n\nLeo has heard that bats cannot see. The guide explains that bats have eyes and are not blind. Many also use sound to find their way and catch insects.\n\nShe turns on a special detector. It changes some bat calls into sounds people can hear. The speaker makes quick clicks.\n\nPip listens carefully. That sounds like someone typing a very urgent message.\n\nA bat sends out calls, the guide says. Sound bounces off objects, and returning echoes give it information.\n\nLike shouting in a large empty hall? Leo asks.\n\nThe idea of an echo is similar, though a bat uses much finer information.\n\nMaya imagines a picture made from returning sounds. The bat turns quickly, then disappears over the pond.\n\nCould I find my missing sock by shouting at it? Leo asks.\n\nYou could begin by looking under your bed, says Maya.\n\nPip records a message for the sock: Please report your location.\n\nThere is no reply. Some mysteries still need a flashlight and a careful search.\n\nNow, a little more to discover.\n\nMany bats use echolocation: they produce calls and listen to returning echoes. Those echoes can help them locate objects and prey. Many of the calls are too high-pitched for human ears. Bats also have vision, and different species rely on different senses to different degrees.\n\nLet us hear the main idea again.\n\nThe club watched bats and heard a detector turn high calls into audible clicks. Returning echoes help many bats navigate. The guide also corrected a common mistake: bats are not blind.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nListen carefully to the sound.\nListen carefully to the sound.\n\nWhat does it tell us?\nWhat does it tell us?\n\nIt helps them find their way.\nIt helps them find their way.\n\nRemember our listening question? What information returns to a bat after its call reaches an object?\n\nHere is the answer. An echo returns. The bat can use that returning sound to learn about what is nearby.\n\nAnd here is a question just for your imagination. Where have you heard an echo, and what made it different from the original sound?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 11, "title": "A Dance That Gives Directions", "title_zh": "会指路的舞蹈", "category": "动物世界", "focus": "where、how far；交流方式", "summary_zh": "蜜蜂不发地址，却能把食物位置告诉同伴。", "words": {"hive": "蜂巢", "nectar": "花蜜", "direction": "方向"}, "story": "The club watches a beekeeper's video. A honeybee moves across a crowded surface inside a hive. It walks forward, wiggles, and turns.\n\nThat bee is having a party, Leo says.\n\nPerhaps, says Maya, but the others seem to be listening with their feet.\n\nThe beekeeper explains that a returning worker can use a waggle dance to share information about food. The movements give other bees clues about direction and distance.\n\nPip immediately begins a dance. He moves left, turns twice, and rolls backward into a cushion.\n\nWhat were you saying? asks Maya.\n\nThe snack table is near the door.\n\nWe need your dance dictionary first, Leo says.\n\nThey play a human direction game. One clap means move one step. A raised right hand means turn right. Before starting, everyone agrees on the rules.\n\nMaya follows Leo's signals and reaches a paper flower. Pip follows them and reaches the same flower.\n\nNow we understand each other, Maya says.\n\nThe beekeeper reminds them that their invented game is not an exact copy of a bee's dance. It is just a way to think about communication.\n\nLeo invents a new signal: both hands on his stomach.\n\nI know that one, says Maya. You are hungry.\n\nPip adds it to his dictionary. Some messages, he concludes, are easier than others.", "fact": "Honeybee workers can communicate information about a food source through a waggle dance. Its pattern carries clues about where the food is. Bees also use other signals, including smells. Their dance is an animal communication system, not a human language translated into tiny steps.", "recap": "A honeybee's dance gave other bees information about food. The children invented their own signal game and discovered that shared rules matter. Pip's first dance failed because nobody knew what it meant.", "phrases": ["Where can we find it?", "How far away is it?", "Let us agree on the rules."], "question": "What useful information can a waggle dance share?", "answer": "It can share clues about the direction and distance of a food source.", "wonder": "How could you tell a friend to open a window without speaking or writing?", "sources": ["https://www.si.edu/object/whats-waggle-dance-and-why-do-honey-bees-do-it%3Ayt_LU_KD1enR3Q"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 212.064, "word_count": 445, "words_per_minute_including_pauses": 125.9, "input_sha256": "c80477d3f1d0d5d4a3312718a72106ecda713b16d288850763531eff1a510ee7", "audio_sha256": "d252cf20eba426e9cfbb9d6324b3b776254725b7af6329febc09886db5d890e4", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/11_a_dance_that_gives_directions.mp3", "transcript": "transcripts/11_a_dance_that_gives_directions.md", "subtitle": "subtitles/11_a_dance_that_gives_directions.srt", "speech": "The Curiosity Club. Episode 11. A Dance That Gives Directions.\n\nHere is something to listen for. What useful information can a waggle dance share?\n\nReady? Let us find out.\n\nThe club watches a beekeeper's video. A honeybee moves across a crowded surface inside a hive. It walks forward, wiggles, and turns.\n\nThat bee is having a party, Leo says.\n\nPerhaps, says Maya, but the others seem to be listening with their feet.\n\nThe beekeeper explains that a returning worker can use a waggle dance to share information about food. The movements give other bees clues about direction and distance.\n\nPip immediately begins a dance. He moves left, turns twice, and rolls backward into a cushion.\n\nWhat were you saying? asks Maya.\n\nThe snack table is near the door.\n\nWe need your dance dictionary first, Leo says.\n\nThey play a human direction game. One clap means move one step. A raised right hand means turn right. Before starting, everyone agrees on the rules.\n\nMaya follows Leo's signals and reaches a paper flower. Pip follows them and reaches the same flower.\n\nNow we understand each other, Maya says.\n\nThe beekeeper reminds them that their invented game is not an exact copy of a bee's dance. It is just a way to think about communication.\n\nLeo invents a new signal: both hands on his stomach.\n\nI know that one, says Maya. You are hungry.\n\nPip adds it to his dictionary. Some messages, he concludes, are easier than others.\n\nNow, a little more to discover.\n\nHoneybee workers can communicate information about a food source through a waggle dance. Its pattern carries clues about where the food is. Bees also use other signals, including smells. Their dance is an animal communication system, not a human language translated into tiny steps.\n\nLet us hear the main idea again.\n\nA honeybee's dance gave other bees information about food. The children invented their own signal game and discovered that shared rules matter. Pip's first dance failed because nobody knew what it meant.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhere can we find it?\nWhere can we find it?\n\nHow far away is it?\nHow far away is it?\n\nLet us agree on the rules.\nLet us agree on the rules.\n\nRemember our listening question? What useful information can a waggle dance share?\n\nHere is the answer. It can share clues about the direction and distance of a food source.\n\nAnd here is a question just for your imagination. How could you tell a friend to open a window without speaking or writing?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 12, "title": "The Bird That Flies Underwater", "title_zh": "在水下飞翔的鸟", "category": "动物世界", "focus": "can、but、different from；分类与适应", "summary_zh": "企鹅不会在空中飞，为什么仍然是鸟？", "words": {"penguin": "企鹅", "flipper": "鳍状肢", "feather": "羽毛"}, "story": "Leo is making an animal quiz. His first rule says: All birds can fly.\n\nMaya points to a penguin in a nature video. What about that one?\n\nIt is swimming, Leo says. Perhaps it is a fish wearing a jacket.\n\nPip checks his picture library. Jacket detected. Fish status uncertain.\n\nMs. Park explains that penguins are birds. They have feathers, breathe air, and lay eggs. Their wings are shaped for moving through water instead of flying through air.\n\nThe penguin in the video dives, turns, and speeds after a fish. On land, it had looked awkward. Underwater, it looks quick and graceful.\n\nIt almost seems to fly down there, Maya says.\n\nThat is a useful description, says Ms. Park, as long as we remember it is swimming.\n\nLeo changes his quiz rule. Many birds fly, but some do not.\n\nThen he adds another question. Do all penguins live on Antarctic ice?\n\nMs. Park shows them penguins on a rocky coast far from Antarctica. Different species live in different places.\n\nPip tapes paper flippers onto his sides.\n\nDo not try swimming, Maya tells him. You are a classroom robot.\n\nI know, says Pip. These are for my very dry penguin dance.\n\nLeo writes the final quiz question: Which member of our club should definitely stay out of the pool?", "fact": "Penguins are flightless birds with wings adapted for swimming. Their feathers and body features help them live in their environments. Penguin species do not all live on Antarctic ice. Being a bird does not require the ability to fly through the air.", "recap": "Leo's rule that all birds fly needed a correction. Penguins are birds, but their wings work as flippers underwater. The club learned to check a category using several features instead of one familiar example.", "phrases": ["It can swim, but it cannot fly.", "This one is different from that one.", "Does every bird do that?"], "question": "Does a penguin stop being a bird because it cannot fly?", "answer": "No. Penguins are birds even though their wings are adapted for swimming rather than flight in the air.", "wonder": "Can you think of another group whose members do not all do the same thing?", "sources": ["https://ocean.si.edu/ocean-life/seabirds/penguins"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 219.936, "word_count": 465, "words_per_minute_including_pauses": 126.9, "input_sha256": "4a93f81db6b1863ca2c2355d06e972bce1a22f64cbaf870ba665862427e0553c", "audio_sha256": "15d03df73f00d4711630ddbcbc8ee56c5f174f2d1af5ce36507ec06342e7a97b", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/12_the_bird_that_flies_underwater.mp3", "transcript": "transcripts/12_the_bird_that_flies_underwater.md", "subtitle": "subtitles/12_the_bird_that_flies_underwater.srt", "speech": "The Curiosity Club. Episode 12. The Bird That Flies Underwater.\n\nHere is something to listen for. Does a penguin stop being a bird because it cannot fly?\n\nReady? Let us find out.\n\nLeo is making an animal quiz. His first rule says: All birds can fly.\n\nMaya points to a penguin in a nature video. What about that one?\n\nIt is swimming, Leo says. Perhaps it is a fish wearing a jacket.\n\nPip checks his picture library. Jacket detected. Fish status uncertain.\n\nMs. Park explains that penguins are birds. They have feathers, breathe air, and lay eggs. Their wings are shaped for moving through water instead of flying through air.\n\nThe penguin in the video dives, turns, and speeds after a fish. On land, it had looked awkward. Underwater, it looks quick and graceful.\n\nIt almost seems to fly down there, Maya says.\n\nThat is a useful description, says Ms. Park, as long as we remember it is swimming.\n\nLeo changes his quiz rule. Many birds fly, but some do not.\n\nThen he adds another question. Do all penguins live on Antarctic ice?\n\nMs. Park shows them penguins on a rocky coast far from Antarctica. Different species live in different places.\n\nPip tapes paper flippers onto his sides.\n\nDo not try swimming, Maya tells him. You are a classroom robot.\n\nI know, says Pip. These are for my very dry penguin dance.\n\nLeo writes the final quiz question: Which member of our club should definitely stay out of the pool?\n\nNow, a little more to discover.\n\nPenguins are flightless birds with wings adapted for swimming. Their feathers and body features help them live in their environments. Penguin species do not all live on Antarctic ice. Being a bird does not require the ability to fly through the air.\n\nLet us hear the main idea again.\n\nLeo's rule that all birds fly needed a correction. Penguins are birds, but their wings work as flippers underwater. The club learned to check a category using several features instead of one familiar example.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt can swim, but it cannot fly.\nIt can swim, but it cannot fly.\n\nThis one is different from that one.\nThis one is different from that one.\n\nDoes every bird do that?\nDoes every bird do that?\n\nRemember our listening question? Does a penguin stop being a bird because it cannot fly?\n\nHere is the answer. No. Penguins are birds even though their wings are adapted for swimming rather than flight in the air.\n\nAnd here is a question just for your imagination. Can you think of another group whose members do not all do the same thing?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 13, "title": "The Invisible Ant Highway", "title_zh": "看不见的蚂蚁公路", "category": "动物世界", "focus": "follow、each other；气味信息", "summary_zh": "花园里的蚂蚁没有地图，却走出了一条忙碌路线。", "words": {"trail": "小径；踪迹", "antennae": "触角", "chemical": "化学物质"}, "story": "After a picnic, Maya notices ants walking along the garden path. Some go toward a tiny crumb. Others return toward a crack near a tree.\n\nWho painted their road? Leo asks. I cannot see any lines.\n\nPip studies the ground. No road signs. No traffic lights. No parking spaces.\n\nMs. Park explains that many ants can leave chemical trails. Other ants detect those signals with their antennae and follow them.\n\nSo their road can be made of smell? Maya asks.\n\nThat is a helpful way to imagine it, says Ms. Park.\n\nThe children watch without blocking the path. An ant meets another ant, pauses, and continues. Several ants work near the crumb.\n\nLeo imagines a tiny radio station. Attention, everyone. Crumb traffic is heavy near the tree.\n\nPip offers to build a bridge, but Maya stops him. Their path is working. We can just observe.\n\nThe club draws the route in a notebook. They mark where ants enter and leave, then count how many pass one spot in a minute.\n\nThe next minute is different.\n\nOur first count was not the whole story, Maya says.\n\nBefore leaving, they collect their picnic trash and keep the area clean.\n\nPip looks back at the ants. Their highway has no signs, he says, but it seems to have plenty of information.", "fact": "Many ant species use chemicals called pheromones to communicate. A trail can help other ants find a route, such as a path to food. Ants detect chemical signals with their antennae. Different species use different combinations of signals, so one simple rule does not describe every ant.", "recap": "The ants followed a route that people could not see. Chemical signals helped guide them. The children watched, drew a map, and compared counts without disturbing the trail.", "phrases": ["They are following each other.", "Let us watch without touching.", "What changed this time?"], "question": "What can guide many ants along a trail even when there is no visible line?", "answer": "Chemical signals can guide them. Other ants detect those signals with their antennae.", "wonder": "What invisible information do people use, such as sounds, smells, or wireless signals?", "sources": ["https://arxiv.org/abs/1201.5827"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 221.424, "word_count": 454, "words_per_minute_including_pauses": 123.0, "input_sha256": "38b0123a5853687c6697ed180e22b2fe2a9ee6ff8a68a18f1e50b0b8ea65410d", "audio_sha256": "a08fee807e1cdbde3ab65b78fcc7fc0e259420982e57b7cb0221b2d7d289cfb4", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/13_the_invisible_ant_highway.mp3", "transcript": "transcripts/13_the_invisible_ant_highway.md", "subtitle": "subtitles/13_the_invisible_ant_highway.srt", "speech": "The Curiosity Club. Episode 13. The Invisible Ant Highway.\n\nHere is something to listen for. What can guide many ants along a trail even when there is no visible line?\n\nReady? Let us find out.\n\nAfter a picnic, Maya notices ants walking along the garden path. Some go toward a tiny crumb. Others return toward a crack near a tree.\n\nWho painted their road? Leo asks. I cannot see any lines.\n\nPip studies the ground. No road signs. No traffic lights. No parking spaces.\n\nMs. Park explains that many ants can leave chemical trails. Other ants detect those signals with their antennae and follow them.\n\nSo their road can be made of smell? Maya asks.\n\nThat is a helpful way to imagine it, says Ms. Park.\n\nThe children watch without blocking the path. An ant meets another ant, pauses, and continues. Several ants work near the crumb.\n\nLeo imagines a tiny radio station. Attention, everyone. Crumb traffic is heavy near the tree.\n\nPip offers to build a bridge, but Maya stops him. Their path is working. We can just observe.\n\nThe club draws the route in a notebook. They mark where ants enter and leave, then count how many pass one spot in a minute.\n\nThe next minute is different.\n\nOur first count was not the whole story, Maya says.\n\nBefore leaving, they collect their picnic trash and keep the area clean.\n\nPip looks back at the ants. Their highway has no signs, he says, but it seems to have plenty of information.\n\nNow, a little more to discover.\n\nMany ant species use chemicals called pheromones to communicate. A trail can help other ants find a route, such as a path to food. Ants detect chemical signals with their antennae. Different species use different combinations of signals, so one simple rule does not describe every ant.\n\nLet us hear the main idea again.\n\nThe ants followed a route that people could not see. Chemical signals helped guide them. The children watched, drew a map, and compared counts without disturbing the trail.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nThey are following each other.\nThey are following each other.\n\nLet us watch without touching.\nLet us watch without touching.\n\nWhat changed this time?\nWhat changed this time?\n\nRemember our listening question? What can guide many ants along a trail even when there is no visible line?\n\nHere is the answer. Chemical signals can guide them. Other ants detect those signals with their antennae.\n\nAnd here is a question just for your imagination. What invisible information do people use, such as sounds, smells, or wireless signals?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 14, "title": "The Caterpillar's New Chapter", "title_zh": "毛毛虫的新篇章", "category": "动物世界", "focus": "first/then/later；生命阶段", "summary_zh": "蝴蝶不是给毛毛虫装上翅膀，生命变化比这更奇妙。", "words": {"caterpillar": "毛毛虫", "chrysalis": "蝶蛹", "stage": "阶段"}, "story": "The class follows a butterfly life cycle through a garden camera. At first, Maya can hardly see the egg on a leaf. Later, a tiny caterpillar appears.\n\nIt spends a lot of time eating.\n\nLeo nods. I understand this stage very well.\n\nOver the following days, the caterpillar grows. The children draw it and write the date beside each picture. Then it forms a chrysalis.\n\nNow it is doing nothing, says Pip.\n\nWe cannot see much movement outside, Ms. Park replies, but important changes are happening inside.\n\nMaya imagines a little workshop adding wings. Ms. Park explains that the real process is a much bigger change in body form, called metamorphosis.\n\nThey keep watching the camera over time. One day, an adult butterfly emerges. Its wings are not ready for immediate flight. They expand, and it rests while they become ready.\n\nLeo opens his notebook. The egg, caterpillar, chrysalis, and butterfly look so different that they could be four different animals.\n\nBut they are stages in one life cycle, says Maya.\n\nPip draws his own life cycle: small robot, bigger robot, giant robot, school principal.\n\nThat is a career plan, Leo tells him.\n\nPip adds one more stage: giant robot principal who gives everyone extra reading time.\n\nMaya thinks that sounds like a promising new chapter.", "fact": "A butterfly's life cycle includes egg, larva, pupa, and adult. The caterpillar is the larva, and the chrysalis is the pupal stage. Metamorphosis changes the insect's body form. A quiet-looking chrysalis is part of an active biological process.", "recap": "The class recorded different stages of a butterfly's life. The chrysalis looked quiet, but major changes were happening. Keeping dated observations helped the children connect the very different appearances.", "phrases": ["First, we saw an egg.", "Later, it formed a chrysalis.", "What happened next?"], "question": "Was the quiet-looking chrysalis a stage with no important changes?", "answer": "No. Major changes were happening inside during the pupal stage.", "wonder": "What could you observe and draw over several days to notice gradual change?", "sources": ["https://gardens.si.edu/learn/for-educators/cultivating-habitat/butterfly-gardening/about-butterflies/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 218.472, "word_count": 432, "words_per_minute_including_pauses": 118.6, "input_sha256": "062a83232da5807e2cbf909732378e590b9f2a0ff44385f2613bbd7a814c5c26", "audio_sha256": "aee91470a1f28c44bc8a1d0a68c97e473fa79ff8ceea304348a5382a99510a18", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/14_the_caterpillar_s_new_chapter.mp3", "transcript": "transcripts/14_the_caterpillar_s_new_chapter.md", "subtitle": "subtitles/14_the_caterpillar_s_new_chapter.srt", "speech": "The Curiosity Club. Episode 14. The Caterpillar's New Chapter.\n\nHere is something to listen for. Was the quiet-looking chrysalis a stage with no important changes?\n\nReady? Let us find out.\n\nThe class follows a butterfly life cycle through a garden camera. At first, Maya can hardly see the egg on a leaf. Later, a tiny caterpillar appears.\n\nIt spends a lot of time eating.\n\nLeo nods. I understand this stage very well.\n\nOver the following days, the caterpillar grows. The children draw it and write the date beside each picture. Then it forms a chrysalis.\n\nNow it is doing nothing, says Pip.\n\nWe cannot see much movement outside, Ms. Park replies, but important changes are happening inside.\n\nMaya imagines a little workshop adding wings. Ms. Park explains that the real process is a much bigger change in body form, called metamorphosis.\n\nThey keep watching the camera over time. One day, an adult butterfly emerges. Its wings are not ready for immediate flight. They expand, and it rests while they become ready.\n\nLeo opens his notebook. The egg, caterpillar, chrysalis, and butterfly look so different that they could be four different animals.\n\nBut they are stages in one life cycle, says Maya.\n\nPip draws his own life cycle: small robot, bigger robot, giant robot, school principal.\n\nThat is a career plan, Leo tells him.\n\nPip adds one more stage: giant robot principal who gives everyone extra reading time.\n\nMaya thinks that sounds like a promising new chapter.\n\nNow, a little more to discover.\n\nA butterfly's life cycle includes egg, larva, pupa, and adult. The caterpillar is the larva, and the chrysalis is the pupal stage. Metamorphosis changes the insect's body form. A quiet-looking chrysalis is part of an active biological process.\n\nLet us hear the main idea again.\n\nThe class recorded different stages of a butterfly's life. The chrysalis looked quiet, but major changes were happening. Keeping dated observations helped the children connect the very different appearances.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nFirst, we saw an egg.\nFirst, we saw an egg.\n\nLater, it formed a chrysalis.\nLater, it formed a chrysalis.\n\nWhat happened next?\nWhat happened next?\n\nRemember our listening question? Was the quiet-looking chrysalis a stage with no important changes?\n\nHere is the answer. No. Major changes were happening inside during the pupal stage.\n\nAnd here is a question just for your imagination. What could you observe and draw over several days to notice gradual change?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 15, "title": "The Camel's Secret Backpack", "title_zh": "骆驼的秘密背包", "category": "动物世界", "focus": "store、need；纠正常见误解", "summary_zh": "驼峰里装的是水吗？用一个旅行背包的比喻来理解。", "words": {"camel": "骆驼", "hump": "驼峰", "reserve": "储备"}, "story": "Maya is packing for a day trip. She puts water, lunch, and a hat in her bag. Pip shows her a picture of a camel.\n\nThis animal has a built-in backpack, he says.\n\nLeo remembers something he once heard. Does it keep water in its hump?\n\nAt the zoo, the educator answers their question. A camel's hump stores fat. That fat is an energy reserve when food is hard to find.\n\nSo it is more like stored food energy than a water bottle, Maya says.\n\nExactly. Camels still need to drink water.\n\nThey watch a camel walk slowly across its enclosure. Its broad feet spread its weight over the ground.\n\nPip examines his narrow wheels. I might need a different design for
