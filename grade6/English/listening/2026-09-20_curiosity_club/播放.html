e melts, the club watches its shape change.\n\nOur iceberg is getting smaller, says Maya.\n\nPip folds up the ship. The captain will now explore a much drier place: the bookshelf.\n\nNow, a little more to discover.\n\nOrdinary ice floats in liquid water because it is less dense. Water expands when it freezes under familiar everyday conditions. Most of a floating ice cube or iceberg stays below the surface. Density compares mass with volume; size alone does not tell you how dense something is.\n\nLet us hear the main idea again.\n\nMost of the ice cube was underwater. The club connected floating ice with lower density and learned that the visible top does not show the full size of an object.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nMost of it is below the surface.\nMost of it is below the surface.\n\nWe can only see part of it.\nWe can only see part of it.\n\nSize alone does not tell us everything.\nSize alone does not tell us everything.\n\nRemember our listening question? Why can ordinary ice float in liquid water?\n\nHere is the answer. It is less dense than the surrounding liquid water.\n\nAnd here is a question just for your imagination. What other situations show you only a small part of the whole picture?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 29, "title": "Lights in the Deep Ocean", "title_zh": "深海里的小灯", "category": "身边科学与地球", "focus": "some/others、use ... to；生物发光", "summary_zh": "深海里的光不需要插座，生物自己就有发光办法。", "words": {"deep": "深的", "glow": "发光", "bioluminescence": "生物发光"}, "story": "The museum has a simulated deep-ocean ride. Maya, Leo, and Pip sit in a pretend research submarine. The screen outside their window grows darker as the imaginary vehicle descends.\n\nThen a small blue light appears.\n\nSomeone forgot to turn off a lamp, Leo says.\n\nA narrator explains that many ocean organisms can produce light through chemical reactions. The process is called bioluminescence.\n\nPip is impressed. Where do they plug in their chargers?\n\nThey do not need electrical sockets like you, Maya says.\n\nThe screen shows different examples. A fish has a glowing lure near its mouth. Another animal produces flashes that may confuse an attacker. Some animals use light to help them blend with faint light from above.\n\nSo light can do different jobs, Leo says. It is not just decoration.\n\nThe ride pauses at a question: Does every glowing creature make light in exactly the same way?\n\nMaya chooses no. The narrator explains that some animals make light themselves, while others receive help from glowing bacteria.\n\nPip designs a submarine with a large illuminated sign: Friendly visitors. No snacks for sale.\n\nThat would make us easy to notice, Leo says.\n\nThen I will add an off switch, replies Pip.\n\nWhen they leave the exhibit, daylight fills the museum hall. Maya looks back at the dark screen.\n\nA place can be dark, she says, and still contain many kinds of light.", "fact": "Bioluminescence is light produced by chemical reactions in living systems. Marine organisms use it in different ways, such as attracting prey, communicating, or defense. Some animals depend on light-producing bacteria. The glowing lure of an animal is not an electric bulb, even if it looks like a tiny lamp.", "recap": "The pretend submarine introduced living lights in the ocean. Different organisms used light for different purposes, and some had bacterial partners. The children separated a useful lamp comparison from the actual biology.", "phrases": ["What is making that light?", "Some use it to find food.", "Others use it for protection."], "question": "Does a glowing ocean animal need a battery-powered light bulb?", "answer": "No. Bioluminescence involves chemical reactions, sometimes with help from bacteria.", "wonder": "If you could send one message with a pattern of lights, what would the pattern mean?", "sources": ["https://ocean.si.edu/ocean-life/fish/bioluminescence"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 218.664, "word_count": 472, "words_per_minute_including_pauses": 129.5, "input_sha256": "1f6aecd5cc043e7c751dd891dde1550f2b351e4c4a03bd2d4fd595928bc5c750", "audio_sha256": "32b10d07464ace800b560107e45788c35f875d7f902a9a9d4d937c9578875b9b", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/29_lights_in_the_deep_ocean.mp3", "transcript": "transcripts/29_lights_in_the_deep_ocean.md", "subtitle": "subtitles/29_lights_in_the_deep_ocean.srt", "speech": "The Curiosity Club. Episode 29. Lights in the Deep Ocean.\n\nHere is something to listen for. Does a glowing ocean animal need a battery-powered light bulb?\n\nReady? Let us find out.\n\nThe museum has a simulated deep-ocean ride. Maya, Leo, and Pip sit in a pretend research submarine. The screen outside their window grows darker as the imaginary vehicle descends.\n\nThen a small blue light appears.\n\nSomeone forgot to turn off a lamp, Leo says.\n\nA narrator explains that many ocean organisms can produce light through chemical reactions. The process is called bioluminescence.\n\nPip is impressed. Where do they plug in their chargers?\n\nThey do not need electrical sockets like you, Maya says.\n\nThe screen shows different examples. A fish has a glowing lure near its mouth. Another animal produces flashes that may confuse an attacker. Some animals use light to help them blend with faint light from above.\n\nSo light can do different jobs, Leo says. It is not just decoration.\n\nThe ride pauses at a question: Does every glowing creature make light in exactly the same way?\n\nMaya chooses no. The narrator explains that some animals make light themselves, while others receive help from glowing bacteria.\n\nPip designs a submarine with a large illuminated sign: Friendly visitors. No snacks for sale.\n\nThat would make us easy to notice, Leo says.\n\nThen I will add an off switch, replies Pip.\n\nWhen they leave the exhibit, daylight fills the museum hall. Maya looks back at the dark screen.\n\nA place can be dark, she says, and still contain many kinds of light.\n\nNow, a little more to discover.\n\nBioluminescence is light produced by chemical reactions in living systems. Marine organisms use it in different ways, such as attracting prey, communicating, or defense. Some animals depend on light-producing bacteria. The glowing lure of an animal is not an electric bulb, even if it looks like a tiny lamp.\n\nLet us hear the main idea again.\n\nThe pretend submarine introduced living lights in the ocean. Different organisms used light for different purposes, and some had bacterial partners. The children separated a useful lamp comparison from the actual biology.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat is making that light?\nWhat is making that light?\n\nSome use it to find food.\nSome use it to find food.\n\nOthers use it for protection.\nOthers use it for protection.\n\nRemember our listening question? Does a glowing ocean animal need a battery-powered light bulb?\n\nHere is the answer. No. Bioluminescence involves chemical reactions, sometimes with help from bacteria.\n\nAnd here is a question just for your imagination. If you could send one message with a pattern of lights, what would the pattern mean?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 30, "title": "The Mountain with a Secret Door", "title_zh": "有秘密通道的山", "category": "身边科学与地球", "focus": "inside/outside、before/after；火山", "summary_zh": "从火山剖面模型理解岩浆、熔岩与地球变化。", "words": {"volcano": "火山", "magma": "岩浆", "lava": "熔岩"}, "story": "At a science center, Leo sees a model volcano cut in half. Tubes and colored sections show what may lie beneath the surface.\n\nIt has secret passages, he says. Is this where a dragon lives?\n\nPip searches the label. No dragon residence is listed.\n\nThe educator explains that molten rock below Earth's surface is called magma. When it erupts onto the surface, it is called lava.\n\nSame journey, different location, Maya says, writing the two names beside a drawing.\n\nThe educator shows photographs of different volcanoes. Some are broad with gentle slopes. Others are steeper. Eruptions can also look very different.\n\nSo our one model is not a picture of every volcano, Leo says.\n\nCorrect. Models help us understand selected features, but real systems vary.\n\nThey look at a map of Earth's moving plates. Many volcanoes occur near plate boundaries, but some form away from those boundaries at hot spots.\n\nPip wants to put a doorbell on the model. It could warn the mountain that visitors have arrived.\n\nScientists use instruments and observations instead, says the educator. They study signals such as small earthquakes, changes in shape, and gases.\n\nMaya names their drawing The Mountain with a Secret Door, then adds a clear subtitle: An imaginary title for a real geological process.\n\nLeo draws the dragon in a separate corner labeled Fiction.\n\nPip approves. The dragon finally has a correct address.", "fact": "Magma is molten rock beneath Earth's surface; lava is molten rock after it reaches the surface. Many volcanoes occur at tectonic plate boundaries, and others occur at hot spots. Scientists monitor several kinds of evidence to study volcanic activity. Volcanoes do not all have the same shape or eruption style.", "recap": "A cutaway model helped explain the path from underground magma to surface lava. The club compared different volcanoes and learned that one simple model cannot represent every detail.", "phrases": ["What is happening below the surface?", "It has a different name here.", "This model shows only part of the story."], "question": "What do we call magma after it reaches the surface?", "answer": "We call it lava.", "wonder": "If you could see a cutaway view of one ordinary object, which object would you choose?", "sources": ["https://www.usgs.gov/programs/VHP/about-volcanoes", "https://pubs.usgs.gov/gip/volc/tectonics.html"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 215.784, "word_count": 468, "words_per_minute_including_pauses": 130.1, "input_sha256": "d103a6bf6c038f5159d549ead20d1370100b3b56d53f80e31134c29b69004395", "audio_sha256": "05875586868c25897399d2fbcf3684f526f3a8c5d8e0b88aa26dca0b9c413d20", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/30_the_mountain_with_a_secret_door.mp3", "transcript": "transcripts/30_the_mountain_with_a_secret_door.md", "subtitle": "subtitles/30_the_mountain_with_a_secret_door.srt", "speech": "The Curiosity Club. Episode 30. The Mountain with a Secret Door.\n\nHere is something to listen for. What do we call magma after it reaches the surface?\n\nReady? Let us find out.\n\nAt a science center, Leo sees a model volcano cut in half. Tubes and colored sections show what may lie beneath the surface.\n\nIt has secret passages, he says. Is this where a dragon lives?\n\nPip searches the label. No dragon residence is listed.\n\nThe educator explains that molten rock below Earth's surface is called magma. When it erupts onto the surface, it is called lava.\n\nSame journey, different location, Maya says, writing the two names beside a drawing.\n\nThe educator shows photographs of different volcanoes. Some are broad with gentle slopes. Others are steeper. Eruptions can also look very different.\n\nSo our one model is not a picture of every volcano, Leo says.\n\nCorrect. Models help us understand selected features, but real systems vary.\n\nThey look at a map of Earth's moving plates. Many volcanoes occur near plate boundaries, but some form away from those boundaries at hot spots.\n\nPip wants to put a doorbell on the model. It could warn the mountain that visitors have arrived.\n\nScientists use instruments and observations instead, says the educator. They study signals such as small earthquakes, changes in shape, and gases.\n\nMaya names their drawing The Mountain with a Secret Door, then adds a clear subtitle: An imaginary title for a real geological process.\n\nLeo draws the dragon in a separate corner labeled Fiction.\n\nPip approves. The dragon finally has a correct address.\n\nNow, a little more to discover.\n\nMagma is molten rock beneath Earth's surface; lava is molten rock after it reaches the surface. Many volcanoes occur at tectonic plate boundaries, and others occur at hot spots. Scientists monitor several kinds of evidence to study volcanic activity. Volcanoes do not all have the same shape or eruption style.\n\nLet us hear the main idea again.\n\nA cutaway model helped explain the path from underground magma to surface lava. The club compared different volcanoes and learned that one simple model cannot represent every detail.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat is happening below the surface?\nWhat is happening below the surface?\n\nIt has a different name here.\nIt has a different name here.\n\nThis model shows only part of the story.\nThis model shows only part of the story.\n\nRemember our listening question? What do we call magma after it reaches the surface?\n\nHere is the answer. We call it lava.\n\nAnd here is a question just for your imagination. If you could see a cutaway view of one ordinary object, which object would you choose?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 31, "title": "The River That Wrote in Rock", "title_zh": "在岩石上写字的河流", "category": "身边科学与地球", "focus": "over time、slowly；侵蚀与地质时间", "summary_zh": "大峡谷如何记录漫长变化？一个沙盘模型带来线索。", "words": {"canyon": "峡谷", "erosion": "侵蚀", "layer": "层"}, "story": "Maya finds a photograph of the Grand Canyon. Bands of rock stretch across enormous walls, and a river lies far below.\n\nWho dug that? Leo asks. They would need a very large shovel.\n\nPip calculates how many toy shovels the club owns. The number is not promising.\n\nMs. Park explains that the Colorado River and other processes shaped the canyon over a very long time. Flowing water carries material away. Weathering breaks rock down, and side streams and falling rock also help change the landscape.\n\nThe club builds a small sand tray. With their teacher, they pour a gentle stream of water over one area. A channel begins to form, and sand moves toward the lower end.\n\nThis happened quickly, Leo says. Did the real canyon form that quickly, too?\n\nNo. Our tray shows an idea about moving water and material. Its scale, materials, and time are very different from the real canyon.\n\nMaya draws arrows showing where the sand traveled. Pip adds a sign beside the new channel: Landscape under construction.\n\nLater, they look again at the photograph. The rock layers remind Maya of pages in a very old book.\n\nCan we read all of it? she asks.\n\nScientists are still studying its history, says Ms. Park.\n\nLeo puts away the toy shovel. He decides that patient questions are more useful than enormous digging plans.", "fact": "The Grand Canyon records a long history of rock formation and landscape change. The Colorado River cut downward while weathering, tributary streams, and other processes helped widen and shape the canyon. A classroom erosion model can illustrate one process without reproducing the real landscape's full history or timescale.", "recap": "The photograph led the club to study erosion. Water moved sand in their tray, but the tray was only a simplified model. The real canyon was shaped by several processes over a much longer time.", "phrases": ["It changed over a long time.", "Where did the material go?", "Our model is much smaller."], "question": "Did the fast change in the sand tray prove that the Grand Canyon formed equally fast?", "answer": "No. The model used different materials, scale, and conditions. It illustrated a process, not the real canyon's full timescale.", "wonder": "Where can you notice small signs of water moving soil or sand after rain?", "sources": ["https://www.nps.gov/grca/learn/nature/grca-geology.htm"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 220.968, "word_count": 485, "words_per_minute_including_pauses": 131.7, "input_sha256": "748143473af054d0ff2844f288110df1f96bc777a124f04f9f955a9d1cd87d70", "audio_sha256": "6271bbdf47c1100661b9613e277da175be73636d3f58b7c538ab886c3e3d45bf", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/31_the_river_that_wrote_in_rock.mp3", "transcript": "transcripts/31_the_river_that_wrote_in_rock.md", "subtitle": "subtitles/31_the_river_that_wrote_in_rock.srt", "speech": "The Curiosity Club. Episode 31. The River That Wrote in Rock.\n\nHere is something to listen for. Did the fast change in the sand tray prove that the Grand Canyon formed equally fast?\n\nReady? Let us find out.\n\nMaya finds a photograph of the Grand Canyon. Bands of rock stretch across enormous walls, and a river lies far below.\n\nWho dug that? Leo asks. They would need a very large shovel.\n\nPip calculates how many toy shovels the club owns. The number is not promising.\n\nMs. Park explains that the Colorado River and other processes shaped the canyon over a very long time. Flowing water carries material away. Weathering breaks rock down, and side streams and falling rock also help change the landscape.\n\nThe club builds a small sand tray. With their teacher, they pour a gentle stream of water over one area. A channel begins to form, and sand moves toward the lower end.\n\nThis happened quickly, Leo says. Did the real canyon form that quickly, too?\n\nNo. Our tray shows an idea about moving water and material. Its scale, materials, and time are very different from the real canyon.\n\nMaya draws arrows showing where the sand traveled. Pip adds a sign beside the new channel: Landscape under construction.\n\nLater, they look again at the photograph. The rock layers remind Maya of pages in a very old book.\n\nCan we read all of it? she asks.\n\nScientists are still studying its history, says Ms. Park.\n\nLeo puts away the toy shovel. He decides that patient questions are more useful than enormous digging plans.\n\nNow, a little more to discover.\n\nThe Grand Canyon records a long history of rock formation and landscape change. The Colorado River cut downward while weathering, tributary streams, and other processes helped widen and shape the canyon. A classroom erosion model can illustrate one process without reproducing the real landscape's full history or timescale.\n\nLet us hear the main idea again.\n\nThe photograph led the club to study erosion. Water moved sand in their tray, but the tray was only a simplified model. The real canyon was shaped by several processes over a much longer time.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt changed over a long time.\nIt changed over a long time.\n\nWhere did the material go?\nWhere did the material go?\n\nOur model is much smaller.\nOur model is much smaller.\n\nRemember our listening question? Did the fast change in the sand tray prove that the Grand Canyon formed equally fast?\n\nHere is the answer. No. The model used different materials, scale, and conditions. It illustrated a process, not the real canyon's full timescale.\n\nAnd here is a question just for your imagination. Where can you notice small signs of water moving soil or sand after rain?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 32, "title": "A Desert with No Sandcastle", "title_zh": "没有沙堡的冰雪沙漠", "category": "身边科学与地球", "focus": "not always、definition；南极与干燥", "summary_zh": "沙漠一定又热又有沙吗？南极带来一个意外答案。", "words": {"desert": "沙漠；荒漠", "precipitation": "降水", "Antarctica": "南极洲"}, "story": "The geography club is playing Guess the Place. Maya reads the first clue: It is a desert.\n\nLeo draws a hot Sun and a camel. Pip adds a sandcastle with a robot flag.\n\nSecond clue, says Maya. This place can be extremely cold.\n\nLeo puts a scarf on the camel.\n\nThird clue: Much of the land is covered by a thick ice sheet.\n\nPip looks at his sandcastle. My building material may be wrong.\n\nThe answer is Antarctica, Maya announces.\n\nLeo is surprised. How can a place with so much ice be a desert?\n\nMs. Park explains that desert conditions are about very low precipitation, not simply heat or sand. Much of Antarctica receives little new snowfall. Ice can accumulate and remain over a very long time.\n\nSo the amount already stored and the amount arriving each year are different questions, Maya says.\n\nThey imagine a jar holding many old coins. Even if only a few new coins arrive each year, the jar may still contain a lot.\n\nPip labels the comparison carefully: Ice is not money. Please do not pay for lunch with a snowball.\n\nLeo changes his first drawing. The camel stays on a separate page about a hot desert. Antarctica gets its own icy landscape.\n\nThe club's final clue is for every geography question: Check the definition before trusting the first picture in your head.", "fact": "Deserts are characterized by very low precipitation. They can be hot or cold, and they do not all consist of sand dunes. Much of Antarctica is a cold desert. Its large store of ice does not mean that it receives a large amount of new precipitation each year.", "recap": "Leo first imagined a hot sandy desert, but Antarctica challenged that picture. The club used the meaning of desert and distinguished stored ice from newly falling precipitation.", "phrases": ["It is not always hot.", "What does the word really mean?", "Those are two different questions."], "question": "Must every desert be hot and sandy?", "answer": "No. Very low precipitation is the important feature, and deserts can be cold.", "wonder": "What word makes you picture one familiar example even though other examples are very different?", "sources": ["https://www.bas.ac.uk/about/where-we-work/antarctica/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 204.888, "word_count": 455, "words_per_minute_including_pauses": 133.2, "input_sha256": "904c148727677d95044b05ce09a635191e0cffb628b5a0b51f2b803b98e02c46", "audio_sha256": "79d2150954d8f0e5915a1f4c68a9cef4b37934ac43f54d3fbfafd1b7a3ad03ac", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/32_a_desert_with_no_sandcastle.mp3", "transcript": "transcripts/32_a_desert_with_no_sandcastle.md", "subtitle": "subtitles/32_a_desert_with_no_sandcastle.srt", "speech": "The Curiosity Club. Episode 32. A Desert with No Sandcastle.\n\nHere is something to listen for. Must every desert be hot and sandy?\n\nReady? Let us find out.\n\nThe geography club is playing Guess the Place. Maya reads the first clue: It is a desert.\n\nLeo draws a hot Sun and a camel. Pip adds a sandcastle with a robot flag.\n\nSecond clue, says Maya. This place can be extremely cold.\n\nLeo puts a scarf on the camel.\n\nThird clue: Much of the land is covered by a thick ice sheet.\n\nPip looks at his sandcastle. My building material may be wrong.\n\nThe answer is Antarctica, Maya announces.\n\nLeo is surprised. How can a place with so much ice be a desert?\n\nMs. Park explains that desert conditions are about very low precipitation, not simply heat or sand. Much of Antarctica receives little new snowfall. Ice can accumulate and remain over a very long time.\n\nSo the amount already stored and the amount arriving each year are different questions, Maya says.\n\nThey imagine a jar holding many old coins. Even if only a few new coins arrive each year, the jar may still contain a lot.\n\nPip labels the comparison carefully: Ice is not money. Please do not pay for lunch with a snowball.\n\nLeo changes his first drawing. The camel stays on a separate page about a hot desert. Antarctica gets its own icy landscape.\n\nThe club's final clue is for every geography question: Check the definition before trusting the first picture in your head.\n\nNow, a little more to discover.\n\nDeserts are characterized by very low precipitation. They can be hot or cold, and they do not all consist of sand dunes. Much of Antarctica is a cold desert. Its large store of ice does not mean that it receives a large amount of new precipitation each year.\n\nLet us hear the main idea again.\n\nLeo first imagined a hot sandy desert, but Antarctica challenged that picture. The club used the meaning of desert and distinguished stored ice from newly falling precipitation.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt is not always hot.\nIt is not always hot.\n\nWhat does the word really mean?\nWhat does the word really mean?\n\nThose are two different questions.\nThose are two different questions.\n\nRemember our listening question? Must every desert be hot and sandy?\n\nHere is the answer. No. Very low precipitation is the important feature, and deserts can be cold.\n\nAnd here is a question just for your imagination. What word makes you picture one familiar example even though other examples are very different?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 33, "title": "Breakfast Here, Bedtime There", "title_zh": "这里早餐，那里睡觉", "category": "世界见闻与发明", "focus": "what time、now、tomorrow；时区", "summary_zh": "一次跨国视频通话，为什么两边的钟不同？", "words": {"time zone": "时区", "local": "当地的", "schedule": "日程；安排"}, "story": "Maya wants to call her cousin, who lives far away. She chooses a time after dinner and sends a message: Can we talk now?\n\nHer cousin replies later. Sorry. I was asleep.\n\nPip checks Maya's clock. It was not bedtime here. Perhaps the cousin's clock needs new batteries.\n\nLeo brings out the globe from their day-and-night lesson. Different parts of Earth face the Sun at different times, he reminds them.\n\nMs. Park explains that people use time zones to organize local clock time. When it is evening in one place, another place may be in the morning or even on a different calendar date.\n\nThe club opens a world-clock display and chooses the actual cities. They do not guess the time difference from memory.\n\nSome places also change their clocks during part of the year, Ms. Park says. Checking the date matters.\n\nMaya writes two times on the invitation, one for each city, and includes the date. This time, her cousin joins while eating breakfast.\n\nI am having toast, the cousin says.\n\nI have already had dinner, Maya replies.\n\nPip holds up an empty plate. I am available for any meal in any time zone.\n\nThey laugh and compare the light outside their windows.\n\nAfter the call, Leo writes a planning rule: A good meeting time is a good time for everyone, not just the person sending the invitation.", "fact": "Time zones help people coordinate local clock times around the rotating Earth. Their boundaries follow human decisions as well as geography. Some places use seasonal clock changes and others do not. For a real call, checking both cities and the date is more reliable than assuming a fixed difference.", "recap": "Maya's first invitation ignored her cousin's local time. The club checked a world clock and wrote both local times and the date. Breakfast and after-dinner conversation could then happen in the same call.", "phrases": ["What time is it where you are?", "Does this time work for you?", "Let us check the date, too."], "question": "Why did Maya include two local times on the second invitation?", "answer": "The callers lived in different time zones, so each needed to know when to join using their own local clock.", "wonder": "What would you show a faraway friend during a short video tour of your neighborhood?", "sources": ["https://www.nist.gov/pml/time-and-frequency-division/how-utcnist-related-coordinated-universal-time-utc-international"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 208.296, "word_count": 487, "words_per_minute_including_pauses": 140.3, "input_sha256": "f1c80e338ed27bca3000ab0dfc383ec21005de8f56ac7ad1d4655aca0a38c55c", "audio_sha256": "ea2e697cfb2915c0a39a9522717f3243db6c91953ab5f662bb31a32fc85df682", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/33_breakfast_here_bedtime_there.mp3", "transcript": "transcripts/33_breakfast_here_bedtime_there.md", "subtitle": "subtitles/33_breakfast_here_bedtime_there.srt", "speech": "The Curiosity Club. Episode 33. Breakfast Here, Bedtime There.\n\nHere is something to listen for. Why did Maya include two local times on the second invitation?\n\nReady? Let us find out.\n\nMaya wants to call her cousin, who lives far away. She chooses a time after dinner and sends a message: Can we talk now?\n\nHer cousin replies later. Sorry. I was asleep.\n\nPip checks Maya's clock. It was not bedtime here. Perhaps the cousin's clock needs new batteries.\n\nLeo brings out the globe from their day-and-night lesson. Different parts of Earth face the Sun at different times, he reminds them.\n\nMs. Park explains that people use time zones to organize local clock time. When it is evening in one place, another place may be in the morning or even on a different calendar date.\n\nThe club opens a world-clock display and chooses the actual cities. They do not guess the time difference from memory.\n\nSome places also change their clocks during part of the year, Ms. Park says. Checking the date matters.\n\nMaya writes two times on the invitation, one for each city, and includes the date. This time, her cousin joins while eating breakfast.\n\nI am having toast, the cousin says.\n\nI have already had dinner, Maya replies.\n\nPip holds up an empty plate. I am available for any meal in any time zone.\n\nThey laugh and compare the light outside their windows.\n\nAfter the call, Leo writes a planning rule: A good meeting time is a good time for everyone, not just the person sending the invitation.\n\nNow, a little more to discover.\n\nTime zones help people coordinate local clock times around the rotating Earth. Their boundaries follow human decisions as well as geography. Some places use seasonal clock changes and others do not. For a real call, checking both cities and the date is more reliable than assuming a fixed difference.\n\nLet us hear the main idea again.\n\nMaya's first invitation ignored her cousin's local time. The club checked a world clock and wrote both local times and the date. Breakfast and after-dinner conversation could then happen in the same call.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat time is it where you are?\nWhat time is it where you are?\n\nDoes this time work for you?\nDoes this time work for you?\n\nLet us check the date, too.\nLet us check the date, too.\n\nRemember our listening question? Why did Maya include two local times on the second invitation?\n\nHere is the answer. The callers lived in different time zones, so each needed to know when to join using their own local clock.\n\nAnd here is a question just for your imagination. What would you show a faraway friend during a short video tour of your neighborhood?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 34, "title": "Chocolate Before the Candy Bar", "title_zh": "巧克力成为糖果之前", "category": "世界见闻与发明", "focus": "comes from、before/after；食物来源", "summary_zh": "巧克力不是从糖果包装里长出来的，它的旅程从可可树开始。", "words": {"cacao": "可可", "pod": "荚状果实；此处指可可果", "bitter": "苦的"}, "story": "Leo brings a chocolate wrapper to the club's Food Journeys project. He draws an arrow from a store to his mouth.\n\nFinished, he says.\n\nMaya adds an empty space before the store. Where did the ingredients come from?\n\nThey visit a botanical garden exhibit about cacao. A photograph shows large pods growing on a tree. Inside the pods are seeds surrounded by pale pulp.\n\nThose seeds are the beginning of chocolate's journey, the guide explains.\n\nPip looks at the picture. The tree forgot the shiny wrappers.\n\nThe guide describes several steps used in making chocolate. Seeds are fermented and dried. They are often roasted, and the inner parts are ground. Different recipes add ingredients such as sugar or milk.\n\nLeo smells a sample of unsweetened cocoa. It smells familiar, but the guide explains that cacao material is naturally bitter. Sweet candy bars get much of their sweetness from added sugar.\n\nSo chocolate flavor and sweetness are different things, Maya says.\n\nThey learn that cacao has a long history in the Americas, including use in drinks before modern candy bars existed.\n\nLeo expands his drawing into a chain of people and places: growers, processors, makers, transport, and stores.\n\nPip adds one final box: curious eater.\n\nThat is me, says Leo.\n\nMaya smiles. Now your arrow has a story behind it.\n\nLeo agrees, although he still likes the final part of the journey best.", "fact": "Chocolate begins with seeds from cacao pods. Processing develops its familiar flavor, and recipes determine how much sugar, milk, or other ingredients are added. Cacao has a long history in the Americas. A sweet chocolate bar is a finished product with a much longer story behind it.", "recap": "The chocolate journey began with a tree rather than a store. The club followed seeds through several processing steps and distinguished cacao's flavor from added sweetness. Leo's simple arrow became a chain of people and processes.", "phrases": ["Where does it come from?", "What happens before this step?", "Many people help make it."], "question": "Which part of the cacao plant is used to begin making chocolate?", "answer": "The seeds inside cacao pods are used.", "wonder": "Choose one food you ate today. How far back can you trace its ingredients?", "sources": ["https://www.kew.org/plants/cacao-tree"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 214.824, "word_count": 468, "words_per_minute_including_pauses": 130.7, "input_sha256": "a7d2b416bb7271d375f1579ada8d94bd8d12f11af80e19a43da90f4706155d63", "audio_sha256": "0c4a84518b6159ff4e04f9cbcd59c2bc4c47066f16977f66b6b26c469277db47", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/34_chocolate_before_the_candy_bar.mp3", "transcript": "transcripts/34_chocolate_before_the_candy_bar.md", "subtitle": "subtitles/34_chocolate_before_the_candy_bar.srt", "speech": "The Curiosity Club. Episode 34. Chocolate Before the Candy Bar.\n\nHere is something to listen for. Which part of the cacao plant is used to begin making chocolate?\n\nReady? Let us find out.\n\nLeo brings a chocolate wrapper to the club's Food Journeys project. He draws an arrow from a store to his mouth.\n\nFinished, he says.\n\nMaya adds an empty space before the store. Where did the ingredients come from?\n\nThey visit a botanical garden exhibit about cacao. A photograph shows large pods growing on a tree. Inside the pods are seeds surrounded by pale pulp.\n\nThose seeds are the beginning of chocolate's journey, the guide explains.\n\nPip looks at the picture. The tree forgot the shiny wrappers.\n\nThe guide describes several steps used in making chocolate. Seeds are fermented and dried. They are often roasted, and the inner parts are ground. Different recipes add ingredients such as sugar or milk.\n\nLeo smells a sample of unsweetened cocoa. It smells familiar, but the guide explains that cacao material is naturally bitter. Sweet candy bars get much of their sweetness from added sugar.\n\nSo chocolate flavor and sweetness are different things, Maya says.\n\nThey learn that cacao has a long history in the Americas, including use in drinks before modern candy bars existed.\n\nLeo expands his drawing into a chain of people and places: growers, processors, makers, transport, and stores.\n\nPip adds one final box: curious eater.\n\nThat is me, says Leo.\n\nMaya smiles. Now your arrow has a story behind it.\n\nLeo agrees, although he still likes the final part of the journey best.\n\nNow, a little more to discover.\n\nChocolate begins with seeds from cacao pods. Processing develops its familiar flavor, and recipes determine how much sugar, milk, or other ingredients are added. Cacao has a long history in the Americas. A sweet chocolate bar is a finished product with a much longer story behind it.\n\nLet us hear the main idea again.\n\nThe chocolate journey began with a tree rather than a store. The club followed seeds through several processing steps and distinguished cacao's flavor from added sweetness. Leo's simple arrow became a chain of people and processes.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhere does it come from?\nWhere does it come from?\n\nWhat happens before this step?\nWhat happens before this step?\n\nMany people help make it.\nMany people help make it.\n\nRemember our listening question? Which part of the cacao plant is used to begin making chocolate?\n\nHere is the answer. The seeds inside cacao pods are used.\n\nAnd here is a question just for your imagination. Choose one food you ate today. How far back can you trace its ingredients?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 35, "title": "The Triangle Team", "title_zh": "三角形工程队", "category": "世界见闻与发明", "focus": "stronger、support；结构设计", "summary_zh": "桥梁和屋架为什么常出现三角形？", "words": {"frame": "框架", "brace": "支撑杆", "structure": "结构"}, "story": "The club builds shapes with strips of cardboard joined at the corners. Leo makes a square. Maya makes a triangle.\n\nPip declares the square the winner because it has more corners.\n\nMs. Park asks them to push gently on the shapes. The square changes into a slanted shape as its corner joints turn. Maya's triangle keeps its shape more easily without bending the strips.\n\nThe number of corners was not a useful test, Pip admits.\n\nMaya adds a diagonal strip across the square. Now it is divided into two triangles, and it resists the same gentle push better.\n\nThey look at pictures of bridge frameworks and roof supports. Triangles appear again and again.\n\nDoes that mean every bridge must be a triangle? Leo asks.\n\nNo, says Ms. Park. Engineers use many kinds of structures. The material, connections, shape, and expected loads all matter.\n\nThe club improves a cardboard tower for its exhibition. They add braces where the frame was leaning and test it with the same small load as before.\n\nPip designs a banner: Team Triangle. Excellent at standing still.\n\nLeo asks whether he should make his sandwich triangular for extra strength.\n\nThat depends on your engineering goal, Maya replies.\n\nMy goal is to eat it.\n\nThen cutting it into triangles may help your lunch, she says, but it will not prove anything about bridge safety.\n\nPip records another important design lesson: Always ask what problem you are trying to solve.", "fact": "A triangle made of fixed-length sides is geometrically rigid, while a four-sided frame with freely turning corners can change shape. A diagonal brace can divide such a frame into triangles. Real structural strength also depends on materials, connections, and loads; shape alone is not a complete safety test.", "recap": "The square frame shifted at its joints. A diagonal brace made it resist that movement better. The children connected the model with real structures while remembering that engineering involves more than a single shape.", "phrases": ["What problem are we trying to solve?", "This brace helps support the frame.", "Let us test it with the same load."], "question": "What did Maya add to help the square frame keep its shape?", "answer": "She added a diagonal brace, dividing the square into two triangles.", "wonder": "Where can you find triangles used as part of a structure around you?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 216.264, "word_count": 491, "words_per_minute_including_pauses": 136.2, "input_sha256": "a4fa22a10d4dfd4980fb88eae5a3dd2effdcddb0ee607bb12a5ca3866f86d63e", "audio_sha256": "ee798abde38d0b51d142153ea0c147312fba2da0f71a507544d01613172da46f", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/35_the_triangle_team.mp3", "transcript": "transcripts/35_the_triangle_team.md", "subtitle": "subtitles/35_the_triangle_team.srt", "speech": "The Curiosity Club. Episode 35. The Triangle Team.\n\nHere is something to listen for. What did Maya add to help the square frame keep its shape?\n\nReady? Let us find out.\n\nThe club builds shapes with strips of cardboard joined at the corners. Leo makes a square. Maya makes a triangle.\n\nPip declares the square the winner because it has more corners.\n\nMs. Park asks them to push gently on the shapes. The square changes into a slanted shape as its corner joints turn. Maya's triangle keeps its shape more easily without bending the strips.\n\nThe number of corners was not a useful test, Pip admits.\n\nMaya adds a diagonal strip across the square. Now it is divided into two triangles, and it resists the same gentle push better.\n\nThey look at pictures of bridge frameworks and roof supports. Triangles appear again and again.\n\nDoes that mean every bridge must be a triangle? Leo asks.\n\nNo, says Ms. Park. Engineers use many kinds of structures. The material, connections, shape, and expected loads all matter.\n\nThe club improves a cardboard tower for its exhibition. They add braces where the frame was leaning and test it with the same small load as before.\n\nPip designs a banner: Team Triangle. Excellent at standing still.\n\nLeo asks whether he should make his sandwich triangular for extra strength.\n\nThat depends on your engineering goal, Maya replies.\n\nMy goal is to eat it.\n\nThen cutting it into triangles may help your lunch, she says, but it will not prove anything about bridge safety.\n\nPip records another important design lesson: Always ask what problem you are trying to solve.\n\nNow, a little more to discover.\n\nA triangle made of fixed-length sides is geometrically rigid, while a four-sided frame with freely turning corners can change shape. A diagonal brace can divide such a frame into triangles. Real structural strength also depends on materials, connections, and loads; shape alone is not a complete safety test.\n\nLet us hear the main idea again.\n\nThe square frame shifted at its joints. A diagonal brace made it resist that movement better. The children connected the model with real structures while remembering that engineering involves more than a single shape.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat problem are we trying to solve?\nWhat problem are we trying to solve?\n\nThis brace helps support the frame.\nThis brace helps support the frame.\n\nLet us test it with the same load.\nLet us test it with the same load.\n\nRemember our listening question? What did Maya add to help the square frame keep its shape?\n\nHere is the answer. She added a diagonal brace, dividing the square into two triangles.\n\nAnd here is a question just for your imagination. Where can you find triangles used as part of a structure around you?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 36, "title": "A Message Made of Flashes", "title_zh": "用闪光发出的消息", "category": "世界见闻与发明", "focus": "signal、mean/meaning；编码", "summary_zh": "灯光怎样变成消息？先让双方理解同一套规则。", "words": {"signal": "信号", "code": "编码；代码", "pattern": "模式；图案"}, "story": "The classroom is divided into two pretend islands. Maya stands on one side with a small flashlight. Leo stands on the other with a notebook.\n\nNo shouting across the ocean, Ms. Park says. Your challenge is to send a message with light.\n\nMaya flashes three times. Leo writes: Three snacks, please.\n\nThat is not what I meant, she says.\n\nPip writes: Three robots arriving.\n\nAlso wrong.\n\nThey realize they need an agreed code. They choose one short flash for yes and two short flashes for no. A longer pause separates messages.\n\nNow Ms. Park asks questions. Is the library open? One flash. Is Pip a penguin? Two flashes.\n\nPip requests a third answer: Occasionally, during dance practice.\n\nThe children later try a simple letter chart. They discover that sending letters takes patience and that unclear pauses can change the message.\n\nMs. Park explains that people have used many kinds of signals to carry information, including light, sound, and electrical pulses. A code connects patterns with meanings.\n\nLeo deliberately sends one unclear pattern. Maya asks him to repeat it instead of guessing.\n\nThat is good communication, Ms. Park says. Checking a message can be part of the system.\n\nPip sends two careful flashes and then holds up a sign: No penguins detected.\n\nLeo looks relieved. The classroom ocean is safe for another day.", "fact": "A signal can carry information when sender and receiver share a rule for interpreting it. Codes assign meanings to patterns. Timing and separation can matter as much as the individual signals. Real communication systems also need ways to handle errors or ask for information to be sent again.", "recap": "Random flashes produced different guesses. Once the children agreed on a code and pauses, they could exchange messages. When a pattern was unclear, asking for a repeat worked better than inventing an answer.", "phrases": ["What does this signal mean?", "Could you send that again?", "We need the same set of rules."], "question": "Why did the first three flashes fail to communicate Maya's meaning?", "answer": "The group had not agreed on a code, so each person gave the flashes a different meaning.", "wonder": "What simple signal could your family use to mean that someone needs a quiet moment?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 217.176, "word_count": 469, "words_per_minute_including_pauses": 129.6, "input_sha256": "dffdfde09c1c97d5d9e8c7cec49a5581c57cc9ab7c7069585e086250023333c6", "audio_sha256": "8ac91770a7c4ca92aeab98e509b6ebf45efdfc939b9785eaa312d061a945e091", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/36_a_message_made_of_flashes.mp3", "transcript": "transcripts/36_a_message_made_of_flashes.md", "subtitle": "subtitles/36_a_message_made_of_flashes.srt", "speech": "The Curiosity Club. Episode 36. A Message Made of Flashes.\n\nHere is something to listen for. Why did the first three flashes fail to communicate Maya's meaning?\n\nReady? Let us find out.\n\nThe classroom is divided into two pretend islands. Maya stands on one side with a small flashlight. Leo stands on the other with a notebook.\n\nNo shouting across the ocean, Ms. Park says. Your challenge is to send a message with light.\n\nMaya flashes three times. Leo writes: Three snacks, please.\n\nThat is not what I meant, she says.\n\nPip writes: Three robots arriving.\n\nAlso wrong.\n\nThey realize they need an agreed code. They choose one short flash for yes and two short flashes for no. A longer pause separates messages.\n\nNow Ms. Park asks questions. Is the library open? One flash. Is Pip a penguin? Two flashes.\n\nPip requests a third answer: Occasionally, during dance practice.\n\nThe children later try a simple letter chart. They discover that sending letters takes patience and that unclear pauses can change the message.\n\nMs. Park explains that people have used many kinds of signals to carry information, including light, sound, and electrical pulses. A code connects patterns with meanings.\n\nLeo deliberately sends one unclear pattern. Maya asks him to repeat it instead of guessing.\n\nThat is good communication, Ms. Park says. Checking a message can be part of the system.\n\nPip sends two careful flashes and then holds up a sign: No penguins detected.\n\nLeo looks relieved. The classroom ocean is safe for another day.\n\nNow, a little more to discover.\n\nA signal can carry information when sender and receiver share a rule for interpreting it. Codes assign meanings to patterns. Timing and separation can matter as much as the individual signals. Real communication systems also need ways to handle errors or ask for information to be sent again.\n\nLet us hear the main idea again.\n\nRandom flashes produced different guesses. Once the children agreed on a code and pauses, they could exchange messages. When a pattern was unclear, asking for a repeat worked better than inventing an answer.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat does this signal mean?\nWhat does this signal mean?\n\nCould you send that again?\nCould you send that again?\n\nWe need the same set of rules.\nWe need the same set of rules.\n\nRemember our listening question? Why did the first three flashes fail to communicate Maya's meaning?\n\nHere is the answer. The group had not agreed on a code, so each person gave the flashes a different meaning.\n\nAnd here is a question just for your imagination. What simple signal could your family use to mean that someone needs a quiet moment?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 37, "title": "The Bicycle with the Giant Wheel", "title_zh": "有巨大前轮的自行车", "category": "世界见闻与发明", "focus": "used to、compared with；发明与改进", "summary_zh": "旧式高轮自行车很引人注目，但好设计还要考虑使用者。", "words": {"pedal": "踏板", "chain": "链条", "balance": "平衡"}, "story": "At a transport museum, Leo stops beside a bicycle with an enormous front wheel and a tiny back wheel.\n\nThe wheels forgot to agree on a size, he says.\n\nPip studies the high seat. I would need a ladder and a very encouraging friend.\n\nThe museum educator explains that on many high-wheel bicycles, the pedals directly turned the large front wheel. A larger wheel traveled farther with each turn, but the high riding position brought difficulties and risks.\n\nMaya compares it with a later bicycle in the next display. That one has two more similar-sized wheels and a chain drive.\n\nThe chain carries motion from the pedals to the rear wheel, the educator says. This arrangement helped designers use a lower riding position.\n\nSo the old bicycle was not simply silly, Maya says. It was part of people trying different solutions.\n\nExactly. An invention has a history of ideas, trade-offs, and improvements.\n\nThe club sketches an imaginary future bicycle. Leo adds a rain cover. Maya adds a place for a schoolbag that will not interfere with riding. Pip adds automatic applause whenever the rider climbs a hill.\n\nHow heavy would all that make it? the educator asks.\n\nThey pause. Every extra feature has a cost.\n\nPip removes the large applause machine and replaces it with one small bell.\n\nA lighter celebration, he says.\n\nMaya writes their design question: Better for whom, and better at what?", "fact": "Many historic high-wheel bicycles connected the pedals directly to the front wheel. Later chain-driven designs helped make lower bicycles with more similar wheel sizes practical. Design changes involve trade-offs among speed, comfort, control, weight, and other goals. Newer does not explain which particular feature solves a problem.", "recap": "The giant wheel reflected an earlier design approach. Comparing it with a chain-driven bicycle showed how mechanisms and riding position changed. The club then discovered that adding features to its own design also added trade-offs.", "phrases": ["How did this design work?", "What problem did the change solve?", "It is useful, but it adds weight."], "question": "Why did the club remove its large applause machine from the bicycle design?", "answer": "It added too much weight for a small benefit, so they chose a lighter feature.", "wonder": "What one improvement would make an everyday object easier for you to use?", "sources": ["https://tnmot.org/collection/penny-farthing-bicycle/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 219.528, "word_count": 494, "words_per_minute_including_pauses": 135.0, "input_sha256": "b179a53fc2efeedde9d5ad7c48f275e0f2d7657a9ab445bcc379eb62b1f1e440", "audio_sha256": "4aefd8bc357e266626bd634abf3b32a026c3cea23d5e7ced18505501967fe3b7", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/37_the_bicycle_with_the_giant_wheel.mp3", "transcript": "transcripts/37_the_bicycle_with_the_giant_wheel.md", "subtitle": "subtitles/37_the_bicycle_with_the_giant_wheel.srt", "speech": "The Curiosity Club. Episode 37. The Bicycle with the Giant Wheel.\n\nHere is something to listen for. Why did the club remove its large applause machine from the bicycle design?\n\nReady? Let us find out.\n\nAt a transport museum, Leo stops beside a bicycle with an enormous front wheel and a tiny back wheel.\n\nThe wheels forgot to agree on a size, he says.\n\nPip studies the high seat. I would need a ladder and a very encouraging friend.\n\nThe museum educator explains that on many high-wheel bicycles, the pedals directly turned the large front wheel. A larger wheel traveled farther with each turn, but the high riding position brought difficulties and risks.\n\nMaya compares it with a later bicycle in the next display. That one has two more similar-sized wheels and a chain drive.\n\nThe chain carries motion from the pedals to the rear wheel, the educator says. This arrangement helped designers use a lower riding position.\n\nSo the old bicycle was not simply silly, Maya says. It was part of people trying different solutions.\n\nExactly. An invention has a history of ideas, trade-offs, and improvements.\n\nThe club sketches an imaginary future bicycle. Leo adds a rain cover. Maya adds a place for a schoolbag that will not interfere with riding. Pip adds automatic applause whenever the rider climbs a hill.\n\nHow heavy would all that make it? the educator asks.\n\nThey pause. Every extra feature has a cost.\n\nPip removes the large applause machine and replaces it with one small bell.\n\nA lighter celebration, he says.\n\nMaya writes their design question: Better for whom, and better at what?\n\nNow, a little more to discover.\n\nMany historic high-wheel bicycles connected the pedals directly to the front wheel. Later chain-driven designs helped make lower bicycles with more similar wheel sizes practical. Design changes involve trade-offs among speed, comfort, control, weight, and other goals. Newer does not explain which particular feature solves a problem.\n\nLet us hear the main idea again.\n\nThe giant wheel reflected an earlier design approach. Comparing it with a chain-driven bicycle showed how mechanisms and riding position changed. The club then discovered that adding features to its own design also added trade-offs.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nHow did this design work?\nHow did this design work?\n\nWhat problem did the change solve?\nWhat problem did the change solve?\n\nIt is useful, but it adds weight.\nIt is useful, but it adds weight.\n\nRemember our listening question? Why did the club remove its large applause machine from the bicycle design?\n\nHere is the answer. It added too much weight for a small benefit, so they chose a lighter feature.\n\nAnd here is a question just for your imagination. What one improvement would make an everyday object easier for you to use?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 38, "title": "Pip Follows the Wrong Instructions", "title_zh": "Pip认真执行了错误指令", "category": "世界见闻与发明", "focus": "imperatives、first/next；算法与调试", "summary_zh": "机器人严格照做，却没有到达目的地，问题出在哪里？", "words": {"instruction": "指令", "sequence": "顺序", "debug": "调试；排查错误"}, "story": "Maya draws a grid on a large sheet of paper. A star marks the destination. Pip will follow a short program to reach it.\n\nLeo writes: Move forward two squares. Turn right. Move forward one square.\n\nPip follows the instructions and arrives beside a picture of a banana.\n\nThat is not the star, Maya says.\n\nPip checks his record. I followed every instruction.\n\nThey examine the starting position. Leo imagined Pip facing the top of the page, but Pip was facing left.\n\nWe forgot to specify the starting direction, Maya realizes.\n\nThey add it and run the same sequence again. This time, Pip reaches the star.\n\nNext, Leo writes a longer program. One turn is wrong, so Pip ends up at the banana again.\n\nThe banana is very popular today, says Pip.\n\nInstead of rewriting everything at random, the children trace each step with a finger. They find the incorrect turn and change it.\n\nThat process of finding and fixing problems is called debugging, Ms. Park explains.\n\nMaya asks whether a computer always understands what a person really intends.\n\nIt carries out the operations its system is built to perform, says Ms. Park. Clear instructions and checking results still matter.\n\nPip completes the route at last. He requests one final instruction: Celebrate politely.\n\nLeo writes it more precisely: Ring your bell once.\n\nPip rings twice.\n\nEveryone looks at him.\n\nA joke, he says. Please do not debug my sense of humor.", "fact": "An algorithm is a sequence of steps for carrying out a task. The starting conditions can affect its result. Debugging means locating and correcting problems in a program. Tracing one step at a time helps connect what the instructions say with what actually happens.", "recap": "The first route failed because the starting direction was unclear. A later route failed because one turn was wrong. The children checked the steps, found each problem, and corrected it.", "phrases": ["Which way are you facing?", "Follow one step at a time.", "Let us find where it went wrong."], "question": "Why did Pip miss the star on the first attempt?", "answer": "The children had not specified the starting direction, so Pip began facing a different way from the one Leo imagined.", "wonder": "Could you give someone precise instructions for drawing a simple shape without showing it to them?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 221.88, "word_count": 485, "words_per_minute_including_pauses": 131.2, "input_sha256": "b485d4534e9bbed1d7a479f579d1596ebcc9e2a7fb416233cd0e94ca3fce0404", "audio_sha256": "fe2b25a87d51bce3838b101d84e46ea207a6ae6f7645c63decfbf157030a3fe7", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/38_pip_follows_the_wrong_instructions.mp3", "transcript": "transcripts/38_pip_follows_the_wrong_instructions.md", "subtitle": "subtitles/38_pip_follows_the_wrong_instructions.srt", "speech": "The Curiosity Club. Episode 38. Pip Follows the Wrong Instructions.\n\nHere is something to listen for. Why did Pip miss the star on the first attempt?\n\nReady? Let us find out.\n\nMaya draws a grid on a large sheet of paper. A star marks the destination. Pip will follow a short program to reach it.\n\nLeo writes: Move forward two squares. Turn right. Move forward one square.\n\nPip follows the instructions and arrives beside a picture of a banana.\n\nThat is not the star, Maya says.\n\nPip checks his record. I followed every instruction.\n\nThey examine the starting position. Leo imagined Pip facing the top of the page, but Pip was facing left.\n\nWe forgot to specify the starting direction, Maya realizes.\n\nThey add it and run the same sequence again. This time, Pip reaches the star.\n\nNext, Leo writes a longer program. One turn is wrong, so Pip ends up at the banana again.\n\nThe banana is very popular today, says Pip.\n\nInstead of rewriting everything at random, the children trace each step with a finger. They find the incorrect turn and change it.\n\nThat process of finding and fixing problems is called debugging, Ms. Park explains.\n\nMaya asks whether a computer always understands what a person really intends.\n\nIt carries out the operations its system is built to perform, says Ms. Park. Clear instructions and checking results still matter.\n\nPip completes the route at last. He requests one final instruction: Celebrate politely.\n\nLeo writes it more precisely: Ring your bell once.\n\nPip rings twice.\n\nEveryone looks at him.\n\nA joke, he says. Please do not debug my sense of humor.\n\nNow, a little more to discover.\n\nAn algorithm is a sequence of steps for carrying out a task. The starting conditions can affect its result. Debugging means locating and correcting problems in a program. Tracing one step at a time helps connect what the instructions say with what actually happens.\n\nLet us hear the main idea again.\n\nThe first route failed because the starting direction was unclear. A later route failed because one turn was wrong. The children checked the steps, found each problem, and corrected it.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhich way are you facing?\nWhich way are you facing?\n\nFollow one step at a time.\nFollow one step at a time.\n\nLet us find where it went wrong.\nLet us find where it went wrong.\n\nRemember our listening question? Why did Pip miss the star on the first attempt?\n\nHere is the answer. The children had not specified the starting direction, so Pip began facing a different way from the one Leo imagined.\n\nAnd here is a question just for your imagination. Could you give someone precise instructions for drawing a simple shape without showing it to them?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 39, "title": "The Great Paper Airplane Claim", "title_zh": "纸飞机冠军的证据", "category": "世界见闻与发明", "focus": "claim/evidence、more than once；公平比较", "summary_zh": "一架飞机飞得远，就能证明它的设计一定最好吗？", "words": {"claim": "说法；主张", "fair": "公平的", "trial": "试验；一次测试"}, "story": "Leo throws a paper airplane across the classroom test area. It lands beyond Maya's plane.\n\nMy design is the best in the world, he announces.\n\nPip begins preparing a very large trophy.\n\nMaya asks a question. Did we throw the planes in the same way?\n\nLeo had a running start. Maya stood still. The paper was different, and one plane had a paper clip attached.\n\nWe changed several things, she says. We cannot tell which one made the difference.\n\nMs. Park helps them plan a fairer comparison. They use the same kind of paper, the same starting line, and the same person to launch both designs as consistently as possible. Everyone stays behind the line while a plane is thrown into the clear area.\n\nThey measure several flights for each design. Sometimes Leo's plane travels farther. Sometimes Maya's does.\n\nPip lowers the trophy to a more reasonable size.\n\nThe children compare the results and notice variation. One spectacular flight does not represent every attempt.\n\nLeo changes his statement. In our small test, this design usually traveled farther under these conditions.\n\nThat is less dramatic, he says.\n\nBut it tells people what you actually tested, Maya replies.\n\nPip presents an award anyway: Best Improved Claim.\n\nLeo accepts it. Next time, he says, I want to test which plane stays in the air longest.\n\nMaya smiles. A different question may need a different measurement.", "fact": "A fair comparison tries to keep other important conditions similar while changing the feature being studied. Repeated trials reveal variation. A claim should match the evidence and the conditions of the test. Measuring distance answers a different question from measuring time in the air.", "recap": "Leo's first claim was much larger than his evidence. The club controlled more conditions, repeated the flights, and used careful wording. They also noticed that the meaning of best depends on what they measure.", "phrases": ["Did we keep the conditions the same?", "Let us try it more than once.", "What does the evidence support?"], "question": "Why was one long flight not enough to prove that Leo's design was the best in the world?", "answer": "Other conditions differed, results can vary, and the small test could not compare every design or every meaning of best.", "wonder": "What everyday claim would you enjoy testing with a simple, fair comparison?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 223.68, "word_count": 494, "words_per_minute_including_pauses": 132.5, "input_sha256": "83c73cb7f8b192eb2c5674c1456a597486a9a600e668bdf161bbcebdac9e8bb1", "audio_sha256": "5128b07d667d8ccc02b01b689b5b4b0cc78e011970505df03c8bcfcfda119b08", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/39_the_great_paper_airplane_claim.mp3", "transcript": "transcripts/39_the_great_paper_airplane_claim.md", "subtitle": "subtitles/39_the_great_paper_airplane_claim.srt", "speech": "The Curiosity Club. Episode 39. The Great Paper Airplane Claim.\n\nHere is something to listen for. Why was one long flight not enough to prove that Leo's design was the best in the world?\n\nReady? Let us find out.\n\nLeo throws a paper airplane across the classroom test area. It lands beyond Maya's plane.\n\nMy design is the best in the world, he announces.\n\nPip begins preparing a very large trophy.\n\nMaya asks a question. Did we throw the planes in the same way?\n\nLeo had a running start. Maya stood still. The paper was different, and one plane had a paper clip attached.\n\nWe changed several things, she says. We cannot tell which one made the difference.\n\nMs. Park helps them plan a fairer comparison. They use the same kind of paper, the same starting line, and the same person to launch both designs as consistently as possible. Everyone stays behind the line while a plane is thrown into the clear area.\n\nThey measure several flights for each design. Sometimes Leo's plane travels farther. Sometimes Maya's does.\n\nPip lowers the trophy to a more reasonable size.\n\nThe children compare the results and notice variation. One spectacular flight does not represent every attempt.\n\nLeo changes his statement. In our small test, this design usually traveled farther under these conditions.\n\nThat is less dramatic, he says.\n\nBut it tells people what you actually tested, Maya replies.\n\nPip presents an award anyway: Best Improved Claim.\n\nLeo accepts it. Next time, he says, I want to test which plane stays in the air longest.\n\nMaya smiles. A different question may need a different measurement.\n\nNow, a little more to discover.\n\nA fair comparison tries to keep other important conditions similar while changing the feature being studied. Repeated trials reveal variation. A claim should match the evidence and the conditions of the test. Measuring distance answers a different question from measuring time in the air.\n\nLet us hear the main idea again.\n\nLeo's first claim was much larger than his evidence. The club controlled more conditions, repeated the flights, and used careful wording. They also noticed that the meaning of best depends on what they measure.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nDid we keep the conditions the same?\nDid we keep the conditions the same?\n\nLet us try it more than once.\nLet us try it more than once.\n\nWhat does the evidence support?\nWhat does the evidence support?\n\nRemember our listening question? Why was one long flight not enough to prove that Leo's design was the best in the world?\n\nHere is the answer. Other conditions differed, results can vary, and the small test could not compare every design or every meaning of best.\n\nAnd here is a question just for your imagination. What everyday claim would you enjoy testing with a simple, fair comparison?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 40, "title": "The Museum of Better Questions", "title_zh": "更好问题博物馆", "category": "世界见闻与发明", "focus": "复现代词、问句与因果表达；系列回顾", "summary_zh": "好奇心俱乐部办展览，把一路发现变成新的问题。", "words": {"exhibit": "展品；展览", "explain": "解释", "curiosity": "好奇心"}, "story": "The Curiosity Club opens a small exhibition for families. Maya stands beside the paper bridge. Leo manages the model boat. Pip welcomes visitors with a sign: Questions are free. Please take more than one.\n\nA younger child points at the bridge. Is this yours?\n\nIt is ours, Maya says. We tested different folds together.\n\nAnother visitor asks why the clay boat floats. Leo explains the shape and the water it pushes aside. When he forgets a word, he uses a simple sentence and points to the model.\n\nAt the animal table, visitors guess which creature has three hearts. At the space table, a lamp and a ball show changing views of the Moon's bright side.\n\nPip has made a wall of earlier guesses. The Sun goes to bed. Camels keep drinking water in their humps. Penguins are fish in jackets.\n\nWhy display mistakes? a parent asks.\n\nBecause we learned to change our ideas when we found better evidence, Maya says.\n\nThe final table has blank cards. Visitors write something they would like to understand. Soon, the box is full of questions about music, oceans, buildings, and everyday life.\n\nLeo reads one: Why do we keep asking questions?\n\nPip thinks carefully. Because each answer opens another door.\n\nMaya switches off the exhibition lamp at closing time. The real Sun has not gone to bed, she reminds Leo.\n\nI know, he says. But I am ready for dinner.\n\nSome questions, Pip announces, return every single day.", "fact": "Learning can connect observation, explanation, and checking. A model helps communicate an idea, while evidence helps decide whether the explanation fits. Revising a mistaken idea is part of learning. A useful question can be small and ordinary; it does not have to be about a distant planet.", "recap": "The exhibition brought together bridges, boats, animals, and space. The club explained its discoveries, remembered earlier mistakes, and collected new questions. Curiosity continued after the last display was packed away.", "phrases": ["It is ours. We made it together.", "I used to think that, but now I understand.", "What would you like to find out next?"], "question": "Why did the club display some of its earlier mistaken ideas?", "answer": "The mistakes showed how the children changed their thinking after gathering evidence and learning more.", "wonder": "Which idea from the Curiosity Club would you most like to explain to someone else?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 231.624, "word_count": 499, "words_per_minute_including_pauses": 129.3, "input_sha256": "379fce37c7e66644c06943fc5064f8302fa8a17def745ebe6bfd5633344a9679", "audio_sha256": "0c848448f120b8e5af33e273953e5ff52bdd71e534df6670eda486a0ebc7c9da", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/40_the_museum_of_better_questions.mp3", "transcript": "transcripts/40_the_museum_of_better_questions.md", "subtitle": "subtitles/40_the_museum_of_better_questions.srt", "speech": "The Curiosity Club. Episode 40. The Museum of Better Questions.\n\nHere is something to listen for. Why did the club display some of its earlier mistaken ideas?\n\nReady? Let us find out.\n\nThe Curiosity Club opens a small exhibition for families. Maya stands beside the paper bridge. Leo manages the model boat. Pip welcomes visitors with a sign: Questions are free. Please take more than one.\n\nA younger child points at the bridge. Is this yours?\n\nIt is ours, Maya says. We tested different folds together.\n\nAnother visitor asks why the clay boat floats. Leo explains the shape and the water it pushes aside. When he forgets a word, he uses a simple sentence and points to the model.\n\nAt the animal table, visitors guess which creature has three hearts. At the space table, a lamp and a ball show changing views of the Moon's bright side.\n\nPip has made a wall of earlier guesses. The Sun goes to bed. Camels keep drinking water in their humps. Penguins are fish in jackets.\n\nWhy display mistakes? a parent asks.\n\nBecause we learned to change our ideas when we found better evidence, Maya says.\n\nThe final table has blank cards. Visitors write something they would like to understand. Soon, the box is full of questions about music, oceans, buildings, and everyday life.\n\nLeo reads one: Why do we keep asking questions?\n\nPip thinks carefully. Because each answer opens another door.\n\nMaya switches off the exhibition lamp at closing time. The real Sun has not gone to bed, she reminds Leo.\n\nI know, he says. But I am ready for dinner.\n\nSome questions, Pip announces, return every single day.\n\nNow, a little more to discover.\n\nLearning can connect observation, explanation, and checking. A model helps communicate an idea, while evidence helps decide whether the explanation fits. Revising a mistaken idea is part of learning. A useful question can be small and ordinary; it does not have to be about a distant planet.\n\nLet us hear the main idea again.\n\nThe exhibition brought together bridges, boats, animals, and space. The club explained its discoveries, remembered earlier mistakes, and collected new questions. Curiosity continued after the last display was packed away.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt is ours. We made it together.\nIt is ours. We made it together.\n\nI used to think that, but now I understand.\nI used to think that, but now I understand.\n\nWhat would you like to find out next?\nWhat would you like to find out next?\n\nRemember our listening question? Why did the club display some of its earlier mistaken ideas?\n\nHere is the answer. The mistakes showed how the children changed their thinking after gathering evidence and learning more.\n\nAnd here is a question just for your imagination. Which idea from the Curiosity Club would you most like to explain to someone else?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}];
const $=id=>document.getElementById(id), audio=$('audio');
let current=0;
const minutes=s=>Math.floor(Math.round(s)/60)+':'+String(Math.round(s)%60).padStart(2,'0');
const safeStore={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const prior=Number(safeStore.get('curiosity-club-episode')||1);
const priorIndex=episodes.findIndex(e=>e.id===prior);if(priorIndex>=0)current=priorIndex;
const total=episodes.reduce((a,e)=>a+e.duration_seconds,0);
$('collection').textContent=episodes.length+' 集 · 每集约 3—4 分钟 · 总计约 '+Math.round(total/60)+' 分钟 · 美式英语';
for(const group of [...new Set(episodes.map(e=>e.category))]){const o=document.createElement('option');o.value=group;o.textContent=group;$('filter').append(o)}
function list(){
 $('episodes').replaceChildren();
 const query=$('search').value.trim().toLowerCase(),group=$('filter').value;
 episodes.forEach((e,i)=>{
  if(group&&e.category!==group)return;
  if(query&&!(e.title+' '+e.title_zh+' '+e.summary_zh+' '+e.id).toLowerCase().includes(query))return;
  const b=document.createElement('button');b.className='episode'+(i===current?' active':'');b.setAttribute('aria-label','第'+e.id+'集 '+e.title_zh+'，'+minutes(e.duration_seconds));
  if(i===current)b.setAttribute('aria-current','true');
  const n=document.createElement('span');n.className='number';n.textContent=String(e.id).padStart(2,'0');
  const title=document.createElement('span');title.textContent=e.title_zh;const en=document.createElement('span');en.className='en-title';en.textContent=e.title;title.append(en);
  const time=document.createElement('span');time.className='length';time.textContent=minutes(e.duration_seconds);
  b.append(n,title,time);b.onclick=()=>select(i,true);$('episodes').append(b);
 });
 if(!$('episodes').children.length){const p=document.createElement('p');p.className='empty';p.textContent='没有找到，试试其他关键词。';$('episodes').append(p)}
}
function play(){audio.play().catch(()=>{$('status').textContent='请点播放器上的播放按钮继续。'})}
function select(i,shouldPlay=false){
 current=(i+episodes.length)%episodes.length;const e=episodes[current];
 $('category').textContent='第 '+String(e.id).padStart(2,'0')+' 集 · '+e.category;
 $('title').textContent=e.title_zh;$('englishTitle').textContent=e.title;$('intro').textContent=e.summary_zh;
 $('words').textContent=Object.entries(e.words).map(([w,v])=>w+'：'+v).join('　 /　 ');
 $('focus').textContent='会反复遇到的表达：'+e.focus;
 $('transcript').textContent=e.speech;$('download').href=e.audio;$('subtitle').href=e.subtitle;
 $('transcriptDetails').open=false;$('status').classList.remove('error');
 $('status').textContent='时长 '+minutes(e.duration_seconds)+' · '+(e.id%2?'女声':'男声')+'美式旁白';
 audio.src=e.audio;audio.playbackRate=Number($('speed').value);audio.loop=$('repeat').checked;
 safeStore.set('curiosity-club-episode',String(e.id));list();if(shouldPlay)play();
}
$('prev').onclick=()=>select(current-1,true);$('next').onclick=()=>select(current+1,true);
$('speed').onchange=()=>{audio.playbackRate=Number($('speed').value)};
$('repeat').onchange=()=>{audio.loop=$('repeat').checked};
$('search').oninput=list;$('filter').onchange=list;
audio.addEventListener('ended',()=>{if($('autonext').checked&&!$('repeat').checked){if(current<episodes.length-1)select(current+1,true);else $('status').textContent='40 集播放完毕。可以重新挑选喜欢的故事。'}});
audio.addEventListener('error',()=>{$('status').classList.add('error');$('status').textContent='未能打开音频。请先完整解压音频包，并保留播放页与 audio 文件夹的位置。'});
if(episodes.length)select(current);else $('status').textContent='还没有可播放的音频。';
</script>
</body>
</html>
