soft sand.\n\nThe educator points out more features that help camels in dry environments. The children learn that several features work together. A single hump does not explain everything.\n\nLeo looks at Maya's backpack. You have water, food, and a hat. Three separate problems, three useful things.\n\nPip puts a charger, a map, and a photograph of a sandwich in his own travel bag.\n\nWhy the photograph? Maya asks.\n\nIt weighs less than a sandwich, he says.\n\nThat works for you, Leo replies. I would prefer the real thing.\n\nThey leave with a better question: What does each feature help an animal do?", "fact": "Camel humps store fat, which can serve as an energy reserve. They are not tanks of liquid drinking water. Camels have several adaptations that help them live in dry places, including ways to conserve water. An adaptation is a feature that helps an organism in its environment.", "recap": "The children corrected the idea that camel humps are water tanks. A hump stores fat for energy. They also learned to ask how different body features help an animal meet different needs.", "phrases": ["What does it store?", "It still needs water.", "How does this feature help?"], "question": "What is stored in a camel's hump?", "answer": "Fat is stored there. The camel can use it as an energy reserve.", "wonder": "If you designed a robot for a desert, what three features would it need?", "sources": ["https://zoo.sandiegozoo.org/animals/camel"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 210.888, "word_count": 449, "words_per_minute_including_pauses": 127.7, "input_sha256": "e7b7f78e4bac598b38c543620d9ccd59413a129bb7857b9d7b9c6691a51b0d41", "audio_sha256": "2b172d71195139b175c6557c4877f2c9df10bb514c7dbd5df5bc9a5c5a0490f5", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/15_the_camel_s_secret_backpack.mp3", "transcript": "transcripts/15_the_camel_s_secret_backpack.md", "subtitle": "subtitles/15_the_camel_s_secret_backpack.srt", "speech": "The Curiosity Club. Episode 15. The Camel's Secret Backpack.\n\nHere is something to listen for. What is stored in a camel's hump?\n\nReady? Let us find out.\n\nMaya is packing for a day trip. She puts water, lunch, and a hat in her bag. Pip shows her a picture of a camel.\n\nThis animal has a built-in backpack, he says.\n\nLeo remembers something he once heard. Does it keep water in its hump?\n\nAt the zoo, the educator answers their question. A camel's hump stores fat. That fat is an energy reserve when food is hard to find.\n\nSo it is more like stored food energy than a water bottle, Maya says.\n\nExactly. Camels still need to drink water.\n\nThey watch a camel walk slowly across its enclosure. Its broad feet spread its weight over the ground.\n\nPip examines his narrow wheels. I might need a different design for soft sand.\n\nThe educator points out more features that help camels in dry environments. The children learn that several features work together. A single hump does not explain everything.\n\nLeo looks at Maya's backpack. You have water, food, and a hat. Three separate problems, three useful things.\n\nPip puts a charger, a map, and a photograph of a sandwich in his own travel bag.\n\nWhy the photograph? Maya asks.\n\nIt weighs less than a sandwich, he says.\n\nThat works for you, Leo replies. I would prefer the real thing.\n\nThey leave with a better question: What does each feature help an animal do?\n\nNow, a little more to discover.\n\nCamel humps store fat, which can serve as an energy reserve. They are not tanks of liquid drinking water. Camels have several adaptations that help them live in dry places, including ways to conserve water. An adaptation is a feature that helps an organism in its environment.\n\nLet us hear the main idea again.\n\nThe children corrected the idea that camel humps are water tanks. A hump stores fat for energy. They also learned to ask how different body features help an animal meet different needs.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat does it store?\nWhat does it store?\n\nIt still needs water.\nIt still needs water.\n\nHow does this feature help?\nHow does this feature help?\n\nRemember our listening question? What is stored in a camel's hump?\n\nHere is the answer. Fat is stored there. The camel can use it as an energy reserve.\n\nAnd here is a question just for your imagination. If you designed a robot for a desert, what three features would it need?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 16, "title": "The Fox After Closing Time", "title_zh": "关门之后的狐狸", "category": "动物世界", "focus": "usually、at night；城市生态", "summary_zh": "学校的夜间相机拍到了意外访客，城市也能成为动物的家。", "words": {"urban": "城市的", "habitat": "栖息地", "wildlife": "野生动物"}, "story": "The school garden camera takes a picture after sunset. In it, two bright eyes shine near the fence.\n\nA tiny dragon, Leo suggests.\n\nA visitor with an excellent flashlight, says Pip.\n\nMaya looks at the next picture. Now she can see pointed ears and a long, bushy tail.\n\nA local wildlife expert identifies the visitor as a fox.\n\nBut we live in a city, Leo says.\n\nCities can have wildlife, too, the expert explains. Gardens, parks, and quiet corners can provide shelter. Some foxes find ways to live close to people.\n\nThe children study several nights of photographs. The fox does not appear at exactly the same time every evening. Sometimes the camera shows only a cat. Sometimes it shows leaves moving in the wind.\n\nWe should not call every pair of eyes a fox, Maya says.\n\nThey decide to observe from a distance and keep their food waste secured. They do not try to feed or touch the animal.\n\nPip writes a polite invitation: Dear Fox, please attend our science club.\n\nThe expert smiles. The best invitation is space to remain wild.\n\nOn the next photograph, the fox is walking away with its tail raised slightly.\n\nLeo writes the caption: The garden has a night shift.\n\nPip adds: Attendance optional. No homework assigned.", "fact": "Some foxes live successfully in towns and cities. Their habitat can include gardens and green spaces as well as quieter places to shelter. Living near people does not make an animal a pet. Careful observation can help us learn about wildlife while leaving it undisturbed.", "recap": "A nighttime camera revealed a fox near the school garden. The children learned that cities can contain wildlife habitats. They compared several pictures and chose to observe without approaching or feeding the visitor.", "phrases": ["What usually happens at night?", "We saw it near the fence.", "Let us give it some space."], "question": "Why did the children compare several photographs?", "answer": "They wanted better evidence about the visitor. Not every picture or pair of shining eyes showed the same animal.", "wonder": "What animals might share your neighborhood while most people are asleep?", "sources": ["https://www.nhm.ac.uk/discover/the-secret-life-of-urban-foxes.html"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-12%", "duration_seconds": 215.496, "word_count": 448, "words_per_minute_including_pauses": 124.7, "input_sha256": "579fdfca151d1f662806ca93dd4e127747ed4c2ad1039057d3ab65088463c8a7", "audio_sha256": "51423162ff2811968fe395d4da5d559d3c644a02aa53c1a0202e94adce5c8dde", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/16_the_fox_after_closing_time.mp3", "transcript": "transcripts/16_the_fox_after_closing_time.md", "subtitle": "subtitles/16_the_fox_after_closing_time.srt", "speech": "The Curiosity Club. Episode 16. The Fox After Closing Time.\n\nHere is something to listen for. Why did the children compare several photographs?\n\nReady? Let us find out.\n\nThe school garden camera takes a picture after sunset. In it, two bright eyes shine near the fence.\n\nA tiny dragon, Leo suggests.\n\nA visitor with an excellent flashlight, says Pip.\n\nMaya looks at the next picture. Now she can see pointed ears and a long, bushy tail.\n\nA local wildlife expert identifies the visitor as a fox.\n\nBut we live in a city, Leo says.\n\nCities can have wildlife, too, the expert explains. Gardens, parks, and quiet corners can provide shelter. Some foxes find ways to live close to people.\n\nThe children study several nights of photographs. The fox does not appear at exactly the same time every evening. Sometimes the camera shows only a cat. Sometimes it shows leaves moving in the wind.\n\nWe should not call every pair of eyes a fox, Maya says.\n\nThey decide to observe from a distance and keep their food waste secured. They do not try to feed or touch the animal.\n\nPip writes a polite invitation: Dear Fox, please attend our science club.\n\nThe expert smiles. The best invitation is space to remain wild.\n\nOn the next photograph, the fox is walking away with its tail raised slightly.\n\nLeo writes the caption: The garden has a night shift.\n\nPip adds: Attendance optional. No homework assigned.\n\nNow, a little more to discover.\n\nSome foxes live successfully in towns and cities. Their habitat can include gardens and green spaces as well as quieter places to shelter. Living near people does not make an animal a pet. Careful observation can help us learn about wildlife while leaving it undisturbed.\n\nLet us hear the main idea again.\n\nA nighttime camera revealed a fox near the school garden. The children learned that cities can contain wildlife habitats. They compared several pictures and chose to observe without approaching or feeding the visitor.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat usually happens at night?\nWhat usually happens at night?\n\nWe saw it near the fence.\nWe saw it near the fence.\n\nLet us give it some space.\nLet us give it some space.\n\nRemember our listening question? Why did the children compare several photographs?\n\nHere is the answer. They wanted better evidence about the visitor. Not every picture or pair of shining eyes showed the same animal.\n\nAnd here is a question just for your imagination. What animals might share your neighborhood while most people are asleep?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 17, "title": "Who Took a Bite of the Moon?", "title_zh": "谁咬了一口月亮？", "category": "太空与天气", "focus": "look/seem、change；月相", "summary_zh": "月亮变细不是被咬掉了，灯和球可以帮助理解月相。", "words": {"phase": "相位；月相", "reflect": "反射", "orbit": "轨道；绕行"}, "story": "Maya draws the Moon on Monday. It looks like a thin smile. Several evenings later, she draws it again. This time, the bright part looks larger.\n\nWho is changing it? Leo asks. Perhaps someone keeps taking bites and then putting them back.\n\nPip searches his imaginary menu. Moon pie: one enormous serving.\n\nMs. Park brings a ball and a lamp into a darkened classroom. The lamp represents the Sun, and the ball represents the Moon. Maya stands in one place to be the observer on Earth.\n\nThe lamp lights half the ball. As Ms. Park moves the ball around Maya, Maya sees different amounts of the bright half.\n\nThe whole ball is still there, Maya says. I just cannot see all of its lit side from here.\n\nExactly, says Ms. Park. The Moon reflects sunlight. Its changing position gives us different views of its sunlit half.\n\nLeo asks whether Earth's shadow makes the ordinary phases. Ms. Park explains that Earth's shadow causes a lunar eclipse when the objects line up appropriately. That is a different event.\n\nPip writes a notice: The Moon has not been eaten. Please cancel the emergency bakery meeting.\n\nThat evening, Maya looks up again. She draws both the bright shape she can see and a faint circle to remind herself of the whole Moon.\n\nIt is still round, she says. My view is what changes.", "fact": "The Moon does not make its own visible light like the Sun. We see sunlight reflected from its surface. As it orbits Earth, we see different portions of its illuminated half. These views are called phases. Ordinary Moon phases are not caused by Earth's shadow.", "recap": "The ball stayed whole while Maya saw different amounts of its lit half. This helped explain the Moon's changing appearance. Earth's shadow belongs in the explanation of a lunar eclipse, not the ordinary monthly phases.", "phrases": ["It looks different tonight.", "The whole object is still there.", "What changes from our point of view?"], "question": "Does the Moon actually lose a piece when it looks like a thin smile?", "answer": "No. We are seeing only a small part of its sunlit half from our position on Earth.", "wonder": "How could you keep a simple Moon diary for a week?", "sources": ["https://spaceplace.nasa.gov/moon-phases/en/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 208.272, "word_count": 479, "words_per_minute_including_pauses": 138.0, "input_sha256": "a1d45493618707bacdfaa857f86467a7a8b54cbe55e364a5c3180e1428fd458b", "audio_sha256": "9dd7cdd0222f49cb2ad48747eba9fcb93b790ef3441b57e5a95345dfa561e79a", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/17_who_took_a_bite_of_the_moon.mp3", "transcript": "transcripts/17_who_took_a_bite_of_the_moon.md", "subtitle": "subtitles/17_who_took_a_bite_of_the_moon.srt", "speech": "The Curiosity Club. Episode 17. Who Took a Bite of the Moon?.\n\nHere is something to listen for. Does the Moon actually lose a piece when it looks like a thin smile?\n\nReady? Let us find out.\n\nMaya draws the Moon on Monday. It looks like a thin smile. Several evenings later, she draws it again. This time, the bright part looks larger.\n\nWho is changing it? Leo asks. Perhaps someone keeps taking bites and then putting them back.\n\nPip searches his imaginary menu. Moon pie: one enormous serving.\n\nMs. Park brings a ball and a lamp into a darkened classroom. The lamp represents the Sun, and the ball represents the Moon. Maya stands in one place to be the observer on Earth.\n\nThe lamp lights half the ball. As Ms. Park moves the ball around Maya, Maya sees different amounts of the bright half.\n\nThe whole ball is still there, Maya says. I just cannot see all of its lit side from here.\n\nExactly, says Ms. Park. The Moon reflects sunlight. Its changing position gives us different views of its sunlit half.\n\nLeo asks whether Earth's shadow makes the ordinary phases. Ms. Park explains that Earth's shadow causes a lunar eclipse when the objects line up appropriately. That is a different event.\n\nPip writes a notice: The Moon has not been eaten. Please cancel the emergency bakery meeting.\n\nThat evening, Maya looks up again. She draws both the bright shape she can see and a faint circle to remind herself of the whole Moon.\n\nIt is still round, she says. My view is what changes.\n\nNow, a little more to discover.\n\nThe Moon does not make its own visible light like the Sun. We see sunlight reflected from its surface. As it orbits Earth, we see different portions of its illuminated half. These views are called phases. Ordinary Moon phases are not caused by Earth's shadow.\n\nLet us hear the main idea again.\n\nThe ball stayed whole while Maya saw different amounts of its lit half. This helped explain the Moon's changing appearance. Earth's shadow belongs in the explanation of a lunar eclipse, not the ordinary monthly phases.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt looks different tonight.\nIt looks different tonight.\n\nThe whole object is still there.\nThe whole object is still there.\n\nWhat changes from our point of view?\nWhat changes from our point of view?\n\nRemember our listening question? Does the Moon actually lose a piece when it looks like a thin smile?\n\nHere is the answer. No. We are seeing only a small part of its sunlit half from our position on Earth.\n\nAnd here is a question just for your imagination. How could you keep a simple Moon diary for a week?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 18, "title": "A Postcard from the Red Planet", "title_zh": "来自红色星球的明信片", "category": "太空与天气", "focus": "there is/are、would like；火星探测", "summary_zh": "假想一张火星明信片，区分探测器拍到的事实和想象。", "words": {"Mars": "火星", "rover": "行星探测车", "rust": "铁锈"}, "story": "Leo writes a pretend postcard from Mars. Dear Maya, the beach is lovely. The trees are purple. The hotel serves excellent pancakes.\n\nMaya reads it and laughs. How much of this is based on real information?\n\nThe postcard is real paper, Leo says.\n\nThe club decides to make a better space postcard. They look at pictures taken by robotic spacecraft. There are rocks, dust, hills, and wide landscapes. There is no pancake hotel in the photographs.\n\nWhy does Mars look reddish? Maya asks.\n\nMs. Park explains that iron minerals in the surface material have reacted with oxygen. Rust-colored material helps give the planet its familiar appearance.\n\nPip examines his wheels nervously. I prefer to keep my metal well maintained.\n\nThey learn that a rover is a robot designed to travel across a surface. It can carry cameras and scientific instruments. A rover's job is to gather information, not to invent exciting details.\n\nLeo rewrites his card. Dear Maya, Mars has dusty, rocky landscapes. Robots help us study it. I would like to explore it someday, but I would need much more than a backpack.\n\nWhat about the pancakes? Pip asks.\n\nI will label those as imagination, says Leo.\n\nThe finished card has two sections: What we know, and What I imagine.\n\nMaya likes it. Now the reader can enjoy the adventure without confusing the two.", "fact": "Mars is called the Red Planet because iron-bearing material on its surface has become oxidized, giving much of the dust a rusty color. Robotic orbiters, landers, and rovers gather different kinds of information. Pictures are evidence, but they cannot by themselves answer every question about a planet.", "recap": "Leo's first Mars postcard mixed invented hotels with a real planet. The club used spacecraft pictures and basic science to improve it. They kept the imaginative parts but labeled them clearly.", "phrases": ["What is it like there?", "A robot took this picture.", "I would like to find out more."], "question": "What helps give Mars its reddish appearance?", "answer": "Rust-colored, oxidized iron material in its surface dust helps give it that appearance.", "wonder": "What would your imaginary postcard from another planet say, and which parts would be invented?", "sources": ["https://spaceplace.nasa.gov/all-about-mars/en/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 216.888, "word_count": 461, "words_per_minute_including_pauses": 127.5, "input_sha256": "83bd0cff634b71190c0fe4c67a562f9d2c738f7314a559338dd47ed87cfa303d", "audio_sha256": "0d49a5ce20cab81aa0ec241ae1a5b125b45d2ac039c701c360ceef7a5a3a7975", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/18_a_postcard_from_the_red_planet.mp3", "transcript": "transcripts/18_a_postcard_from_the_red_planet.md", "subtitle": "subtitles/18_a_postcard_from_the_red_planet.srt", "speech": "The Curiosity Club. Episode 18. A Postcard from the Red Planet.\n\nHere is something to listen for. What helps give Mars its reddish appearance?\n\nReady? Let us find out.\n\nLeo writes a pretend postcard from Mars. Dear Maya, the beach is lovely. The trees are purple. The hotel serves excellent pancakes.\n\nMaya reads it and laughs. How much of this is based on real information?\n\nThe postcard is real paper, Leo says.\n\nThe club decides to make a better space postcard. They look at pictures taken by robotic spacecraft. There are rocks, dust, hills, and wide landscapes. There is no pancake hotel in the photographs.\n\nWhy does Mars look reddish? Maya asks.\n\nMs. Park explains that iron minerals in the surface material have reacted with oxygen. Rust-colored material helps give the planet its familiar appearance.\n\nPip examines his wheels nervously. I prefer to keep my metal well maintained.\n\nThey learn that a rover is a robot designed to travel across a surface. It can carry cameras and scientific instruments. A rover's job is to gather information, not to invent exciting details.\n\nLeo rewrites his card. Dear Maya, Mars has dusty, rocky landscapes. Robots help us study it. I would like to explore it someday, but I would need much more than a backpack.\n\nWhat about the pancakes? Pip asks.\n\nI will label those as imagination, says Leo.\n\nThe finished card has two sections: What we know, and What I imagine.\n\nMaya likes it. Now the reader can enjoy the adventure without confusing the two.\n\nNow, a little more to discover.\n\nMars is called the Red Planet because iron-bearing material on its surface has become oxidized, giving much of the dust a rusty color. Robotic orbiters, landers, and rovers gather different kinds of information. Pictures are evidence, but they cannot by themselves answer every question about a planet.\n\nLet us hear the main idea again.\n\nLeo's first Mars postcard mixed invented hotels with a real planet. The club used spacecraft pictures and basic science to improve it. They kept the imaginative parts but labeled them clearly.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat is it like there?\nWhat is it like there?\n\nA robot took this picture.\nA robot took this picture.\n\nI would like to find out more.\nI would like to find out more.\n\nRemember our listening question? What helps give Mars its reddish appearance?\n\nHere is the answer. Rust-colored, oxidized iron material in its surface dust helps give it that appearance.\n\nAnd here is a question just for your imagination. What would your imaginary postcard from another planet say, and which parts would be invented?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 19, "title": "The Sandwich That Would Not Stay", "title_zh": "不肯待在盘子里的三明治", "category": "太空与天气", "focus": "why/because、keep doing；在轨生活", "summary_zh": "宇航员为什么漂浮？从太空午餐讲起。", "words": {"astronaut": "宇航员", "gravity": "重力；引力", "free fall": "自由落体"}, "story": "In a space video, an astronaut releases a small object. It floats beside her instead of dropping onto a table.\n\nMy lunch would escape, Leo says. I would spend every meal chasing it.\n\nPip imagines a sandwich wearing a tiny seat belt.\n\nMaya asks a bigger question. Is there no gravity up there?\n\nMs. Park explains that Earth's gravity still acts strongly at the height of an orbiting space station. The station and the objects inside it are falling around Earth together.\n\nFalling around Earth? Leo repeats.\n\nThe station also has a great deal of sideways motion. Its path curves around the planet. The astronauts and their surroundings share that motion, so the astronauts appear to float inside.\n\nThe children use an animation to follow the curved path. They do not try to reproduce it by jumping off anything.\n\nMaya notices straps and holders in the video. Everyday objects need ways to stay in place.\n\nAn astronaut catches a floating package. Leo cheers as if she has scored a goal.\n\nThe club designs an imaginary space lunch tray. Maya adds clips for containers. Leo adds a place to hold a drink package. Pip adds a button labeled Find Missing Sandwich.\n\nWhat does that button do? asks Maya.\n\nIt says, Leo, check behind you.\n\nLeo turns around automatically. Pip is very pleased with his first successful space-lunch test.", "fact": "Astronauts in an orbiting station experience apparent weightlessness because they and the station are in continuous free fall around Earth. Gravity has not disappeared. This environment changes many ordinary tasks, including handling objects and eating. Securing equipment keeps useful things from drifting away.", "recap": "The floating object did not show that gravity was absent. The station and everything inside were falling around Earth together. The club then imagined practical ways to keep a space lunch in place.", "phrases": ["Why does it float?", "Gravity is still acting.", "Let us keep it in place."], "question": "Has Earth's gravity disappeared where astronauts orbit?", "answer": "No. Their apparent weightlessness comes from falling around Earth together with their spacecraft.", "wonder": "Which ordinary activity would be funniest or most difficult if loose objects drifted around you?", "sources": ["https://www.nasa.gov/learning-resources/for-kids-and-students/what-is-microgravity-grades-5-8/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 213.576, "word_count": 453, "words_per_minute_including_pauses": 127.3, "input_sha256": "1477f6ae7053c3b24aba098fc38f6ad1c13b67879a6bcb84b678955f1c2e88b6", "audio_sha256": "adbe52734f2526104671d98c174238f983298f6827464147d183ba28fe58abc0", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/19_the_sandwich_that_would_not_stay.mp3", "transcript": "transcripts/19_the_sandwich_that_would_not_stay.md", "subtitle": "subtitles/19_the_sandwich_that_would_not_stay.srt", "speech": "The Curiosity Club. Episode 19. The Sandwich That Would Not Stay.\n\nHere is something to listen for. Has Earth's gravity disappeared where astronauts orbit?\n\nReady? Let us find out.\n\nIn a space video, an astronaut releases a small object. It floats beside her instead of dropping onto a table.\n\nMy lunch would escape, Leo says. I would spend every meal chasing it.\n\nPip imagines a sandwich wearing a tiny seat belt.\n\nMaya asks a bigger question. Is there no gravity up there?\n\nMs. Park explains that Earth's gravity still acts strongly at the height of an orbiting space station. The station and the objects inside it are falling around Earth together.\n\nFalling around Earth? Leo repeats.\n\nThe station also has a great deal of sideways motion. Its path curves around the planet. The astronauts and their surroundings share that motion, so the astronauts appear to float inside.\n\nThe children use an animation to follow the curved path. They do not try to reproduce it by jumping off anything.\n\nMaya notices straps and holders in the video. Everyday objects need ways to stay in place.\n\nAn astronaut catches a floating package. Leo cheers as if she has scored a goal.\n\nThe club designs an imaginary space lunch tray. Maya adds clips for containers. Leo adds a place to hold a drink package. Pip adds a button labeled Find Missing Sandwich.\n\nWhat does that button do? asks Maya.\n\nIt says, Leo, check behind you.\n\nLeo turns around automatically. Pip is very pleased with his first successful space-lunch test.\n\nNow, a little more to discover.\n\nAstronauts in an orbiting station experience apparent weightlessness because they and the station are in continuous free fall around Earth. Gravity has not disappeared. This environment changes many ordinary tasks, including handling objects and eating. Securing equipment keeps useful things from drifting away.\n\nLet us hear the main idea again.\n\nThe floating object did not show that gravity was absent. The station and everything inside were falling around Earth together. The club then imagined practical ways to keep a space lunch in place.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhy does it float?\nWhy does it float?\n\nGravity is still acting.\nGravity is still acting.\n\nLet us keep it in place.\nLet us keep it in place.\n\nRemember our listening question? Has Earth's gravity disappeared where astronauts orbit?\n\nHere is the answer. No. Their apparent weightlessness comes from falling around Earth together with their spacecraft.\n\nAnd here is a question just for your imagination. Which ordinary activity would be funniest or most difficult if loose objects drifted around you?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 20, "title": "A Letter Written in Starlight", "title_zh": "用星光写成的信", "category": "太空与天气", "focus": "ago、takes time；光的旅行", "summary_zh": "看星星也像收到一封很久以前寄出的信。", "words": {"distance": "距离", "light-year": "光年", "travel": "传播；旅行"}, "story": "At an evening sky event, a guide points a telescope toward a star. Maya looks through it, then steps aside for Leo.\n\nAre we seeing the star right now? she asks.\n\nWe are receiving its light now, the guide says. But the light left the star earlier. Light travels very fast, yet space is enormous.\n\nLeo thinks of a postcard that arrives weeks after a vacation. The picture shows an earlier moment.\n\nThat is a helpful comparison, says the guide. The delay comes from travel time.\n\nPip asks whether stars need stamps. The guide tells him that light delivers the information without a postal service.\n\nThey discuss an imaginary star ten light-years away. Its light would take about ten years to reach Earth. A light-year is a distance, not a unit for someone's age.\n\nMaya looks at Leo. So you cannot say you are twelve light-years old.\n\nI can if I am a very confused birthday cake, he replies.\n\nThe guide explains that sunlight also takes time to reach us: about eight minutes. The club enjoys the evening sky without looking directly at the Sun.\n\nOn the way home, Maya imagines the sky as a collection of messages with different delivery times.\n\nPip writes his own message: Dear future listener, I hope you are still curious.\n\nLeo adds: And I hope there are snacks when the message arrives.", "fact": "Light takes time to travel. A light-year is the distance light travels in one year. When we observe distant objects, the light shows them as they were when it began its journey. Sunlight takes roughly eight minutes to reach Earth, while light from other stars takes much longer.", "recap": "The telescope collected light that had traveled through space. The club compared it to a delayed letter. They learned that a light-year measures distance and that looking farther into space also means seeing older light.", "phrases": ["How long does the journey take?", "The light left earlier.", "We are seeing a message from the past."], "question": "Is a light-year a measurement of time or distance?", "answer": "It is a measurement of distance: how far light travels in a year.", "wonder": "If you could send your future self a short message, what would you say?", "sources": ["https://spaceplace.nasa.gov/light-year/en/"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 201.336, "word_count": 477, "words_per_minute_including_pauses": 142.2, "input_sha256": "d8e08dffc8fb32de3e3a4003d27226995a9b30e348042a2f6ed9617c358b073a", "audio_sha256": "486a2778032658cbffb4ea697009d90e372afd324035e7118f134c1cd5b16894", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/20_a_letter_written_in_starlight.mp3", "transcript": "transcripts/20_a_letter_written_in_starlight.md", "subtitle": "subtitles/20_a_letter_written_in_starlight.srt", "speech": "The Curiosity Club. Episode 20. A Letter Written in Starlight.\n\nHere is something to listen for. Is a light-year a measurement of time or distance?\n\nReady? Let us find out.\n\nAt an evening sky event, a guide points a telescope toward a star. Maya looks through it, then steps aside for Leo.\n\nAre we seeing the star right now? she asks.\n\nWe are receiving its light now, the guide says. But the light left the star earlier. Light travels very fast, yet space is enormous.\n\nLeo thinks of a postcard that arrives weeks after a vacation. The picture shows an earlier moment.\n\nThat is a helpful comparison, says the guide. The delay comes from travel time.\n\nPip asks whether stars need stamps. The guide tells him that light delivers the information without a postal service.\n\nThey discuss an imaginary star ten light-years away. Its light would take about ten years to reach Earth. A light-year is a distance, not a unit for someone's age.\n\nMaya looks at Leo. So you cannot say you are twelve light-years old.\n\nI can if I am a very confused birthday cake, he replies.\n\nThe guide explains that sunlight also takes time to reach us: about eight minutes. The club enjoys the evening sky without looking directly at the Sun.\n\nOn the way home, Maya imagines the sky as a collection of messages with different delivery times.\n\nPip writes his own message: Dear future listener, I hope you are still curious.\n\nLeo adds: And I hope there are snacks when the message arrives.\n\nNow, a little more to discover.\n\nLight takes time to travel. A light-year is the distance light travels in one year. When we observe distant objects, the light shows them as they were when it began its journey. Sunlight takes roughly eight minutes to reach Earth, while light from other stars takes much longer.\n\nLet us hear the main idea again.\n\nThe telescope collected light that had traveled through space. The club compared it to a delayed letter. They learned that a light-year measures distance and that looking farther into space also means seeing older light.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nHow long does the journey take?\nHow long does the journey take?\n\nThe light left earlier.\nThe light left earlier.\n\nWe are seeing a message from the past.\nWe are seeing a message from the past.\n\nRemember our listening question? Is a light-year a measurement of time or distance?\n\nHere is the answer. It is a measurement of distance: how far light travels in a year.\n\nAnd here is a question just for your imagination. If you could send your future self a short message, what would you say?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 21, "title": "The Puddle's Long Vacation", "title_zh": "小水洼的长途旅行", "category": "太空与天气", "focus": "where、go/went；水循环", "summary_zh": "操场上的水洼变小了，水去了哪里？", "words": {"evaporate": "蒸发", "vapor": "水蒸气", "condense": "凝结"}, "story": "After rain, a puddle sits beside the playground. Leo draws a chalk line around its edge. Later, the puddle is smaller.\n\nSomeone is stealing our puddle, he announces.\n\nPip begins interviewing the nearby plants. They remain suspiciously quiet.\n\nMaya suggests another explanation. Some water may be soaking into the ground, and some may be evaporating into the air.\n\nMs. Park helps them think about the water cycle. Liquid water can become water vapor. The vapor is a gas that we cannot see with our eyes.\n\nThen are clouds invisible? Leo asks.\n\nClouds are visible because they contain tiny liquid droplets or ice crystals, Ms. Park explains. Those are different from invisible water vapor.\n\nThey draw a pretend journey for one drop: puddle, air, cloud, rain, stream. Ms. Park reminds them that real water does not always follow that exact route. Some stays underground, in ice, or in other places for a long time.\n\nPip gives the imaginary drop a suitcase.\n\nWhere is it going next? he asks.\n\nWe do not know, says Maya. Our drawing shows one possible journey.\n\nBy afternoon, the chalk line surrounds mostly dry pavement.\n\nLeo puts up a tiny sign: Puddle away on business.\n\nMaya adds: Water still on Earth. Destination uncertain.\n\nPip decides that being a drop sounds exciting, but carrying a suitcase while evaporating would be difficult.", "fact": "Water moves among air, land, oceans, rivers, and other stores. Evaporation changes liquid water into vapor. Condensation changes vapor into tiny liquid droplets. Water can return as rain or snow. The water cycle has many routes, rather than one fixed circular trip for every drop.", "recap": "A shrinking puddle led to questions about evaporation and the water cycle. The club distinguished invisible water vapor from visible cloud droplets. Their traveling drop was an imaginary example of one possible route.", "phrases": ["Where did the water go?", "We cannot see the vapor.", "There is more than one possible route."], "question": "Are the visible parts of clouds simply invisible water vapor?", "answer": "No. Visible clouds contain tiny water droplets or ice crystals. Water vapor itself is invisible.", "wonder": "Where can water stay for a long time before moving to another part of the water cycle?", "sources": ["https://www.usgs.gov/faqs/what-earths-water-cycle", "https://www.weather.gov/fgz/cloudscontrails"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 223.776, "word_count": 464, "words_per_minute_including_pauses": 124.4, "input_sha256": "a5349bbbc991dc6b157be8aa0d6bd59816629be8aef7da5b64011a6a2bab9e01", "audio_sha256": "e7944910c90e57b2c305b2543c2eb04c081ae16d37798545df90b6208407a9cf", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/21_the_puddle_s_long_vacation.mp3", "transcript": "transcripts/21_the_puddle_s_long_vacation.md", "subtitle": "subtitles/21_the_puddle_s_long_vacation.srt", "speech": "The Curiosity Club. Episode 21. The Puddle's Long Vacation.\n\nHere is something to listen for. Are the visible parts of clouds simply invisible water vapor?\n\nReady? Let us find out.\n\nAfter rain, a puddle sits beside the playground. Leo draws a chalk line around its edge. Later, the puddle is smaller.\n\nSomeone is stealing our puddle, he announces.\n\nPip begins interviewing the nearby plants. They remain suspiciously quiet.\n\nMaya suggests another explanation. Some water may be soaking into the ground, and some may be evaporating into the air.\n\nMs. Park helps them think about the water cycle. Liquid water can become water vapor. The vapor is a gas that we cannot see with our eyes.\n\nThen are clouds invisible? Leo asks.\n\nClouds are visible because they contain tiny liquid droplets or ice crystals, Ms. Park explains. Those are different from invisible water vapor.\n\nThey draw a pretend journey for one drop: puddle, air, cloud, rain, stream. Ms. Park reminds them that real water does not always follow that exact route. Some stays underground, in ice, or in other places for a long time.\n\nPip gives the imaginary drop a suitcase.\n\nWhere is it going next? he asks.\n\nWe do not know, says Maya. Our drawing shows one possible journey.\n\nBy afternoon, the chalk line surrounds mostly dry pavement.\n\nLeo puts up a tiny sign: Puddle away on business.\n\nMaya adds: Water still on Earth. Destination uncertain.\n\nPip decides that being a drop sounds exciting, but carrying a suitcase while evaporating would be difficult.\n\nNow, a little more to discover.\n\nWater moves among air, land, oceans, rivers, and other stores. Evaporation changes liquid water into vapor. Condensation changes vapor into tiny liquid droplets. Water can return as rain or snow. The water cycle has many routes, rather than one fixed circular trip for every drop.\n\nLet us hear the main idea again.\n\nA shrinking puddle led to questions about evaporation and the water cycle. The club distinguished invisible water vapor from visible cloud droplets. Their traveling drop was an imaginary example of one possible route.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhere did the water go?\nWhere did the water go?\n\nWe cannot see the vapor.\nWe cannot see the vapor.\n\nThere is more than one possible route.\nThere is more than one possible route.\n\nRemember our listening question? Are the visible parts of clouds simply invisible water vapor?\n\nHere is the answer. No. Visible clouds contain tiny water droplets or ice crystals. Water vapor itself is invisible.\n\nAnd here is a question just for your imagination. Where can water stay for a long time before moving to another part of the water cycle?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 22, "title": "The Rainbow That Moved Away", "title_zh": "追不上的彩虹", "category": "太空与天气", "focus": "seem、position；光与视角", "summary_zh": "彩虹不是固定在某处的彩色桥，为什么走近也摸不到？", "words": {"rainbow": "彩虹", "droplet": "小水滴", "bend": "弯曲；改变方向"}, "story": "A rain shower ends, and sunlight appears behind the children. Ahead of them, a rainbow stretches across the sky.\n\nIts end is near that tree, Leo says. We could walk over and see it.\n\nThey move along the path with Ms. Park. The rainbow still seems farther away.\n\nIt is escaping, says Pip. A very colorful suspect.\n\nMs. Park explains that a rainbow is not a solid object resting on the ground. It is an effect of light reaching their eyes from water droplets.\n\nSunlight contains different colors. As light enters and leaves droplets, it changes direction. Reflection inside the drops also helps send some light back toward an observer.\n\nMaya turns around. She cannot see the same rainbow in the opposite direction.\n\nSo where I stand and where I look matter, she says.\n\nExactly. Your position, the sunlight, and the droplets all matter.\n\nLeo looks at the tree again. There is no colorful door underneath it.\n\nPip offers to draw one. He can make a rainbow bridge that stays on paper.\n\nThe club sits under a shelter and sketches what they saw. Maya includes the Sun behind the observer and raindrops ahead.\n\nLeo draws a little person asking a rainbow for directions.\n\nWhat does the rainbow answer? Maya asks.\n\nYou can enjoy the view, Leo says, but you cannot use me as a shortcut to school.", "fact": "A rainbow forms when sunlight interacts with water droplets. Refraction bends the light, and reflection inside the droplets helps return it toward the observer. Different colors are separated. The rainbow you see depends on your viewpoint, so it is not a fixed object with an end you can reach.", "recap": "Walking toward a rainbow did not bring the children to a colored object. The rainbow was produced by light, water droplets, and their viewing position. Drawing the arrangement helped them understand the beautiful effect.", "phrases": ["It seems to be over there.", "Our position matters.", "Let us look from another point of view."], "question": "Why could the children not walk to a solid rainbow beside the tree?", "answer": "A rainbow is an optical effect that depends on light, droplets, and the observer's position, not a solid object on the ground.", "wonder": "Where else have you seen light separate into different colors?", "sources": ["https://www.nesdis.noaa.gov/about/k-12-education/optical-phenomena/what-causes-rainbow"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 214.296, "word_count": 480, "words_per_minute_including_pauses": 134.4, "input_sha256": "14f582070295a0378d5bc488a93b1f6d627e6b8ba31a08cebadbcec69e698a44", "audio_sha256": "4647ebd8ed6766b4a641f98fcc4e52157166709577752337634479da83bb00b5", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/22_the_rainbow_that_moved_away.mp3", "transcript": "transcripts/22_the_rainbow_that_moved_away.md", "subtitle": "subtitles/22_the_rainbow_that_moved_away.srt", "speech": "The Curiosity Club. Episode 22. The Rainbow That Moved Away.\n\nHere is something to listen for. Why could the children not walk to a solid rainbow beside the tree?\n\nReady? Let us find out.\n\nA rain shower ends, and sunlight appears behind the children. Ahead of them, a rainbow stretches across the sky.\n\nIts end is near that tree, Leo says. We could walk over and see it.\n\nThey move along the path with Ms. Park. The rainbow still seems farther away.\n\nIt is escaping, says Pip. A very colorful suspect.\n\nMs. Park explains that a rainbow is not a solid object resting on the ground. It is an effect of light reaching their eyes from water droplets.\n\nSunlight contains different colors. As light enters and leaves droplets, it changes direction. Reflection inside the drops also helps send some light back toward an observer.\n\nMaya turns around. She cannot see the same rainbow in the opposite direction.\n\nSo where I stand and where I look matter, she says.\n\nExactly. Your position, the sunlight, and the droplets all matter.\n\nLeo looks at the tree again. There is no colorful door underneath it.\n\nPip offers to draw one. He can make a rainbow bridge that stays on paper.\n\nThe club sits under a shelter and sketches what they saw. Maya includes the Sun behind the observer and raindrops ahead.\n\nLeo draws a little person asking a rainbow for directions.\n\nWhat does the rainbow answer? Maya asks.\n\nYou can enjoy the view, Leo says, but you cannot use me as a shortcut to school.\n\nNow, a little more to discover.\n\nA rainbow forms when sunlight interacts with water droplets. Refraction bends the light, and reflection inside the droplets helps return it toward the observer. Different colors are separated. The rainbow you see depends on your viewpoint, so it is not a fixed object with an end you can reach.\n\nLet us hear the main idea again.\n\nWalking toward a rainbow did not bring the children to a colored object. The rainbow was produced by light, water droplets, and their viewing position. Drawing the arrangement helped them understand the beautiful effect.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt seems to be over there.\nIt seems to be over there.\n\nOur position matters.\nOur position matters.\n\nLet us look from another point of view.\nLet us look from another point of view.\n\nRemember our listening question? Why could the children not walk to a solid rainbow beside the tree?\n\nHere is the answer. A rainbow is an optical effect that depends on light, droplets, and the observer's position, not a solid object on the ground.\n\nAnd here is a question just for your imagination. Where else have you seen light separate into different colors?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 23, "title": "The Shadow That Changed Its Mind", "title_zh": "会改变主意的影子", "category": "太空与天气", "focus": "longer/shorter、morning/afternoon；观察记录", "summary_zh": "同一根杆子的影子，为什么一天中会改变？", "words": {"shadow": "影子", "angle": "角度", "record": "记录"}, "story": "At nine in the morning, Maya marks the end of a pole's shadow with chalk. Leo writes the time beside the mark.\n\nAt lunchtime, they return. The shadow has moved and changed length.\n\nThe pole is walking when nobody watches, Pip suggests.\n\nMaya checks its base. The pole has stayed in the same place.\n\nThey return once more in the afternoon and add another mark. Now their three observations tell a small story about the day.\n\nMs. Park explains that a shadow forms when something blocks light. The Sun's apparent position in the sky changes as Earth rotates. That changes the direction and length of the shadow.\n\nIn the classroom, they use a flashlight and a toy figure. When the light is low, the figure makes a long shadow. When the light is higher, the shadow becomes shorter.\n\nLeo places a tiny hat on the figure. The shadow gets a hat, too.\n\nPip is delighted. A complete fashion show with only one model.\n\nMaya notices that the experiment is useful but not a perfect copy of the Sun and Earth. Their flashlight is much closer than the Sun.\n\nThey place the day's marks on a drawing and label the times.\n\nCould we use shadows to tell time? Leo asks.\n\nPeople have done that with sundials, says Ms. Park.\n\nPip adds one condition: The clock may take a break on a cloudy day.", "fact": "A shadow appears where an object blocks light. Its size and direction depend on the arrangement of the light, object, and surface. Earth's rotation makes the Sun appear to move across the sky. Sundials use changing shadows to indicate time when there is suitable sunlight.", "recap": "The pole stayed still, but its shadow changed during the day. A flashlight model showed how light direction affects a shadow. The club used time labels to turn separate observations into a useful record.", "phrases": ["It is shorter than before.", "We measured it in the morning.", "What stayed the same?"], "question": "Did the pole need to move for its shadow to change?", "answer": "No. The direction of the sunlight changed as Earth rotated, so the shadow changed while the pole stayed still.", "wonder": "What would you need to keep the same if you wanted to compare one shadow at different times?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 203.88, "word_count": 479, "words_per_minute_including_pauses": 141.0, "input_sha256": "3906a860b331eddb953f7c2de2ffb0faf43aad30fb1bdbb098c7bf4f2740bf4e", "audio_sha256": "01e0d0942c44b4292d158670dfba8c0900f7164b14171f404395067a6810152d", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/23_the_shadow_that_changed_its_mind.mp3", "transcript": "transcripts/23_the_shadow_that_changed_its_mind.md", "subtitle": "subtitles/23_the_shadow_that_changed_its_mind.srt", "speech": "The Curiosity Club. Episode 23. The Shadow That Changed Its Mind.\n\nHere is something to listen for. Did the pole need to move for its shadow to change?\n\nReady? Let us find out.\n\nAt nine in the morning, Maya marks the end of a pole's shadow with chalk. Leo writes the time beside the mark.\n\nAt lunchtime, they return. The shadow has moved and changed length.\n\nThe pole is walking when nobody watches, Pip suggests.\n\nMaya checks its base. The pole has stayed in the same place.\n\nThey return once more in the afternoon and add another mark. Now their three observations tell a small story about the day.\n\nMs. Park explains that a shadow forms when something blocks light. The Sun's apparent position in the sky changes as Earth rotates. That changes the direction and length of the shadow.\n\nIn the classroom, they use a flashlight and a toy figure. When the light is low, the figure makes a long shadow. When the light is higher, the shadow becomes shorter.\n\nLeo places a tiny hat on the figure. The shadow gets a hat, too.\n\nPip is delighted. A complete fashion show with only one model.\n\nMaya notices that the experiment is useful but not a perfect copy of the Sun and Earth. Their flashlight is much closer than the Sun.\n\nThey place the day's marks on a drawing and label the times.\n\nCould we use shadows to tell time? Leo asks.\n\nPeople have done that with sundials, says Ms. Park.\n\nPip adds one condition: The clock may take a break on a cloudy day.\n\nNow, a little more to discover.\n\nA shadow appears where an object blocks light. Its size and direction depend on the arrangement of the light, object, and surface. Earth's rotation makes the Sun appear to move across the sky. Sundials use changing shadows to indicate time when there is suitable sunlight.\n\nLet us hear the main idea again.\n\nThe pole stayed still, but its shadow changed during the day. A flashlight model showed how light direction affects a shadow. The club used time labels to turn separate observations into a useful record.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt is shorter than before.\nIt is shorter than before.\n\nWe measured it in the morning.\nWe measured it in the morning.\n\nWhat stayed the same?\nWhat stayed the same?\n\nRemember our listening question? Did the pole need to move for its shadow to change?\n\nHere is the answer. No. The direction of the sunlight changed as Earth rotated, so the shadow changed while the pole stayed still.\n\nAnd here is a question just for your imagination. What would you need to keep the same if you wanted to compare one shadow at different times?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 24, "title": "The Compass and the Stubborn Needle", "title_zh": "指南针与固执的小针", "category": "太空与天气", "focus": "toward/away、attract；磁力", "summary_zh": "Pip想让指南针指向零食柜，磁针却遵循自己的规则。", "words": {"compass": "指南针", "magnet": "磁铁", "pole": "磁极"}, "story": "The club prepares for a map game. Maya has a compass, and Leo has a map. Pip has already marked the snack cupboard as the most important landmark.\n\nWhy does the needle keep pointing that way? he asks.\n\nIt responds to Earth's magnetic field, Maya reads from their guide. One end points roughly toward magnetic north.\n\nPip rotates the compass case toward the snacks. The needle turns relative to the case and settles again.\n\nIt is very stubborn, he says.\n\nMs. Park brings two classroom bar magnets. The children discover that some ends pull together while others push apart.\n\nOpposite magnetic poles attract, she explains. Like poles repel.\n\nLeo moves a magnet near the compass. The needle changes direction.\n\nNow it is listening to me!\n\nIt is responding to the nearby magnet, Maya says. That is why we should keep magnetic objects away when using a compass for directions.\n\nThey also learn that magnetic north and geographic north are not exactly the same. For today's simple classroom game, they use their teacher's marked directions.\n\nPip puts the magnet aside and follows the map properly. He reaches the reading corner.\n\nNo snacks here, he reports.\n\nBut there is a book about explorers, says Leo.\n\nPip chooses it. A compass can help you find a direction, he concludes, but you still have to decide where you want to go.", "fact": "A compass contains a small magnet that aligns with the surrounding magnetic field. Nearby magnets and some metal objects can interfere with its direction. Magnetic north is not identical to the geographic North Pole. Opposite magnetic poles attract, while like poles repel.", "recap": "Turning the compass case did not make the needle choose the snack cupboard. A nearby magnet did change its direction. The children learned both how a compass helps and why nearby objects can interfere.", "phrases": ["Which way should we go?", "Keep the magnet away from it.", "The needle points in this direction."], "question": "Why did the compass needle change direction when Leo brought a magnet close?", "answer": "The nearby magnet changed the magnetic field affecting the needle.", "wonder": "If you made a map of your room, which three landmarks would help someone follow it?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 211.248, "word_count": 468, "words_per_minute_including_pauses": 132.9, "input_sha256": "1635c41035c7f0fd37687c42b5c2ccb369f3112a94cf3dc2739ecd10eb7441dc", "audio_sha256": "1705c59b1b21b4956eb5dfecad8932fc7c0a8bf825699480326a13e1294e5293", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/24_the_compass_and_the_stubborn_needle.mp3", "transcript": "transcripts/24_the_compass_and_the_stubborn_needle.md", "subtitle": "subtitles/24_the_compass_and_the_stubborn_needle.srt", "speech": "The Curiosity Club. Episode 24. The Compass and the Stubborn Needle.\n\nHere is something to listen for. Why did the compass needle change direction when Leo brought a magnet close?\n\nReady? Let us find out.\n\nThe club prepares for a map game. Maya has a compass, and Leo has a map. Pip has already marked the snack cupboard as the most important landmark.\n\nWhy does the needle keep pointing that way? he asks.\n\nIt responds to Earth's magnetic field, Maya reads from their guide. One end points roughly toward magnetic north.\n\nPip rotates the compass case toward the snacks. The needle turns relative to the case and settles again.\n\nIt is very stubborn, he says.\n\nMs. Park brings two classroom bar magnets. The children discover that some ends pull together while others push apart.\n\nOpposite magnetic poles attract, she explains. Like poles repel.\n\nLeo moves a magnet near the compass. The needle changes direction.\n\nNow it is listening to me!\n\nIt is responding to the nearby magnet, Maya says. That is why we should keep magnetic objects away when using a compass for directions.\n\nThey also learn that magnetic north and geographic north are not exactly the same. For today's simple classroom game, they use their teacher's marked directions.\n\nPip puts the magnet aside and follows the map properly. He reaches the reading corner.\n\nNo snacks here, he reports.\n\nBut there is a book about explorers, says Leo.\n\nPip chooses it. A compass can help you find a direction, he concludes, but you still have to decide where you want to go.\n\nNow, a little more to discover.\n\nA compass contains a small magnet that aligns with the surrounding magnetic field. Nearby magnets and some metal objects can interfere with its direction. Magnetic north is not identical to the geographic North Pole. Opposite magnetic poles attract, while like poles repel.\n\nLet us hear the main idea again.\n\nTurning the compass case did not make the needle choose the snack cupboard. A nearby magnet did change its direction. The children learned both how a compass helps and why nearby objects can interfere.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhich way should we go?\nWhich way should we go?\n\nKeep the magnet away from it.\nKeep the magnet away from it.\n\nThe needle points in this direction.\nThe needle points in this direction.\n\nRemember our listening question? Why did the compass needle change direction when Leo brought a magnet close?\n\nHere is the answer. The nearby magnet changed the magnetic field affecting the needle.\n\nAnd here is a question just for your imagination. If you made a map of your room, which three landmarks would help someone follow it?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 25, "title": "The Clay Boat Rescue", "title_zh": "橡皮泥小船救援", "category": "身边科学与地球", "focus": "sink/float、same/different；形状与浮力", "summary_zh": "一团会沉的材料，改变形状后能否浮起来？", "words": {"float": "漂浮", "sink": "下沉", "displace": "排开；移开"}, "story": "The science club has a small tub of water and a lump of modeling clay. Leo rolls the clay into a ball and drops it in. It sinks.\n\nPip announces a rescue mission for the clay submarine.\n\nMaya takes the clay out and dries it. What if we change its shape without adding or removing any clay?\n\nShe makes a wide little bowl with raised sides. When she places it carefully on the water, it floats.\n\nThe material is the same, Leo says. So why is the result different?\n\nMs. Park asks them to notice how much space the bowl shape takes up. Water pushes upward on objects. A floating boat displaces enough water for that upward push to balance its weight.\n\nThe hollow shape keeps water out while allowing the boat to push aside more water before it is submerged.\n\nLeo puts a small block into the boat. It sits lower. He adds more, one at a time. Eventually, water comes over the edge and the boat sinks.\n\nPip writes a passenger rule: Do not invite the entire classroom.\n\nThey make a second boat with higher sides and compare the designs. They record their results instead of assuming that every wider or taller boat will always be better.\n\nAt the end, Pip thanks the rescue team.\n\nThe submarine has returned to boat life, he says. It has requested a smaller guest list.", "fact": "Water exerts an upward force called buoyancy. An object floating at rest displaces water whose weight matches its own. A boat's overall shape, including the space that keeps water out, matters. A material that sinks as a solid lump can be part of a floating hollow boat.", "recap": "The same clay sank as a ball and floated as a hollow boat. Adding blocks made the boat sit lower until water came over the edge. The experiment connected shape, displaced water, and carrying capacity.", "phrases": ["It is made of the same material.", "What happens if we change the shape?", "It sits lower in the water."], "question": "Did Maya need a different material to make the clay float?", "answer": "No. She changed the shape into a hollow boat that could displace enough water while keeping water out.", "wonder": "What features would you try in a model boat that has to carry a few small blocks?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 205.248, "word_count": 489, "words_per_minute_including_pauses": 142.9, "input_sha256": "48ba226bd70e3e2cfbb0d2ecf28020ce3545a7f66a28736d558769c86a88c2fe", "audio_sha256": "0a1adf59c07e008d549f1a4150f6447349fe41a09ac06707192422a78a755101", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/25_the_clay_boat_rescue.mp3", "transcript": "transcripts/25_the_clay_boat_rescue.md", "subtitle": "subtitles/25_the_clay_boat_rescue.srt", "speech": "The Curiosity Club. Episode 25. The Clay Boat Rescue.\n\nHere is something to listen for. Did Maya need a different material to make the clay float?\n\nReady? Let us find out.\n\nThe science club has a small tub of water and a lump of modeling clay. Leo rolls the clay into a ball and drops it in. It sinks.\n\nPip announces a rescue mission for the clay submarine.\n\nMaya takes the clay out and dries it. What if we change its shape without adding or removing any clay?\n\nShe makes a wide little bowl with raised sides. When she places it carefully on the water, it floats.\n\nThe material is the same, Leo says. So why is the result different?\n\nMs. Park asks them to notice how much space the bowl shape takes up. Water pushes upward on objects. A floating boat displaces enough water for that upward push to balance its weight.\n\nThe hollow shape keeps water out while allowing the boat to push aside more water before it is submerged.\n\nLeo puts a small block into the boat. It sits lower. He adds more, one at a time. Eventually, water comes over the edge and the boat sinks.\n\nPip writes a passenger rule: Do not invite the entire classroom.\n\nThey make a second boat with higher sides and compare the designs. They record their results instead of assuming that every wider or taller boat will always be better.\n\nAt the end, Pip thanks the rescue team.\n\nThe submarine has returned to boat life, he says. It has requested a smaller guest list.\n\nNow, a little more to discover.\n\nWater exerts an upward force called buoyancy. An object floating at rest displaces water whose weight matches its own. A boat's overall shape, including the space that keeps water out, matters. A material that sinks as a solid lump can be part of a floating hollow boat.\n\nLet us hear the main idea again.\n\nThe same clay sank as a ball and floated as a hollow boat. Adding blocks made the boat sit lower until water came over the edge. The experiment connected shape, displaced water, and carrying capacity.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nIt is made of the same material.\nIt is made of the same material.\n\nWhat happens if we change the shape?\nWhat happens if we change the shape?\n\nIt sits lower in the water.\nIt sits lower in the water.\n\nRemember our listening question? Did Maya need a different material to make the clay float?\n\nHere is the answer. No. She changed the shape into a hollow boat that could displace enough water while keeping water out.\n\nAnd here is a question just for your imagination. What features would you try in a model boat that has to carry a few small blocks?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 26, "title": "The Plant by the Window", "title_zh": "窗边植物的午餐", "category": "身边科学与地球", "focus": "need、make、because；植物与光", "summary_zh": "植物不会吃三明治，却有自己的制造食物方式。", "words": {"leaf": "叶子", "energy": "能量", "photosynthesis": "光合作用"}, "story": "Maya notices a plant leaning toward the classroom window. Leo turns its pot to make the desk look tidier.\n\nSeveral days later, the new growth is bending toward the light again.\n\nIt likes the view, Leo says.\n\nPip offers the plant a picture of mountains. The plant does not respond.\n\nMs. Park explains that light matters for more than a nice view. Green plants use light energy to make sugars from water and carbon dioxide.\n\nIs that the plant's lunch? Maya asks.\n\nSugars provide material and energy for life, says Ms. Park. The process is called photosynthesis.\n\nLeo looks at the soil. Then the soil is not simply a bowl of food that the plant eats?\n\nSoil provides support, water, and minerals, but the plant makes sugars using light, Ms. Park explains.\n\nThe club starts an observation notebook. They record the date, where the pot stands, and what the leaves look like. They continue normal care instead of changing everything at once.\n\nPip draws a restaurant menu for the plant: light, water, and air, with a sensible supply of minerals.\n\nNo sandwiches? Leo asks.\n\nNot for this customer, says Maya.\n\nOne morning, a new leaf opens. The club celebrates quietly.\n\nPip asks whether the plant would like a loyalty card.\n\nIt already comes to this window every day, Leo says. I think it is a regular customer.", "fact": "Green plants use photosynthesis to make sugars from water and carbon dioxide using light energy. Oxygen is released in the process. Roots take up water and minerals, while leaves exchange gases with the air. Some growing plant parts bend toward light, a response called phototropism.", "recap": "The plant's growth turned toward the window. The club learned why light is important and how plants make sugars. Their notebook followed changes over time while they kept caring for the plant.", "phrases": ["What does the plant need?", "It is growing toward the light.", "Let us record what we notice."], "question": "Does a green plant get all its food simply by eating soil?", "answer": "No. It makes sugars through photosynthesis, using light, water, and carbon dioxide, while soil can provide water and minerals.", "wonder": "What differences can you notice between two leaves on the same plant?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 214.2, "word_count": 471, "words_per_minute_including_pauses": 131.9, "input_sha256": "0017acb174c2b674bd33c615dbeda737dbab7c9da0edb9c56fed14a2ecedc305", "audio_sha256": "fb698dc98a62708c0c3dd65dd0299702ef65f96b20b9475faa576feeca069138", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/26_the_plant_by_the_window.mp3", "transcript": "transcripts/26_the_plant_by_the_window.md", "subtitle": "subtitles/26_the_plant_by_the_window.srt", "speech": "The Curiosity Club. Episode 26. The Plant by the Window.\n\nHere is something to listen for. Does a green plant get all its food simply by eating soil?\n\nReady? Let us find out.\n\nMaya notices a plant leaning toward the classroom window. Leo turns its pot to make the desk look tidier.\n\nSeveral days later, the new growth is bending toward the light again.\n\nIt likes the view, Leo says.\n\nPip offers the plant a picture of mountains. The plant does not respond.\n\nMs. Park explains that light matters for more than a nice view. Green plants use light energy to make sugars from water and carbon dioxide.\n\nIs that the plant's lunch? Maya asks.\n\nSugars provide material and energy for life, says Ms. Park. The process is called photosynthesis.\n\nLeo looks at the soil. Then the soil is not simply a bowl of food that the plant eats?\n\nSoil provides support, water, and minerals, but the plant makes sugars using light, Ms. Park explains.\n\nThe club starts an observation notebook. They record the date, where the pot stands, and what the leaves look like. They continue normal care instead of changing everything at once.\n\nPip draws a restaurant menu for the plant: light, water, and air, with a sensible supply of minerals.\n\nNo sandwiches? Leo asks.\n\nNot for this customer, says Maya.\n\nOne morning, a new leaf opens. The club celebrates quietly.\n\nPip asks whether the plant would like a loyalty card.\n\nIt already comes to this window every day, Leo says. I think it is a regular customer.\n\nNow, a little more to discover.\n\nGreen plants use photosynthesis to make sugars from water and carbon dioxide using light energy. Oxygen is released in the process. Roots take up water and minerals, while leaves exchange gases with the air. Some growing plant parts bend toward light, a response called phototropism.\n\nLet us hear the main idea again.\n\nThe plant's growth turned toward the window. The club learned why light is important and how plants make sugars. Their notebook followed changes over time while they kept caring for the plant.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nWhat does the plant need?\nWhat does the plant need?\n\nIt is growing toward the light.\nIt is growing toward the light.\n\nLet us record what we notice.\nLet us record what we notice.\n\nRemember our listening question? Does a green plant get all its food simply by eating soil?\n\nHere is the answer. No. It makes sugars through photosynthesis, using light, water, and carbon dioxide, while soil can provide water and minerals.\n\nAnd here is a question just for your imagination. What differences can you notice between two leaves on the same plant?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 27, "title": "The Tiny Bakers in the Dough", "title_zh": "面团里的小小面包师", "category": "身边科学与地球", "focus": "grow、make、wait；酵母", "summary_zh": "面团慢慢鼓起来，是谁在里面工作？", "words": {"yeast": "酵母", "dough": "面团", "microorganism": "微生物"}, "story": "The club visits a bakery before opening time. The baker shows them a bowl of dough and marks its starting height.\n\nWe will check it again later, she says.\n\nPip stares at the bowl. I am ready to watch every millimeter.\n\nWhile they wait, the baker shows them ingredients. One is yeast, a living organism so small that an individual cell needs magnification to be seen clearly.\n\nLeo looks closely at the packet. Are there tiny workers with tiny hats?\n\nNo hats, the baker says. But yeast does useful work. It uses sugars and releases carbon dioxide gas. The dough traps many gas bubbles and expands.\n\nWhen they return, the dough has risen above the original mark.\n\nIt has grown without anyone adding more flour, Maya says.\n\nThe baker explains that the trapped gas has increased its volume. She does not say that a larger dough ball must contain more flour.\n\nLater, she handles the hot oven while the children watch from the visitor area. The smell of baking bread fills the room.\n\nPip creates a staff list: one baker, many yeast cells, and three extremely interested visitors.\n\nLeo asks whether all tiny living things are bad.\n\nNo, says the baker. Microorganisms have many different roles. Some help us make familiar foods.\n\nMaya writes the day's headline: Small helpers, big bubbles.\n\nLeo adds: Excellent smell. Further taste research requested.", "fact": "Baker's yeast is a microscopic fungus. It can use sugars and release carbon dioxide through fermentation. Gas bubbles become trapped in dough, helping it rise. The dough's volume increases without a matching increase in the amount of flour. Baking later changes and sets the bread's structure.", "recap": "Yeast helped the dough expand by producing gas. The height mark made the change easy to see. The club learned that some microorganisms play useful roles in making food.", "phrases": ["How much has it grown?", "Let us compare it with the first mark.", "Tiny things can make a big difference."], "question": "What made the dough expand while it rested?", "answer": "Carbon dioxide produced by yeast became trapped as gas bubbles in the dough.", "wonder": "What other useful things might be happening around you on a scale too small to see directly?", "sources": [], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-JennyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 213.504, "word_count": 469, "words_per_minute_including_pauses": 131.8, "input_sha256": "e643449b9ddd4b619e57f3f9d884d284577733f5b62b11010f00c721f9391955", "audio_sha256": "c8c6c93d9ab7094bc9932f35a118370aabf96c9a6f5c12992380fd6c102c1fd2", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/27_the_tiny_bakers_in_the_dough.mp3", "transcript": "transcripts/27_the_tiny_bakers_in_the_dough.md", "subtitle": "subtitles/27_the_tiny_bakers_in_the_dough.srt", "speech": "The Curiosity Club. Episode 27. The Tiny Bakers in the Dough.\n\nHere is something to listen for. What made the dough expand while it rested?\n\nReady? Let us find out.\n\nThe club visits a bakery before opening time. The baker shows them a bowl of dough and marks its starting height.\n\nWe will check it again later, she says.\n\nPip stares at the bowl. I am ready to watch every millimeter.\n\nWhile they wait, the baker shows them ingredients. One is yeast, a living organism so small that an individual cell needs magnification to be seen clearly.\n\nLeo looks closely at the packet. Are there tiny workers with tiny hats?\n\nNo hats, the baker says. But yeast does useful work. It uses sugars and releases carbon dioxide gas. The dough traps many gas bubbles and expands.\n\nWhen they return, the dough has risen above the original mark.\n\nIt has grown without anyone adding more flour, Maya says.\n\nThe baker explains that the trapped gas has increased its volume. She does not say that a larger dough ball must contain more flour.\n\nLater, she handles the hot oven while the children watch from the visitor area. The smell of baking bread fills the room.\n\nPip creates a staff list: one baker, many yeast cells, and three extremely interested visitors.\n\nLeo asks whether all tiny living things are bad.\n\nNo, says the baker. Microorganisms have many different roles. Some help us make familiar foods.\n\nMaya writes the day's headline: Small helpers, big bubbles.\n\nLeo adds: Excellent smell. Further taste research requested.\n\nNow, a little more to discover.\n\nBaker's yeast is a microscopic fungus. It can use sugars and release carbon dioxide through fermentation. Gas bubbles become trapped in dough, helping it rise. The dough's volume increases without a matching increase in the amount of flour. Baking later changes and sets the bread's structure.\n\nLet us hear the main idea again.\n\nYeast helped the dough expand by producing gas. The height mark made the change easy to see. The club learned that some microorganisms play useful roles in making food.\n\nHere are three useful expressions. You can listen, or say them with me.\n\nHow much has it grown?\nHow much has it grown?\n\nLet us compare it with the first mark.\nLet us compare it with the first mark.\n\nTiny things can make a big difference.\nTiny things can make a big difference.\n\nRemember our listening question? What made the dough expand while it rested?\n\nHere is the answer. Carbon dioxide produced by yeast became trapped as gas bubbles in the dough.\n\nAnd here is a question just for your imagination. What other useful things might be happening around you on a scale too small to see directly?\n\nThere is more than one possible answer. Keep wondering, and see you next time."}, {"id": 28, "title": "The Ice Cube's Hidden Side", "title_zh": "冰块藏起来的那一面", "category": "身边科学与地球", "focus": "above/below、more/less；密度", "summary_zh": "冰块为什么浮着，而且大部分藏在水面下面？", "words": {"iceberg": "冰山", "density": "密度", "volume": "体积"}, "story": "Leo drops an ice cube into a clear cup of water. Part of it sticks out, but most of it is below the surface.\n\nIt is a very small iceberg, Maya says.\n\nPip draws a tiny ship on paper and holds it beside the cup. The captain reports a much bigger object underwater.\n\nWhy does the ice float? Leo asks. It is solid, so I thought it would sink.\n\nMs. Park explains that being solid is not enough to decide whether something floats. Ordinary ice is less dense than liquid water. For the same volume, it has less mass.\n\nThey use the idea of two equal-sized boxes. If one contains more mass packed into that space, it has greater density. The boxes are only a comparison; water molecules are not little toys in boxes.\n\nMaya notices that the cube keeps turning slowly. She draws the visible part above the line and the larger part below it.\n\nA photograph showing only the top could be misleading, she says.\n\nLeo thinks of seeing only one page of a mystery story. You might miss most of the evidence.\n\nPip gives the paper ship a new instruction: Respect what you cannot see.\n\nAs the ice melts, the club watches its shape change.\n\nOur iceberg is getting smaller, says Maya.\n\nPip folds up the ship. The captain will now explore a much drier place: the bookshelf.", "fact": "Ordinary ice floats in liquid water because it is less dense. Water expands when it freezes under familiar everyday conditions. Most of a floating ice cube or iceberg stays below the surface. Density compares mass with volume; size alone does not tell you how dense something is.", "recap": "Most of the ice cube was underwater. The club connected floating ice with lower density and learned that the visible top does not show the full size of an object.", "phrases": ["Most of it is below the surface.", "We can only see part of it.", "Size alone does not tell us everything."], "question": "Why can ordinary ice float in liquid water?", "answer": "It is less dense than the surrounding liquid water.", "wonder": "What other situations show you only a small part of the whole picture?", "sources": ["https://www.usgs.gov/water-science-school/science/water-density"], "engine": "edge-tts", "engine_version": "7.2.8", "voice": "en-US-GuyNeural", "locale": "en-US", "rate": "-8%", "duration_seconds": 200.616, "word_count": 467, "words_per_minute_including_pauses": 139.7, "input_sha256": "077da05b98af94986a698a6ae8f3985dde8afe0cb07ad64300abf4480e40a517", "audio_sha256": "6eb0006a5e38a3e144ac37bd47bee188b3fb8e5d41ff373e8c150ba3f84db364", "decode_check": "passed", "human_listening_check": "not_performed", "audio": "audio/28_the_ice_cube_s_hidden_side.mp3", "transcript": "transcripts/28_the_ice_cube_s_hidden_side.md", "subtitle": "subtitles/28_the_ice_cube_s_hidden_side.srt", "speech": "The Curiosity Club. Episode 28. The Ice Cube's Hidden Side.\n\nHere is something to listen for. Why can ordinary ice float in liquid water?\n\nReady? Let us find out.\n\nLeo drops an ice cube into a clear cup of water. Part of it sticks out, but most of it is below the surface.\n\nIt is a very small iceberg, Maya says.\n\nPip draws a tiny ship on paper and holds it beside the cup. The captain reports a much bigger object underwater.\n\nWhy does the ice float? Leo asks. It is solid, so I thought it would sink.\n\nMs. Park explains that being solid is not enough to decide whether something floats. Ordinary ice is less dense than liquid water. For the same volume, it has less mass.\n\nThey use the idea of two equal-sized boxes. If one contains more mass packed into that space, it has greater density. The boxes are only a comparison; water molecules are not little toys in boxes.\n\nMaya notices that the cube keeps turning slowly. She draws the visible part above the line and the larger part below it.\n\nA photograph showing only the top could be misleading, she says.\n\nLeo thinks of seeing only one page of a mystery story. You might miss most of the evidence.\n\nPip gives the paper ship a new instruction: Respect what you cannot see.\n\nAs the ic
