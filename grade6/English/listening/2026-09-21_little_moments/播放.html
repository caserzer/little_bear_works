th say whatever you want. That doesn't help at all. Then Emma looks at the clock."}, {"speaker": "emma", "text": "How about we do both? Half an hour outside, then we come in for the game."}, {"speaker": "lucy", "text": "That works. We tell Mom where we're going and walk to the little court near my house. Emma shows me a passing game that doesn't involve keeping score. Soon, I'm having too much fun to watch the time."}, {"speaker": "emma", "text": "Half an hour's up. Ready to head back?"}, {"speaker": "lucy", "text": "Already? Okay. A deal is a deal. Back at home, we get water and sit down at the table. I explain the rules, and Emma asks a few questions before we start."}, {"speaker": "emma", "text": "It's your turn to choose. Which piece do you want?"}, {"speaker": "lucy", "text": "The blue one. Always the blue one. Emma takes the green piece, and we begin. By the end of the afternoon, we've both tried something the other person wanted. We still disagree about which activity was better. Fortunately, nobody needs to win that argument."}], "role_names": {}, "slug": "27_my_turn_to_choose", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "e6c155a3855c4808c5bd017c73bcb7945607a6f1d87d77144d6a05c7b404f692", "speech": "Lucy／第一人称旁白: Little Moments. My Turn to Choose. Emma comes over on Saturday afternoon. I have a board game ready on the table. She has brought a ball. We look at each other's plans without saying anything for a moment.\n\n朋友 Emma: What are you in the mood for?\n\nLucy／第一人称旁白: This game. I've been waiting all week to play it.\n\n朋友 Emma: I was hoping we could go outside. It's finally stopped raining.\n\nLucy／第一人称旁白: Neither of us wants to sound difficult, so we both say whatever you want. That doesn't help at all. Then Emma looks at the clock.\n\n朋友 Emma: How about we do both? Half an hour outside, then we come in for the game.\n\nLucy／第一人称旁白: That works. We tell Mom where we're going and walk to the little court near my house. Emma shows me a passing game that doesn't involve keeping score. Soon, I'm having too much fun to watch the time.\n\n朋友 Emma: Half an hour's up. Ready to head back?\n\nLucy／第一人称旁白: Already? Okay. A deal is a deal. Back at home, we get water and sit down at the table. I explain the rules, and Emma asks a few questions before we start.\n\n朋友 Emma: It's your turn to choose. Which piece do you want?\n\nLucy／第一人称旁白: The blue one. Always the blue one. Emma takes the green piece, and we begin. By the end of the afternoon, we've both tried something the other person wanted. We still disagree about which activity was better. Fortunately, nobody needs to win that argument.", "word_count": 239, "audio": "audio/27_my_turn_to_choose.mp3", "subtitle": "subtitles/27_my_turn_to_choose.srt", "transcript": "transcripts/27_my_turn_to_choose.md", "duration_seconds": 77.952, "words_per_minute_including_pauses": 184.0}, {"id": 28, "title": "The Plant on the Windowsill", "title_zh": "窗台上的小植物", "category": "家庭日常", "summary_zh": "一家人给新植物安排照顾计划，发现不能人人都额外浇一次水。", "focus": "询问是否完成、记录任务、商量照料", "words": {"plant": "植物", "soil": "土壤", "care label": "养护标签"}, "phrases": ["Has anyone watered it today?", "Let's check the care label.", "I'll write it down."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Plant on the Windowsill. Mom brings home a small plant in a yellow pot. We put it by the kitchen window, and Ben immediately gives it a name: Professor Leaf. The professor is quiet but seems friendly."}, {"speaker": "ben", "text": "Has anyone watered it today?"}, {"speaker": "mom", "text": "I watered it when we got home. Why?"}, {"speaker": "ben", "text": "I was going to give it a welcome drink."}, {"speaker": "lucy", "text": "I was thinking the same thing. Mom moves the watering can back to the shelf before Professor Leaf gets three welcomes in one afternoon."}, {"speaker": "mom", "text": "Let's check the care label. Different plants need different amounts of water. This one doesn't need a drink every time someone says hello."}, {"speaker": "lucy", "text": "We read the little label together. Mom shows us how she checks the soil and where to put a saucer under the pot."}, {"speaker": "ben", "text": "We need a schedule. Important professors have schedules."}, {"speaker": "lucy", "text": "I'll write it down. I make a small card where we can record when the plant was watered. We also agree to ask Mom before adding any more."}, {"speaker": "mom", "text": "Good. You can both help, as long as you check first."}, {"speaker": "lucy", "text": "The next morning, Ben greets the professor on his way to breakfast. He looks at the card, puts down the watering can, and gives the plant a tiny bow instead."}, {"speaker": "ben", "text": "No drink today, Professor. Just respect."}, {"speaker": "lucy", "text": "The leaves don't move. I think that means the professor approves. Or maybe he's busy preparing a lecture about why people should stop poking his soil."}], "role_names": {}, "slug": "28_the_plant_on_the_windowsill", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "3b3128a36eca57e076f4bf6101467c83bdfeaf9eaee98b65a4d8813a34e717ed", "speech": "Lucy／第一人称旁白: Little Moments. The Plant on the Windowsill. Mom brings home a small plant in a yellow pot. We put it by the kitchen window, and Ben immediately gives it a name: Professor Leaf. The professor is quiet but seems friendly.\n\n弟弟 Ben: Has anyone watered it today?\n\n妈妈: I watered it when we got home. Why?\n\n弟弟 Ben: I was going to give it a welcome drink.\n\nLucy／第一人称旁白: I was thinking the same thing. Mom moves the watering can back to the shelf before Professor Leaf gets three welcomes in one afternoon.\n\n妈妈: Let's check the care label. Different plants need different amounts of water. This one doesn't need a drink every time someone says hello.\n\nLucy／第一人称旁白: We read the little label together. Mom shows us how she checks the soil and where to put a saucer under the pot.\n\n弟弟 Ben: We need a schedule. Important professors have schedules.\n\nLucy／第一人称旁白: I'll write it down. I make a small card where we can record when the plant was watered. We also agree to ask Mom before adding any more.\n\n妈妈: Good. You can both help, as long as you check first.\n\nLucy／第一人称旁白: The next morning, Ben greets the professor on his way to breakfast. He looks at the card, puts down the watering can, and gives the plant a tiny bow instead.\n\n弟弟 Ben: No drink today, Professor. Just respect.\n\nLucy／第一人称旁白: The leaves don't move. I think that means the professor approves. Or maybe he's busy preparing a lecture about why people should stop poking his soil.", "word_count": 241, "audio": "audio/28_the_plant_on_the_windowsill.mp3", "subtitle": "subtitles/28_the_plant_on_the_windowsill.srt", "transcript": "transcripts/28_the_plant_on_the_windowsill.md", "duration_seconds": 81.744, "words_per_minute_including_pauses": 176.9}, {"id": 29, "title": "A Small Apology", "title_zh": "一句认真说的对不起", "category": "周末与朋友", "summary_zh": "Lucy不小心弄坏了朋友的书角，决定直接说明并想办法补救。", "focus": "承认错误、道歉、提出补救", "words": {"accident": "意外", "cover": "封面", "repair": "修补"}, "phrases": ["I'm really sorry.", "I should have been more careful.", "What can I do to help?"], "segments": [{"speaker": "lucy", "text": "Little Moments. A Small Apology. Emma lends me her favorite comic book. I put it on my desk, right beside a cup of water. You can probably guess what happens next. My elbow moves, the cup tips, and the corner of the cover gets wet."}, {"speaker": "ben", "text": "Oh. That doesn't look good."}, {"speaker": "lucy", "text": "No, it doesn't. I move the cup, gently dry the book, and leave it open where it won't get knocked again. The corner still looks bent. For a minute, I wish I could pretend it was always like that."}, {"speaker": "ben", "text": "Are you going to tell Emma?"}, {"speaker": "lucy", "text": "Yes. I just need to stop being nervous first. The next day, I give her the book and explain what happened. I'm really sorry. I should have been more careful."}, {"speaker": "emma", "text": "Thanks for telling me. I am disappointed, though. I really like this book."}, {"speaker": "lucy", "text": "I know. What can I do to help? I can replace it with my allowance if you'd like."}, {"speaker": "emma", "text": "Let me see how it looks when it's fully dry. Maybe we can flatten the corner. I'll tell you if I want a replacement."}, {"speaker": "lucy", "text": "Okay. I won't try to fix anything else without asking. We sit together at lunch. It feels a little awkward at first, but then Emma starts talking about the next book in the series. At home that afternoon, Ben wants an update."}, {"speaker": "ben", "text": "Are you still friends?"}, {"speaker": "lucy", "text": "Yes. Friends can be disappointed and still be friends. Also, all future cups of water are getting their own table. Far away from the comic books."}], "role_names": {}, "slug": "29_a_small_apology", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "131e0ac03fb75ff4df13ad96f73c49a221bc043397bb13a7c44acde83e9c0d99", "speech": "Lucy／第一人称旁白: Little Moments. A Small Apology. Emma lends me her favorite comic book. I put it on my desk, right beside a cup of water. You can probably guess what happens next. My elbow moves, the cup tips, and the corner of the cover gets wet.\n\n弟弟 Ben: Oh. That doesn't look good.\n\nLucy／第一人称旁白: No, it doesn't. I move the cup, gently dry the book, and leave it open where it won't get knocked again. The corner still looks bent. For a minute, I wish I could pretend it was always like that.\n\n弟弟 Ben: Are you going to tell Emma?\n\nLucy／第一人称旁白: Yes. I just need to stop being nervous first. The next day, I give her the book and explain what happened. I'm really sorry. I should have been more careful.\n\n朋友 Emma: Thanks for telling me. I am disappointed, though. I really like this book.\n\nLucy／第一人称旁白: I know. What can I do to help? I can replace it with my allowance if you'd like.\n\n朋友 Emma: Let me see how it looks when it's fully dry. Maybe we can flatten the corner. I'll tell you if I want a replacement.\n\nLucy／第一人称旁白: Okay. I won't try to fix anything else without asking. We sit together at lunch. It feels a little awkward at first, but then Emma starts talking about the next book in the series. At home that afternoon, Ben wants an update.\n\n弟弟 Ben: Are you still friends?\n\nLucy／第一人称旁白: Yes. Friends can be disappointed and still be friends. Also, all future cups of water are getting their own table. Far away from the comic books.", "word_count": 252, "audio": "audio/29_a_small_apology.mp3", "subtitle": "subtitles/29_a_small_apology.srt", "transcript": "transcripts/29_a_small_apology.md", "duration_seconds": 84.12, "words_per_minute_including_pauses": 179.7}, {"id": 30, "title": "The Hotel Room Key", "title_zh": "打不开房门的房卡", "category": "出行与办事", "summary_zh": "旅行入住后发现房卡没有反应，一家人回前台求助。", "focus": "描述故障、请求帮助、核对房间", "words": {"key card": "房卡", "front desk": "前台", "elevator": "电梯"}, "phrases": ["Our key card isn't working.", "Could you help us, please?", "Try it one more time."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Hotel Room Key. We're spending the weekend in another town. After checking in, Dad, Ben, and I take the elevator to the third floor. Ben insists on carrying the room key because it makes him feel official."}, {"speaker": "ben", "text": "Welcome to our extremely fancy vacation. Please follow me."}, {"speaker": "lucy", "text": "He taps the card against the door lock. A red light flashes. He tries again, more dramatically this time. Still red."}, {"speaker": "dad", "text": "Let's check the room number first."}, {"speaker": "lucy", "text": "The number is right. Dad tries the card, too, but the door stays closed. We take the elevator back to the lobby. Ben looks less official now."}, {"speaker": "dad", "text": "Our key card isn't working. Could you help us, please?"}, {"speaker": "clerk", "text": "Of course. May I confirm the room number and the name on the reservation?"}, {"speaker": "lucy", "text": "Dad gives her the details. She checks the booking and makes us a replacement card."}, {"speaker": "clerk", "text": "Here you go. Try it one more time. If there's still a problem, we'll send someone up to help."}, {"speaker": "ben", "text": "Does the card know we're on vacation now?"}, {"speaker": "clerk", "text": "It should be fully informed."}, {"speaker": "lucy", "text": "Upstairs, Dad taps the new card. The light turns green, and the door opens. Ben marches in and immediately claims the bed nearest the window."}, {"speaker": "dad", "text": "Hold on. We haven't decided that yet."}, {"speaker": "lucy", "text": "Ben sits down with a sigh. Being the key-card manager, apparently, doesn't include choosing everybody's beds. Our vacation is off to a very normal family start."}], "role_names": {"clerk": "酒店前台"}, "slug": "30_the_hotel_room_key", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}}, "input_sha256": "aa4624657f0bd1d4d3c6a0b45e00d355553d577d153888c815627c8bcfdbbc24", "speech": "Lucy／第一人称旁白: Little Moments. The Hotel Room Key. We're spending the weekend in another town. After checking in, Dad, Ben, and I take the elevator to the third floor. Ben insists on carrying the room key because it makes him feel official.\n\n弟弟 Ben: Welcome to our extremely fancy vacation. Please follow me.\n\nLucy／第一人称旁白: He taps the card against the door lock. A red light flashes. He tries again, more dramatically this time. Still red.\n\n爸爸: Let's check the room number first.\n\nLucy／第一人称旁白: The number is right. Dad tries the card, too, but the door stays closed. We take the elevator back to the lobby. Ben looks less official now.\n\n爸爸: Our key card isn't working. Could you help us, please?\n\n酒店前台: Of course. May I confirm the room number and the name on the reservation?\n\nLucy／第一人称旁白: Dad gives her the details. She checks the booking and makes us a replacement card.\n\n酒店前台: Here you go. Try it one more time. If there's still a problem, we'll send someone up to help.\n\n弟弟 Ben: Does the card know we're on vacation now?\n\n酒店前台: It should be fully informed.\n\nLucy／第一人称旁白: Upstairs, Dad taps the new card. The light turns green, and the door opens. Ben marches in and immediately claims the bed nearest the window.\n\n爸爸: Hold on. We haven't decided that yet.\n\nLucy／第一人称旁白: Ben sits down with a sigh. Being the key-card manager, apparently, doesn't include choosing everybody's beds. Our vacation is off to a very normal family start.", "word_count": 233, "audio": "audio/30_the_hotel_room_key.mp3", "subtitle": "subtitles/30_the_hotel_room_key.srt", "transcript": "transcripts/30_the_hotel_room_key.md", "duration_seconds": 87.888, "words_per_minute_including_pauses": 159.1}, {"id": 31, "title": "The Great Pancake Flip", "title_zh": "煎饼翻面挑战", "category": "家庭日常", "summary_zh": "周末早餐，Lucy学着耐心等煎饼做好再翻面。", "focus": "按顺序操作、请求示范、分工合作", "words": {"pancake": "煎饼", "spatula": "锅铲", "batter": "面糊"}, "phrases": ["Can you show me how?", "Is it ready to flip?", "Let's try a smaller one."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Great Pancake Flip. Sunday breakfast smells wonderful. Mom is making pancakes, and I've decided I'm old enough to help with the pan. Ben has decided he's old enough to help with the eating. Very different jobs. Can you show me how?"}, {"speaker": "mom", "text": "Sure. Stand beside me, and keep the pan handle turned inward. I'll help you with the hot pan. You can start by pouring a small circle of batter."}, {"speaker": "lucy", "text": "I pour a circle that looks more like a sleepy cloud. We watch little bubbles appear on top. Is it ready to flip?"}, {"speaker": "mom", "text": "Almost. Wait until the edges look set. Then slide the spatula underneath."}, {"speaker": "ben", "text": "I believe in you, pancake cloud."}, {"speaker": "lucy", "text": "I try to turn it, but one edge folds over. It lands looking like a blanket that someone forgot to straighten."}, {"speaker": "mom", "text": "That's okay. Let's try a smaller one. The first pancake can be a practice pancake."}, {"speaker": "ben", "text": "I volunteer to test the practice pancake."}, {"speaker": "lucy", "text": "This time, I pour less batter and wait a little longer. Mom steadies the pan while I slide the spatula underneath. One careful turn, and the pancake lands flat."}, {"speaker": "ben", "text": "Beautiful. A round breakfast miracle."}, {"speaker": "mom", "text": "Nicely done. I'll finish cooking these while you two set the table."}, {"speaker": "lucy", "text": "We bring plates, forks, and fruit to the table. Ben gets the folded pancake, just as he requested. He takes a bite and announces that it tastes exactly like a successful pancake. It simply has a more interesting shape."}], "role_names": {}, "slug": "31_the_great_pancake_flip", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "86a4e28a3ad8ff5ecc907d4887f9e776bc638989a45ffa28aa64aeb5ecfb27d1", "speech": "Lucy／第一人称旁白: Little Moments. The Great Pancake Flip. Sunday breakfast smells wonderful. Mom is making pancakes, and I've decided I'm old enough to help with the pan. Ben has decided he's old enough to help with the eating. Very different jobs. Can you show me how?\n\n妈妈: Sure. Stand beside me, and keep the pan handle turned inward. I'll help you with the hot pan. You can start by pouring a small circle of batter.\n\nLucy／第一人称旁白: I pour a circle that looks more like a sleepy cloud. We watch little bubbles appear on top. Is it ready to flip?\n\n妈妈: Almost. Wait until the edges look set. Then slide the spatula underneath.\n\n弟弟 Ben: I believe in you, pancake cloud.\n\nLucy／第一人称旁白: I try to turn it, but one edge folds over. It lands looking like a blanket that someone forgot to straighten.\n\n妈妈: That's okay. Let's try a smaller one. The first pancake can be a practice pancake.\n\n弟弟 Ben: I volunteer to test the practice pancake.\n\nLucy／第一人称旁白: This time, I pour less batter and wait a little longer. Mom steadies the pan while I slide the spatula underneath. One careful turn, and the pancake lands flat.\n\n弟弟 Ben: Beautiful. A round breakfast miracle.\n\n妈妈: Nicely done. I'll finish cooking these while you two set the table.\n\nLucy／第一人称旁白: We bring plates, forks, and fruit to the table. Ben gets the folded pancake, just as he requested. He takes a bite and announces that it tastes exactly like a successful pancake. It simply has a more interesting shape.", "word_count": 241, "audio": "audio/31_the_great_pancake_flip.mp3", "subtitle": "subtitles/31_the_great_pancake_flip.srt", "transcript": "transcripts/31_the_great_pancake_flip.md", "duration_seconds": 88.872, "words_per_minute_including_pauses": 162.7}, {"id": 32, "title": "The Return With a Receipt", "title_zh": "带着小票去退换", "category": "吃饭与购物", "summary_zh": "买回来的笔记本有印刷问题，Lucy和爸爸到店里说明情况。", "focus": "描述商品问题、提出换货、出示凭证", "words": {"receipt": "小票", "exchange": "换货", "blank": "空白的"}, "phrases": ["I'd like to exchange this.", "Do you have the receipt?", "The pages are printed upside down."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Return With a Receipt. I buy a new notebook with tiny stars on the cover. At home, I open it and discover that half the pages have the date and title boxes printed upside down. Unless I plan to write while standing on my head, something is wrong."}, {"speaker": "dad", "text": "Looks like a printing problem. We can take it back and ask about an exchange."}, {"speaker": "lucy", "text": "The next day, we return to the store. I keep the notebook and receipt together in a small bag. At the counter, I take a breath. I'd like to exchange this."}, {"speaker": "clerk", "text": "What's the problem with it?"}, {"speaker": "lucy", "text": "The pages are printed upside down. I open the notebook and show her where the pattern changes."}, {"speaker": "clerk", "text": "Oh, I see. Do you have the receipt?"}, {"speaker": "lucy", "text": "Yes, right here."}, {"speaker": "clerk", "text": "Thanks. We can exchange it for another one. Would you like the same design?"}, {"speaker": "lucy", "text": "Definitely. I still like the stars. The clerk brings another notebook, and we check it together before I put it in my bag. All the pages look right this time."}, {"speaker": "dad", "text": "Nicely handled. You explained the problem clearly."}, {"speaker": "lucy", "text": "I was worried I would sound rude."}, {"speaker": "dad", "text": "Asking politely about a problem is okay. That's part of what the service desk is there for."}, {"speaker": "lucy", "text": "At home, I write my name on the first page. The stars are still excellent, and my words are the right way up. Ben seems disappointed. He was looking forward to the upside-down writing experiment."}], "role_names": {}, "slug": "32_the_return_with_a_receipt", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "046bc783be5d2703f660b3a02b9382dfb48788e979f5f6e91328905780067e7b", "speech": "Lucy／第一人称旁白: Little Moments. The Return With a Receipt. I buy a new notebook with tiny stars on the cover. At home, I open it and discover that half the pages have the date and title boxes printed upside down. Unless I plan to write while standing on my head, something is wrong.\n\n爸爸: Looks like a printing problem. We can take it back and ask about an exchange.\n\nLucy／第一人称旁白: The next day, we return to the store. I keep the notebook and receipt together in a small bag. At the counter, I take a breath. I'd like to exchange this.\n\n店员: What's the problem with it?\n\nLucy／第一人称旁白: The pages are printed upside down. I open the notebook and show her where the pattern changes.\n\n店员: Oh, I see. Do you have the receipt?\n\nLucy／第一人称旁白: Yes, right here.\n\n店员: Thanks. We can exchange it for another one. Would you like the same design?\n\nLucy／第一人称旁白: Definitely. I still like the stars. The clerk brings another notebook, and we check it together before I put it in my bag. All the pages look right this time.\n\n爸爸: Nicely handled. You explained the problem clearly.\n\nLucy／第一人称旁白: I was worried I would sound rude.\n\n爸爸: Asking politely about a problem is okay. That's part of what the service desk is there for.\n\nLucy／第一人称旁白: At home, I write my name on the first page. The stars are still excellent, and my words are the right way up. Ben seems disappointed. He was looking forward to the upside-down writing experiment.", "word_count": 241, "audio": "audio/32_the_return_with_a_receipt.mp3", "subtitle": "subtitles/32_the_return_with_a_receipt.srt", "transcript": "transcripts/32_the_return_with_a_receipt.md", "duration_seconds": 82.92, "words_per_minute_including_pauses": 174.4}, {"id": 33, "title": "The After-School Club Choice", "title_zh": "选哪个课后社团", "category": "校园生活", "summary_zh": "Lucy和Emma想参加不同的社团，决定分别尝试再交流。", "focus": "询问活动、表达兴趣、尊重不同选择", "words": {"club": "社团", "sign up": "报名", "try out": "尝试"}, "phrases": ["What happens at the first meeting?", "Do I need any experience?", "We don't have to choose the same one."], "segments": [{"speaker": "lucy", "text": "Little Moments. The After-School Club Choice. The school hallway is covered with club posters. Emma stops in front of the art club sign. I stop in front of the cooking club sign. There's a picture of a very attractive muffin on it."}, {"speaker": "emma", "text": "You're choosing based on the picture, aren't you?"}, {"speaker": "lucy", "text": "Partly. But I also want to learn how to make something besides toast. We walk over to the teacher at the cooking club table. What happens at the first meeting?"}, {"speaker": "staff", "text": "We'll tour the kitchen, talk about the rules, and plan a simple snack together."}, {"speaker": "lucy", "text": "Do I need any experience?"}, {"speaker": "staff", "text": "No. Beginners are welcome. Bring your curiosity, and we'll start with the basics."}, {"speaker": "emma", "text": "It sounds fun. But I still really want to try art club."}, {"speaker": "lucy", "text": "We don't have to choose the same one. You can show me what you make, and I can tell you what I cook."}, {"speaker": "emma", "text": "Can you also bring me what you cook?"}, {"speaker": "staff", "text": "That depends on the recipe and our sharing rules. But you'll definitely have stories to exchange."}, {"speaker": "lucy", "text": "We check the meeting days and take the sign-up information home for our parents. Emma points out that both clubs meet on Wednesdays."}, {"speaker": "emma", "text": "We can still walk home together afterward."}, {"speaker": "lucy", "text": "Perfect. You'll have paint on your hands, and I'll probably have flour on my sleeves. Different clubs, same walk home. I look once more at the muffin picture. I hope my curiosity is ready, because my appetite certainly is."}], "role_names": {"staff": "烹饪社老师"}, "slug": "33_the_after_school_club_choice", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}, "staff": {"name": "老师／男性服务人员（按每集角色表）", "voice": "en-US-ChristopherNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "e433c01ece015ac1f5d925abfc0133f9a6ed997104df7e12b487052313c53011", "speech": "Lucy／第一人称旁白: Little Moments. The After-School Club Choice. The school hallway is covered with club posters. Emma stops in front of the art club sign. I stop in front of the cooking club sign. There's a picture of a very attractive muffin on it.\n\n朋友 Emma: You're choosing based on the picture, aren't you?\n\nLucy／第一人称旁白: Partly. But I also want to learn how to make something besides toast. We walk over to the teacher at the cooking club table. What happens at the first meeting?\n\n烹饪社老师: We'll tour the kitchen, talk about the rules, and plan a simple snack together.\n\nLucy／第一人称旁白: Do I need any experience?\n\n烹饪社老师: No. Beginners are welcome. Bring your curiosity, and we'll start with the basics.\n\n朋友 Emma: It sounds fun. But I still really want to try art club.\n\nLucy／第一人称旁白: We don't have to choose the same one. You can show me what you make, and I can tell you what I cook.\n\n朋友 Emma: Can you also bring me what you cook?\n\n烹饪社老师: That depends on the recipe and our sharing rules. But you'll definitely have stories to exchange.\n\nLucy／第一人称旁白: We check the meeting days and take the sign-up information home for our parents. Emma points out that both clubs meet on Wednesdays.\n\n朋友 Emma: We can still walk home together afterward.\n\nLucy／第一人称旁白: Perfect. You'll have paint on your hands, and I'll probably have flour on my sleeves. Different clubs, same walk home. I look once more at the muffin picture. I hope my curiosity is ready, because my appetite certainly is.", "word_count": 242, "audio": "audio/33_the_after_school_club_choice.mp3", "subtitle": "subtitles/33_the_after_school_club_choice.srt", "transcript": "transcripts/33_the_after_school_club_choice.md", "duration_seconds": 79.776, "words_per_minute_including_pauses": 182.0}, {"id": 34, "title": "The Quiet Car Ride", "title_zh": "车里安静五分钟", "category": "出行与办事", "summary_zh": "一家人坐车出游，Ben的提问不断，大家商量轮流选音乐。", "focus": "询问剩余时间、轮流选择、提出请求", "words": {"playlist": "播放列表", "rest stop": "休息站", "take turns": "轮流"}, "phrases": ["How much longer?", "Could we turn it down a little?", "Let's take turns choosing songs."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Quiet Car Ride. We've been in the car for twenty minutes when Ben asks the question Dad knew was coming."}, {"speaker": "ben", "text": "How much longer?"}, {"speaker": "dad", "text": "About an hour. We'll stop for a break on the way."}, {"speaker": "ben", "text": "And how long until the break?"}, {"speaker": "lucy", "text": "I look out the window and try not to laugh. Mom opens a playlist on her phone. Music fills the car, which gives Ben something new to talk about."}, {"speaker": "ben", "text": "I don't know this song. Can we play mine?"}, {"speaker": "lucy", "text": "Your favorite song is forty seconds long, and we heard it eight times yesterday."}, {"speaker": "mom", "text": "Let's take turns choosing songs. One each, then we start again. I'll handle the phone while Dad drives."}, {"speaker": "lucy", "text": "Ben chooses first. His song has a lot of clapping. I choose a quieter song next, and Dad taps one finger on the steering wheel. Could we turn it down a little? I'd like to hear the words without the windows shaking."}, {"speaker": "mom", "text": "Of course. How's that?"}, {"speaker": "lucy", "text": "Much better. For a few minutes, nobody says anything. The fields slide past, the music plays softly, and even Ben looks peaceful."}, {"speaker": "ben", "text": "I have a question."}, {"speaker": "dad", "text": "Let me guess. How much longer?"}, {"speaker": "ben", "text": "No. Can my next turn be two songs? Mine are very short."}, {"speaker": "lucy", "text": "We all laugh. At the rest stop, we stretch our legs and get some water. Back in the car, I add one extra quiet song to the list. Hope is a beautiful thing."}], "role_names": {}, "slug": "34_the_quiet_car_ride", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "17c1932f32b9c92236c07264bbc9f229f2bb9680d044a8ddaacffd3c6c51dd14", "speech": "Lucy／第一人称旁白: Little Moments. The Quiet Car Ride. We've been in the car for twenty minutes when Ben asks the question Dad knew was coming.\n\n弟弟 Ben: How much longer?\n\n爸爸: About an hour. We'll stop for a break on the way.\n\n弟弟 Ben: And how long until the break?\n\nLucy／第一人称旁白: I look out the window and try not to laugh. Mom opens a playlist on her phone. Music fills the car, which gives Ben something new to talk about.\n\n弟弟 Ben: I don't know this song. Can we play mine?\n\nLucy／第一人称旁白: Your favorite song is forty seconds long, and we heard it eight times yesterday.\n\n妈妈: Let's take turns choosing songs. One each, then we start again. I'll handle the phone while Dad drives.\n\nLucy／第一人称旁白: Ben chooses first. His song has a lot of clapping. I choose a quieter song next, and Dad taps one finger on the steering wheel. Could we turn it down a little? I'd like to hear the words without the windows shaking.\n\n妈妈: Of course. How's that?\n\nLucy／第一人称旁白: Much better. For a few minutes, nobody says anything. The fields slide past, the music plays softly, and even Ben looks peaceful.\n\n弟弟 Ben: I have a question.\n\n爸爸: Let me guess. How much longer?\n\n弟弟 Ben: No. Can my next turn be two songs? Mine are very short.\n\nLucy／第一人称旁白: We all laugh. At the rest stop, we stretch our legs and get some water. Back in the car, I add one extra quiet song to the list. Hope is a beautiful thing.", "word_count": 236, "audio": "audio/34_the_quiet_car_ride.mp3", "subtitle": "subtitles/34_the_quiet_car_ride.srt", "transcript": "transcripts/34_the_quiet_car_ride.md", "duration_seconds": 85.32, "words_per_minute_including_pauses": 166.0}, {"id": 35, "title": "The Shoes-Off Question", "title_zh": "做客时要脱鞋吗", "category": "周末与朋友", "summary_zh": "第一次到Emma家做客，Lucy先问清楚家里的习惯。", "focus": "礼貌询问、表示感谢、适应主人习惯", "words": {"guest": "客人", "slippers": "拖鞋", "comfortable": "舒服的"}, "phrases": ["Should I take my shoes off?", "Make yourself comfortable.", "Thanks for having me."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Shoes-Off Question. Emma invites me over after school. I've met her at the park and the library, but this is my first visit to her house. At the front door, I notice several pairs of shoes lined up neatly. Should I take my shoes off?"}, {"speaker": "emma", "text": "Yes, please. We usually leave them here. There are clean slippers in that basket if you'd like a pair."}, {"speaker": "lucy", "text": "Thanks. I put my sneakers beside hers and choose a pair of slippers. They have little clouds on them, which makes walking feel slightly more interesting."}, {"speaker": "emma", "text": "Make yourself comfortable. You can put your backpack by the chair."}, {"speaker": "lucy", "text": "Her room has a shelf full of drawings and a desk covered with colored pencils. I reach toward a tiny clay cat, then stop. May I pick this up?"}, {"speaker": "emma", "text": "Sure. Just hold the base. I made it in art class, and one ear is a little delicate."}, {"speaker": "lucy", "text": "I look at it carefully and put it back. We spend the afternoon drawing imaginary pets. Mine is a dog with enormous ears. Emma's is a very serious-looking purple turtle."}, {"speaker": "emma", "text": "Want to stay for a snack? My mom has sliced some fruit."}, {"speaker": "lucy", "text": "That sounds great. Before Dad picks me up, I put the pencils away and leave the slippers by the basket. Thanks for having me."}, {"speaker": "emma", "text": "Come again soon. Your enormous-eared dog needs a friend."}, {"speaker": "lucy", "text": "Next time, I'll bring my sketchbook. The shoes can wait by the door while we invent another impossible animal."}], "role_names": {}, "slug": "35_the_shoes_off_question", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "846287bec14575c15a8c6fa21dd2418e9ce45c952eed7d74bcc3fc66543fe686", "speech": "Lucy／第一人称旁白: Little Moments. The Shoes-Off Question. Emma invites me over after school. I've met her at the park and the library, but this is my first visit to her house. At the front door, I notice several pairs of shoes lined up neatly. Should I take my shoes off?\n\n朋友 Emma: Yes, please. We usually leave them here. There are clean slippers in that basket if you'd like a pair.\n\nLucy／第一人称旁白: Thanks. I put my sneakers beside hers and choose a pair of slippers. They have little clouds on them, which makes walking feel slightly more interesting.\n\n朋友 Emma: Make yourself comfortable. You can put your backpack by the chair.\n\nLucy／第一人称旁白: Her room has a shelf full of drawings and a desk covered with colored pencils. I reach toward a tiny clay cat, then stop. May I pick this up?\n\n朋友 Emma: Sure. Just hold the base. I made it in art class, and one ear is a little delicate.\n\nLucy／第一人称旁白: I look at it carefully and put it back. We spend the afternoon drawing imaginary pets. Mine is a dog with enormous ears. Emma's is a very serious-looking purple turtle.\n\n朋友 Emma: Want to stay for a snack? My mom has sliced some fruit.\n\nLucy／第一人称旁白: That sounds great. Before Dad picks me up, I put the pencils away and leave the slippers by the basket. Thanks for having me.\n\n朋友 Emma: Come again soon. Your enormous-eared dog needs a friend.\n\nLucy／第一人称旁白: Next time, I'll bring my sketchbook. The shoes can wait by the door while we invent another impossible animal.", "word_count": 248, "audio": "audio/35_the_shoes_off_question.mp3", "subtitle": "subtitles/35_the_shoes_off_question.srt", "transcript": "transcripts/35_the_shoes_off_question.md", "duration_seconds": 79.392, "words_per_minute_including_pauses": 187.4}, {"id": 36, "title": "The Not-So-Lost Remote", "title_zh": "遥控器没有走远", "category": "家庭日常", "summary_zh": "大家找不到遥控器，决定按照最后使用的线索逐步寻找。", "focus": "回忆经过、描述位置、请求挪动物品", "words": {"remote": "遥控器", "cushion": "靠垫", "underneath": "在下面"}, "phrases": ["Who had it last?", "Could you move over a little?", "Let's check one place at a time."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Not-So-Lost Remote. We are ready for a nature show. The snacks are ready, the lights are low, and the television is off because the remote has disappeared. Dad checks the coffee table. I check under a magazine. Ben checks his snack bowl. Why would it be in your snack bowl?"}, {"speaker": "ben", "text": "I like to be thorough."}, {"speaker": "dad", "text": "Who had it last?"}, {"speaker": "lucy", "text": "I used it this afternoon. Then I put it on the couch. I think. Maybe beside the blue cushion."}, {"speaker": "ben", "text": "Maybe the couch ate it. It eats my pencils all the time."}, {"speaker": "dad", "text": "Let's check one place at a time. Lucy, look beside the couch. Ben, check under the cushions."}, {"speaker": "lucy", "text": "I find a sock, two building blocks, and a pencil. The couch clearly has hobbies. Ben lifts one cushion, then the next. Still no remote."}, {"speaker": "ben", "text": "Dad, could you move over a little?"}, {"speaker": "dad", "text": "Why? Do you think it's underneath me?"}, {"speaker": "lucy", "text": "Dad stands up. There, exactly where he was sitting, is the remote. Nobody speaks for a second. Then Ben slowly raises one eyebrow."}, {"speaker": "ben", "text": "We checked almost everywhere except the most suspicious person."}, {"speaker": "dad", "text": "In my defense, it was surprisingly comfortable."}, {"speaker": "lucy", "text": "The television finally turns on. After the show, we put the remote in a small tray on the table. Dad checks his seat before sitting down again. The couch may eat pencils, but tonight we've rescued its biggest snack."}], "role_names": {}, "slug": "36_the_not_so_lost_remote", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}}, "input_sha256": "b14ede29a24bc0138270657aba3947108b67a59327e272b8206b9ab5f88bd4d2", "speech": "Lucy／第一人称旁白: Little Moments. The Not-So-Lost Remote. We are ready for a nature show. The snacks are ready, the lights are low, and the television is off because the remote has disappeared. Dad checks the coffee table. I check under a magazine. Ben checks his snack bowl. Why would it be in your snack bowl?\n\n弟弟 Ben: I like to be thorough.\n\n爸爸: Who had it last?\n\nLucy／第一人称旁白: I used it this afternoon. Then I put it on the couch. I think. Maybe beside the blue cushion.\n\n弟弟 Ben: Maybe the couch ate it. It eats my pencils all the time.\n\n爸爸: Let's check one place at a time. Lucy, look beside the couch. Ben, check under the cushions.\n\nLucy／第一人称旁白: I find a sock, two building blocks, and a pencil. The couch clearly has hobbies. Ben lifts one cushion, then the next. e?"}, {"speaker": "clerk", "text": "Absolutely. Anything else you'd like to know?"}, {"speaker": "lucy", "text": "No, thank you. That sounds good. Mom orders a different sandwich, and we sit by a shelf of plants. When our food arrives, I try a tiny bit of sauce first."}, {"speaker": "mom", "text": "How is it?"}, {"speaker": "lucy", "text": "Good, but a little is enough for me. I add some to one corner of the sandwich instead of pouring it over everything."}, {"speaker": "mom", "text": "Glad you asked?"}, {"speaker": "lucy", "text": "Very glad. I would have guessed Garden Stack meant a pile of lettuce with a flower on top."}, {"speaker": "clerk", "text": "Everything okay here?"}, {"speaker": "lucy", "text": "Yes, thanks. Your garden is delicious. The server laughs, and Mom smiles over her sandwich. Next time a menu sounds like poetry, I'll ask about the ingredients. It's easier than trying to eat a sunset."}], "role_names": {}, "slug": "37_a_shortcut_through_the_menu", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "3eded87f907a8b87eddc1a88b450769bf627a105c7496be142d2a44e59496a31", "speech": "Lucy／第一人称旁白: Little Moments. A Shortcut Through the Menu. Mom and I try a new sandwich shop. The menu has names like Garden Stack and Sunset Special. They sound beautiful, but I have no idea what I'm supposed to eat.\n\n妈妈: You can ask. A name doesn't tell you everything.\n\nLucy／第一人称旁白: I point to the Garden Stack when the server comes over. What's in this sandwich?\n\n店员: Roasted vegetables, cheese, lettuce, and our house sauce, on toasted bread.\n\nLucy／第一人称旁白: Is the sauce spicy?\n\n店员: A little. It has some chili in it. If you prefer, we can put it in a separate little cup.\n\nLucy／第一人称旁白: Could I have the sauce on the side?\n\ n the problem. I'm sorry. I should have checked before making plans. Would Sunday work instead?"}, {"speaker": "emma", "text": "Let me check my calendar. Sunday morning is free, but I have a family lunch at twelve."}, {"speaker": "lucy", "text": "How about nine thirty? We could stay for an hour, and you'd have time to get home."}, {"speaker": "emma", "text": "That works. Same park, by the big slide?"}, {"speaker": "lucy", "text": "Yes. I'll put it in my calendar right now. I write down the day, time, and meeting place, then tell Mom about the new plan."}, {"speaker": "mom", "text": "Good. Now we can all see what's happening."}, {"speaker": "lucy", "text": "On Saturday, we help carry light boxes to my aunt's new apartment. On Sunday, I meet Emma exactly where we agreed. She waves from beside the slide."}, {"speaker": "emma", "text": "No surprise boxes today?"}, {"speaker": "lucy", "text": "None. I checked. We walk around the park and talk about our weekend. My calendar has two clear plans instead of one impossible morning. It isn't exciting to look at, but it works beautifully."}], "role_names": {}, "slug": "38_the_calendar_collision", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "a2ca345cd52b36e7799284da4ac3d8463022f620b2dcce5a60acb884b974b397", "speech": "Lucy／第一人称旁白: Little Moments. The Calendar Collision. I tell Mom I'm meeting Emma at the park on Saturday morning. Mom looks up from the family calendar with a puzzled expression. That is never a good sign.\n\n妈妈: Saturday morning? We're helping your aunt move some boxes, remember?\n\nLucy／第一人称旁白: Oh. I remembered the boxes, but apparently I forgot what day they belonged to. I think I double-booked myself.\n\n妈妈: It happens. Tell Emma as soon as you can, and see whether another time works.\n\nLucy／第一人称旁白: I call Emma and explain the problem. I'm sorry. I should have checked before making plans. Would Sunday work instead?\n\n朋友 Emma: Let me check my calendar. Sunday morning is free, but I have a family lunch at twelve.\n\nLucy／第一人称旁白: How about nine thirty? We could stay for an hour, and you'd have time to get home.\n\n朋友 Emma: That works. Same park, by the big slide?\n\nLucy／第一人称旁白: Yes. I'll put it in my calendar right now. I write down the day, time, and meeting place, then tell Mom about the new plan.\n\n妈妈: Good. Now we can all see what's happening.\n\nLucy／第一人称旁白: On Saturday, we help carry light boxes to my aunt's new apartment. On Sunday, I meet Emma exactly where we agreed. She waves from beside the slide.\n\n朋友 Emma: No surprise boxes today?\n\nLucy／第一人称旁白: None. I checked. We walk around the park and talk about our weekend. My calendar has two clear plans instead of one impossible morning. It isn't exciting to look at, but it works beautifully.", "word_count": 239, "audio": "audio/38_the_calendar_collision.mp3", "subtitle": "subtitles/38_the_calendar_collision.srt", "transcript": "transcripts/38_the_calendar_collision.md", "duration_seconds": 85.704, "words_per_minute_including_pauses": 167.3}, {"id": 39, "title": "The Neighborhood Cleanup", "title_zh": "社区清洁小队", "category": "周末与朋友", "summary_zh": "参加社区活动时，Lucy和朋友分工捡拾垃圾，也懂得请大人处理不认识的物品。", "focus": "报名参与、询问分工、说明发现", "words": {"gloves": "手套", "cleanup": "清洁活动", "team": "小队"}, "phrases": ["Where should we start?", "I'll hold the bag.", "Let's ask an adult about that."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Neighborhood Cleanup. On Saturday, Dad takes Emma, Ben, and me to a cleanup at the park. We join the volunteers near the entrance and get gloves, bags, and litter pickers. Ben immediately starts opening and closing his picker like a giant bird beak."}, {"speaker": "dad", "text": "Remember, pick up ordinary litter only. Leave sharp or unfamiliar things alone and show an adult."}, {"speaker": "lucy", "text": "Where should we start?"}, {"speaker": "dad", "text": "Along this path. Stay where I can see you, and don't reach into the bushes."}, {"speaker": "emma", "text": "I'll hold the bag. Lucy, you can use the picker. We'll switch in a few minutes."}, {"speaker": "lucy", "text": "We find paper cups, snack wrappers, and a very lonely plastic spoon. Ben spots something shiny near the edge of the path but stops before touching it."}, {"speaker": "ben", "text": "I can't tell what that is."}, {"speaker": "lucy", "text": "Let's ask an adult about that. Dad calls the organizer over, and we leave it for them to handle. Then we return to the easy things on our stretch of path."}, {"speaker": "emma", "text": "This looks better already. You can actually see the grass beside the bench."}, {"speaker": "ben", "text": "I found another spoon. Maybe they're friends."}, {"speaker": "lucy", "text": "After our turn, we hand in the equipment and wash our hands before having a snack. The park isn't magically perfect, but our little section looks much tidier."}, {"speaker": "dad", "text": "Nice work, team."}, {"speaker": "lucy", "text": "Ben gives his empty hands one last imaginary bird-beak snap. Emma and I laugh. It turns out a cleanup can be useful and slightly ridiculous at the same time."}], "role_names": {}, "slug": "39_the_neighborhood_cleanup", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "236e5342a19fd5fabafec07d4c24b969362325a990eed12d745a949f34a38197", "speech": "Lucy／第一人称旁白: Little Moments. The Neighborhood Cleanup. On Saturday, Dad takes Emma, Ben, and me [{"speaker": "lucy", "text": "Little Moments. The Best Part Was Tiny. At dinner on Sunday, Mom asks us a question. She wants to know one good thing from the week. Ben immediately says dessert, even though dessert hasn't happened yet."}, {"speaker": "mom", "text": "Something that already happened, please. Lucy, what was your favorite part?"}, {"speaker": "lucy", "text": "Mine was something small. Emma saved me a seat at lunch on a day when I felt tired. She didn't make a big deal of it. She just moved her backpack and smiled."}, {"speaker": "dad", "text": "That sounds like a good day."}, {"speaker": "lucy", "text": "It became a better day. What about you?"}, {"speaker": "dad", "text": "I found the screwdriver I'd been looking for. It was exactly where I had put it away."}, {"speaker": "ben", "text": "Amazing. A mystery with no mystery."}, {"speaker": "mom", "text": "My favorite moment was hearing you two laugh while you folded the laundry. I almost didn't want to interrupt."}, {"speaker": "lucy", "text": "That was the missing-sock investigation. A very serious operation. Ben thinks for a moment, then looks toward the kitchen window."}, {"speaker": "ben", "text": "Professor Leaf has a new leaf. I noticed it this morning."}, {"speaker": "mom", "text": "Really? You'll have to show us after dinner."}, {"speaker": "lucy", "text": "We all turn to look at the little plant in its yellow pot. Ben stands up proudly, as if he grew the leaf himself. I realize nobody chose anything expensive or enormous. A seat, a tool, a laugh, a leaf."}, {"speaker": "dad", "text": "Now, who would like dessert?"}, {"speaker": "ben", "text": "Finally. My next favorite moment is arriving."}, {"speaker": "lucy", "text": "We pass the plates around. I decide I like this game. Next week, I'll pay a little more attention to the tiny good things, especially the ones that happen before dessert."}], "role_names": {}, "slug": "40_the_best_part_was_tiny", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "3073ca98d3135ef33f3d8b9dec18aabfa697eccad3f7c39076a8173b58a89786", "speech": "Lucy／第一人称旁白: Little Moments. The Best Part Was Tiny. At dinner on Sunday, Mom asks us a question. She wants to know one good thing from the week. Ben immediately says dessert, even though dessert hasn't happened yet.\n\n妈妈: Something that already happened, please. Lucy, what was your favorite part?\n\nLucy／第一人称旁白: Mine was something small. Emma saved me a seat at lunch on a day when I felt tired. She didn't make a big deal of it. She just moved her backpack and smiled.\n\n爸爸: That sounds like a good day.\n\nLucy／第一人称旁白: It became a better day. What about you?\n\n爸爸: I found the screwdriver I'd been looking for. It was exactly where I had put it away.\n\n弟弟 Ben: Amazing. A mystery with no mystery.\n\n妈妈: My favorite moment was hearing you two laugh while you folded the laundry. I almost didn't want to interrupt.\n\nLucy／第一人称旁白: That was the missing-sock investigation. A very serious operation. Ben thinks for a moment, then looks toward the kitchen window.\n\n弟弟 Ben: Professor Leaf has a new leaf. I noticed it this morning.\n\n妈妈: Really? You'll have to show us after dinner.\n\nLucy／第一人称旁白: We all turn to look at the little plant in its yellow pot. Ben stands up proudly, as if he grew the leaf himself. I realize nobody chose anything expensive or enormous. A seat, a tool, a laugh, a leaf.\n\n爸爸: Now, who would like dessert?\n\n弟弟 Ben: Finally. My next favorite moment is arriving.\n\nLucy／第一人称旁白: We pass the plates around. I decide I like this game. Next week, I'll pay a little more attention to the tiny good things, especially the ones that happen before dessert.", let current=0;
const minutes=s=>Math.floor(Math.round(s)/60)+':'+String(Math.round(s)%60).padStart(2,'0');
const safeStore={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const prior=Number(safeStore.get('little-moments-episode')||1);
const priorIndex=episodes.findIndex(e=>e.id===prior);if(priorIndex>=0)current=priorIndex;
const total=episodes.reduce((a,e)=>a+e.duration_seconds,0);
$('collection').textContent=episodes.length+' 集 · 分角色对话 · 总计约 '+Math.round(total/60)+' 分钟 · 美式英语';
for(const group of [...new Set(episodes.map(e=>e.category))]){const o=document.createElement('option');o.value=group;o.textContent=group;$('filter').append(o)}
function list(){
 $('episodes').replaceChildren();
 const query=$('search').value.trim().toLowerCase(),group=$('filter').value;
 episodes.forEach((e,i)=>{
  if(group&&e.category!==group)return;
  if(query&&!(e.title+' '+e.title_zh+' '+e.summary_zh+' '+e.id).toLowerCase().includes(query))return;
  const b=document.createElement('button');b.className='episode'+(i===current?' active':'');b.setAttribute('aria-label','第'+e.id+'集 '+e.title_zh+'，'+minutes(e.duration_seconds));
  if(i===current)b.setAttribute('aria-current','true');
  const n=document.createElement('span');n.className='number';n.textContent=String(e.id).padStart(2,'0');
  const title=document.createElement('span');title.textContent=e.title_zh;const en=document.createElement('span');en.className='en-title';en.textContent=e.title;title.append(en);
  const time=document.createElement('span');time.className='length';time.textContent=minutes(e.duration_seconds);
  b.append(n,title,time);b.onclick=()=>select(i,true);$('episodes').append(b);
 });
 if(!$('episodes').children.length){const p=document.createElement('p');p.className='empty';p.textContent='没有找到，试试其他关键词。';$('episodes').append(p)}
}
function play(){audio.play().catch(()=>{$('status').textContent='请点播放器上的播放按钮继续。'})}
function select(i,shouldPlay=false){
 current=(i+episodes.length)%episodes.length;const e=episodes[current];
 $('category').textContent='第 '+String(e.id).padStart(2,'0')+' 集 · '+e.category;
 $('title').textContent=e.title_zh;$('englishTitle').textContent=e.title;$('intro').textContent=e.summary_zh;
 $('words').textContent=Object.entries(e.words).map(([w,v])=>w+'：'+v).join('　 /　 ');
 $('focus').textContent='生活情境：'+e.focus;
 $('transcript').textContent=e.speech;$('download').href=e.audio;$('subtitle').href=e.subtitle;
 $('transcriptDetails').open=false;$('status').classList.remove('error');
 $('status').textContent='时长 '+minutes(e.duration_seconds)+' · '+Object.keys(e.cast).length+'个不同角色声音';
 audio.src=e.audio;audio.playbackRate=Number($('speed').value);audio.loop=$('repeat').checked;
 safeStore.set('little-moments-episode',String(e.id));list();if(shouldPlay)play();
}
$('prev').onclick=()=>select(current-1,true);$('next').onclick=()=>select(current+1,true);
$('speed').onchange=()=>{audio.playbackRate=Number($('speed').value)};
$('repeat').onchange=()=>{audio.loop=$('repeat').checked};
$('search').oninput=list;$('filter').onchange=list;
audio.addEventListener('ended',()=>{if($('autonext').checked&&!$('repeat').checked){if(current<episodes.length-1)select(current+1,true);else $('status').textContent='40 集播放完毕。可以重新挑选喜欢的故事。'}});
audio.addEventListener('error',()=>{$('status').classList.add('error');$('status').textContent='未能打开音频。请先完整解压音频包，并保留播放页与 audio 文件夹的位置。'});
if(episodes.length)select(current);else $('status').textContent='还没有可播放的音频。';
</script>
</body>
</html>
