od idea. Mine can say Dad, and yours can say Lucy.\n\nLucy／第一人称旁白: Ben suggests a third label for himself: Person Who Would Like More Pasta. We give him a sticker, but we keep our lunchboxes.", "word_count": 237, "audio": "audio/03_the_lunchbox_mix_up.mp3", "subtitle": "subtitles/03_the_lunchbox_mix_up.srt", "transcript": "transcripts/03_the_lunchbox_mix_up.md", "duration_seconds": 85.68, "words_per_minute_including_pauses": 166.0}, {"id": 4, "title": "Is This Seat Taken?", "title_zh": "这里有人坐吗", "category": "校园生活", "summary_zh": "Lucy在图书馆找座位，和Emma一起寻找一本有趣的书。", "focus": "询问空位、借书、表达阅读偏好", "words": {"seat": "座位", "due": "到期的", "shelf": "书架"}, "phrases": ["Is this seat taken?", "I'm looking for something funny.", "When is it due?"], "segments": [{"speaker": "lucy", "text": "Little Moments. Is This Seat Taken? The school library is busy after lunch. I carry two heavy books between the tables until I spot Emma beside an empty chair. Is this seat taken?"}, {"speaker": "emma", "text": "It's yours. Just watch out for my backpack. It's trying to take over the floor."}, {"speaker": "lucy", "text": "I sit down and put my books on the table. One is about mountain climbing. The other is about a detective who loses his own keys. I'm looking for something funny."}, {"speaker": "emma", "text": "Then I'd start with the detective. Losing your keys while solving a mystery sounds pretty good."}, {"speaker": "lucy", "text": "I open the first page. The detective is locked outside his office. Emma leans over, and we both start laughing. We quickly cover our mouths because everyone else is reading quietly."}, {"speaker": "staff", "text": "Sounds like you found a good one. Would you like to check it out?"}, {"speaker": "lucy", "text": "Yes, please. When is it due?"}, {"speaker": "staff", "text": "In two weeks. The date is on this slip. You can renew it if nobody else is waiting for it."}, {"speaker": "emma", "text": "Can I borrow it after you? No spoilers, though."}, {"speaker": "lucy", "text": "Deal. I put the library slip inside the book and check my pockets before we leave."}, {"speaker": "emma", "text": "What are you looking for?"}, {"speaker": "lucy", "text": "My house key. I don't want to end up like this detective."}, {"speaker": "staff", "text": "A very sensible decision."}, {"speaker": "lucy", "text": "My key is exactly where it belongs. The detective would be impressed. Now he just needs to find his."}], "role_names": {"staff": "图书管理员"}, "slug": "04_is_this_seat_taken", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}, "staff": {"name": "老师／男性服务人员（按每集角色表）", "voice": "en-US-ChristopherNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "714888b90c62c6ee67097d959687c308aeeaf1e611de6a35b195361dedb7073c", "speech": "Lucy／第一人称旁白: Little Moments. Is This Seat Taken? The school library is busy after lunch. I carry two heavy books between the tables until I spot Emma beside an empty chair. Is this seat taken?\n\n朋友 Emma: It's yours. Just watch out for my backpack. It's trying to take over the floor.\n\nLucy／第一人称旁白: I sit down and put my books on the table. One is about mountain climbing. The other is about a detective who loses his own keys. I'm looking for something funny.\n\n朋友 Emma: Then I'd start with the detective. Losing your keys while solving a mystery sounds pretty good.\n\nLucy／第一人称旁白: I open the first page. The detective is locked outside his office. Emma leans over, and we both start laughing. We quickly cover our mouths because everyone else is reading quietly.\n\n图书管理员: Sounds like you found a good one. Would you like to check it out?\n\nLucy／第一人称旁白: Yes, please. When is it due?\n\n图书管理员: In two weeks. The date is on this slip. You can renew it if nobody else is waiting for it.\n\n朋友 Emma: Can I borrow it after you? No spoilers, though.\n\nLucy／第一人称旁白: Deal. I put the library slip inside the book and check my pockets before we leave.\n\n朋友 Emma: What are you looking for?\n\nLucy／第一人称旁白: My house key. I don't want to end up like this detective.\n\n图书管理员: A very sensible decision.\n\nLucy／第一人称旁白: My key is exactly where it belongs. The detective would be impressed. Now he just needs to find his.", "word_count": 231, "audio": "audio/04_is_this_seat_taken.mp3", "subtitle": "subtitles/04_is_this_seat_taken.srt", "transcript": "transcripts/04_is_this_seat_taken.md", "duration_seconds": 79.68, "words_per_minute_including_pauses": 173.9}, {"id": 5, "title": "A Cart With One Wobbly Wheel", "title_zh": "购物车的小麻烦", "category": "吃饭与购物", "summary_zh": "Lucy和妈妈按清单购物，Ben一直试图加入新东西。", "focus": "寻找货架、核对清单、比较包装", "words": {"cart": "购物车", "aisle": "货架通道", "list": "清单"}, "phrases": ["Which aisle is the cereal in?", "Is that on the list?", "We already have some at home."], "segments": [{"speaker": "lucy", "text": "Little Moments. A Cart With One Wobbly Wheel. Our shopping cart makes a tiny squeak every time Mom turns a corner. Ben thinks it sounds like a mouse. I think it sounds like a mouse asking for a vacation."}, {"speaker": "mom", "text": "We need milk, eggs, bread, and cereal. Lucy, can you hold the list?"}, {"speaker": "ben", "text": "And cookies. Very important cookies."}, {"speaker": "lucy", "text": "Is that on the list? Ben looks over my shoulder as if the word might appear if he stares hard enough. It doesn't. We reach the end of the aisle, but there's still no cereal."}, {"speaker": "mom", "text": "Excuse me. Which aisle is the cereal in?"}, {"speaker": "clerk", "text": "Aisle five, next to the oatmeal. The signs above you show the aisle numbers."}, {"speaker": "lucy", "text": "Thanks. In aisle five, Ben picks up the biggest box he can reach. It's almost the size of his backpack."}, {"speaker": "ben", "text": "This one has a spaceship on it."}, {"speaker": "mom", "text": "Let's compare the smaller box, too. We only need enough for this week, and we already have some at home."}, {"speaker": "lucy", "text": "We choose the smaller box and cross cereal off the list. At checkout, I count four things. Milk, eggs, bread, and cereal. Perfect."}, {"speaker": "ben", "text": "The cart did all that work without getting any cookies."}, {"speaker": "mom", "text": "The cart doesn't eat cookies."}, {"speaker": "ben", "text": "That explains the squeaking. It's upset."}, {"speaker": "lucy", "text": "We park it with the other carts. I give it a little wave. Thanks for the ride, tiny mouse. Enjoy your break."}], "role_names": {}, "slug": "05_a_cart_with_one_wobbly_wheel", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "4d456b1b9ad0174765db94d60bdd7c2d8eb25a160d044dcfdccd9c66d2636a5d", "speech": "Lucy／第一人称旁白: Little Moments. A Cart With One Wobbly Wheel. Our shopping cart makes a tiny squeak every time Mom turns a corner. Ben thinks it sounds like a mouse. I think it sounds like a mouse asking for a vacation.\n\n妈妈: We need milk, eggs, bread, and cereal. Lucy, can you hold the list?\n\n弟弟 Ben: And cookies. Very important cookies.\n\nLucy／第一人称旁白: Is that on the list? Ben looks over my shoulder as if the word might appear if he stares hard enough. It doesn't. We reach the end of the aisle, but there's still no cereal.\n\n妈妈: Excuse me. Which aisle is the cereal in?\n\n店员: Aisle five, next to the oatmeal. The signs above you show the aisle numbers.\n\nLucy／第一人称旁白: Thanks. In aisle five, Ben picks up the biggest box he can reach. It's almost the size of his backpack.\n\n弟弟 Ben: This one has a spaceship on it.\n\n妈妈: Let's compare the smaller box, too. We only need enough for this week, and we already have some at home.\n\nLucy／第一人称旁白: We choose the smaller box and cross cereal off the list. At checkout, I count four things. Milk, eggs, bread, and cereal. Perfect.\n\n弟弟 Ben: The cart did all that work without getting any cookies.\n\n妈妈: The cart doesn't eat cookies.\n\n弟弟 Ben: That explains the squeaking. It's upset.\n\nLucy／第一人称旁白: We park it with the other carts. I give it a little wave. Thanks for the ride, tiny mouse. Enjoy your break.", "word_count": 227, "audio": "audio/05_a_cart_with_one_wobbly_wheel.mp3", "subtitle": "subtitles/05_a_cart_with_one_wobbly_wheel.srt", "transcript": "transcripts/05_a_cart_with_one_wobbly_wheel.md", "duration_seconds": 84.96, "words_per_minute_including_pauses": 160.3}, {"id": 6, "title": "No Ice, Please", "title_zh": "饮料里不要冰", "category": "吃饭与购物", "summary_zh": "一次饮品点单里，Lucy练习清楚说明自己的选择。", "focus": "点饮料、确认大小、礼貌纠正", "words": {"lemonade": "柠檬水", "regular": "普通大小的", "receipt": "小票"}, "phrases": ["Could I get a small lemonade?", "No ice, please.", "Sorry, I asked for no ice."], "segments": [{"speaker": "lucy", "text": "Little Moments. No Ice, Please. Emma and I stop at a little sandwich shop after school. It's warm outside, and we both want something to drink. The menu has about twenty choices. My brain wants all twenty."}, {"speaker": "emma", "text": "I'm getting water. You can study the menu, but I'm not waiting until tomorrow."}, {"speaker": "lucy", "text": "Okay, decision made. Could I get a small lemonade?"}, {"speaker": "clerk", "text": "Sure. Regular or strawberry?"}, {"speaker": "lucy", "text": "Regular, please. And no ice, please."}, {"speaker": "clerk", "text": "One small regular lemonade with no ice. Anything else?"}, {"speaker": "emma", "text": "A cup of water for me, please."}, {"speaker": "lucy", "text": "We move to the end of the counter. A few minutes later, the clerk puts two cups in front of us. My lemonade makes a loud, icy rattle. I glance at Emma."}, {"speaker": "emma", "text": "You can just tell her. She probably has about ten orders in her head."}, {"speaker": "lucy", "text": "Sorry, I asked for no ice."}, {"speaker": "clerk", "text": "Oh, you're right. Thanks for letting me know. I'll make you another one."}, {"speaker": "lucy", "text": "Thank you. I was worried that saying something would feel awkward, but the clerk is already smiling at the next customer. Soon, my new drink is ready."}, {"speaker": "emma", "text": "Better?"}, {"speaker": "lucy", "text": "Much better. We sit by the window, and I take a sip. Now I only have one problem."}, {"speaker": "emma", "text": "What is it?"}, {"speaker": "lucy", "text": "I still want to know what strawberry lemonade tastes like."}, {"speaker": "emma", "text": "That sounds like a problem for another afternoon."}], "role_names": {}, "slug": "06_no_ice_please", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "e3ef3ad513c12806150b39b584f0277b8279c62ce94e3ac79efc6a1e669c9661", "speech": "Lucy／第一人称旁白: Little Moments. No Ice, Please. Emma and I stop at a little sandwich shop after school. It's warm outside, and we both want something to drink. The menu has about twenty choices. My brain wants all twenty.\n\n朋友 Emma: I'm getting water. You can study the menu, but I'm not waiting until tomorrow.\n\nLucy／第一人称旁白: Okay, decision made. Could I get a small lemonade?\n\n店员: Sure. Regular or strawberry?\n\nLucy／第一人称旁白: Regular, please. And no ice, please.\n\n店员: One small regular lemonade with no ice. Anything else?\n\n朋友 Emma: A cup of water for me, please.\n\nLucy／第一人称旁白: We move to the end of the counter. A few minutes later, the clerk puts two cups in front of us. My lemonade makes a loud, icy rattle. I glance at Emma.\n\n朋友 Emma: You can just tell her. She probably has about ten orders in her head.\n\nLucy／第一人称旁白: Sorry, I asked for no ice.\n\n店员: Oh, you're right. Thanks for letting me know. I'll make you another one.\n\nLucy／第一人称旁白: Thank you. I was worried that saying something would feel awkward, but the clerk is already smiling at the next customer. Soon, my new drink is ready.\n\n朋友 Emma: Better?\n\nLucy／第一人称旁白: Much better. We sit by the window, and I take a sip. Now I only have one problem.\n\n朋友 Emma: What is it?\n\nLucy／第一人称旁白: I still want to know what strawberry lemonade tastes like.\n\n朋友 Emma: That sounds like a problem for another afternoon.", "word_count": 218, "audio": "audio/06_no_ice_please.mp3", "subtitle": "subtitles/06_no_ice_please.srt", "transcript": "transcripts/06_no_ice_please.md", "duration_seconds": 81.576, "words_per_minute_including_pauses": 160.3}, {"id": 7, "title": "The Last Slice", "title_zh": "最后一块披萨", "category": "家庭日常", "summary_zh": "一块披萨引发争论，姐弟俩决定公平分配。", "focus": "表达想要、轮流、商量分配", "words": {"slice": "一块披萨", "fair": "公平的", "split": "分开"}, "phrases": ["Are you going to eat that?", "Let's split it.", "You cut, and I'll choose."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Last Slice. Movie night is about to start. There are blankets on the couch, drinks on the table, and exactly one slice of pizza left in the box. Ben and I notice it at the same time."}, {"speaker": "ben", "text": "Are you going to eat that?"}, {"speaker": "lucy", "text": "I was thinking about it. Were you?"}, {"speaker": "ben", "text": "I've been thinking about it for a very long time. Since the last slice I ate."}, {"speaker": "dad", "text": "Sounds serious. How are you two going to solve this?"}, {"speaker": "lucy", "text": "We could race for it. Dad raises one eyebrow. Okay, maybe not. Let's split it."}, {"speaker": "ben", "text": "But one side has more cheese. And one side has the big mushroom."}, {"speaker": "lucy", "text": "You don't even like mushrooms."}, {"speaker": "ben", "text": "I might start tonight."}, {"speaker": "dad", "text": "Here's an idea. One person cuts, and the other person chooses a piece."}, {"speaker": "lucy", "text": "You cut, and I'll choose. Ben studies the pizza like it's a very important map. Dad helps him use the pizza cutter, and we look at the two pieces."}, {"speaker": "ben", "text": "They're almost the same. Except this one has a tiny extra corner."}, {"speaker": "lucy", "text": "I choose the other piece. Ben looks surprised, then takes the corner with a smile. We sit down just as the movie starts."}, {"speaker": "dad", "text": "Everybody happy?"}, {"speaker": "ben", "text": "Very happy. Next time, though, could we order one more pizza?"}, {"speaker": "lucy", "text": "Dad laughs. I take a bite and discover the big mushroom on my piece. Apparently, Ben has decided not to start liking mushrooms tonight after all."}], "role_names": {}, "slug": "07_the_last_slice", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}}, "input_sha256": "97484f8dc96943ac19993f7da182f237ddbe041e21a278bdaf399c9fe6e49f0b", "speech": "Lucy／第一人称旁白: Little Moments. The Last Slice. Movie night is about to start. There are blankets on the couch, drinks on the table, and exactly one slice of pizza left in the box. Ben and I notice it at the same time.\n\n弟弟 Ben: Are you going to eat that?\n\nLucy／第一人称旁白: I was thinking about it. Were you?\n\n弟弟 Ben: I've been thinking about it for a very long time. Since the last slice I ate.\n\n爸爸: Sounds serious. How are you two going to solve this?\n\nLucy／第一人称旁白: We could race for it. Dad raises one eyebrow. Okay, maybe not. Let's split it.\n\n弟弟 Ben: But one side has more cheese. And one side has the big mushroom.\n\nLucy／第一人称旁白: You don't even like mushrooms.\n\n弟弟 Ben: I might start tonight.\n\n爸爸: Here's an idea. One person cuts, and the other person chooses a piece.\n\nLucy／第一人称旁白: You cut, and I'll choose. Ben studies the pizza like it's a very important map. Dad helps him use the pizza cutter, and we look at the two pieces.\n\n弟弟 Ben: They're almost the same. Except this one has a tiny extra corner.\n\nLucy／第一人称旁白: I choose the other piece. Ben looks surprised, then takes the corner with a smile. We sit down just as the movie starts.\n\n爸爸: Everybody happy?\n\n弟弟 Ben: Very happy. Next time, though, could we order one more pizza?\n\nLucy／第一人称旁白: Dad laughs. I take a bite and discover the big mushroom on my piece. Apparently, Ben has decided not to start liking mushrooms tonight after all.", "word_count": 232, "audio": "audio/07_the_last_slice.mp3", "subtitle": "subtitles/07_the_last_slice.srt", "transcript": "transcripts/07_the_last_slice.md", "duration_seconds": 85.752, "words_per_minute_including_pauses": 162.3}, {"id": 8, "title": "Wait, That's My Hoodie", "title_zh": "等等，那是我的卫衣", "category": "家庭日常", "summary_zh": "Lucy想穿的卫衣不见了，原来Ben把它当成了自己的新衣服。", "focus": "描述衣物、请求借用、约定归还", "words": {"hoodie": "连帽卫衣", "sleeve": "袖子", "borrow": "借用"}, "phrases": ["Can I borrow it?", "It looks a little big on you.", "Please ask me first next time."], "segments": [{"speaker": "lucy", "text": "Little Moments. Wait, That's My Hoodie. I'm getting ready to meet Emma when I notice something missing. My favorite green hoodie isn't on my chair. It isn't in my closet, either. Then a small green shape walks past my door."}, {"speaker": "ben", "text": "Morning. Nice weather, right?"}, {"speaker": "lucy", "text": "Wait, that's my hoodie. Ben stops. The sleeves cover both his hands, and the bottom reaches almost to his knees. It looks a little big on you."}, {"speaker": "ben", "text": "That's the style. Very comfortable. Lots of room for snacks."}, {"speaker": "lucy", "text": "I was going to wear it today. Did you take it from my chair?"}, {"speaker": "ben", "text": "Maybe. Can I borrow it?"}, {"speaker": "lucy", "text": "You're supposed to ask that before you put it on."}, {"speaker": "mom", "text": "Everything okay in here?"}, {"speaker": "lucy", "text": "We're having a small fashion discussion. I need my hoodie, and Ben seems to be living inside it."}, {"speaker": "ben", "text": "I like the big pocket. My own sweatshirt doesn't have one."}, {"speaker": "mom", "text": "Your blue jacket has two pockets. It's hanging by the door."}, {"speaker": "ben", "text": "Two pockets? That does change things."}, {"speaker": "lucy", "text": "He pulls off the hoodie and hands it back. I check the pocket and find a toy car, a clean tissue, and a tiny rubber duck. Please ask me first next time."}, {"speaker": "ben", "text": "Deal. Can I borrow it tomorrow?"}, {"speaker": "lucy", "text": "Maybe. Ask me tomorrow. For now, your duck needs a new apartment."}, {"speaker": "ben", "text": "The blue jacket has room. He can have his own pocket."}], "role_names": {}, "slug": "08_wait_that_s_my_hoodie", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "f49657b1730061dca6d0bfacf01ee155bb5061bfa08de81a2aeb7c649e6c8b36", "speech": "Lucy／第一人称旁白: Little Moments. Wait, That's My Hoodie. I'm getting ready to meet Emma when I notice something missing. My favorite green hoodie isn't on my chair. It isn't in my closet, either. Then a small green shape walks past my door.\n\n弟弟 Ben: Morning. Nice weather, right?\n\nLucy／第一人称旁白: Wait, that's my hoodie. Ben stops. The sleeves cover both his hands, and the bottom reaches almost to his knees. It looks a little big on you.\n\n弟弟 Ben: That's the style. Very comfortable. Lots of room for snacks.\n\nLucy／第一人称旁白: I was going to wear it today. Did you take it from my chair?\n\n弟弟 Ben: Maybe. Can I borrow it?\n\nLucy／第一人称旁白: You're supposed to ask that before you put it on.\n\n妈妈: Everything okay in here?\n\nLucy／第一人称旁白: We're having a small fashion discussion. I need my hoodie, and Ben seems to be living inside it.\n\n弟弟 Ben: I like the big pocket. My own sweatshirt doesn't have one.\n\n妈妈: Your blue jacket has two pockets. It's hanging by the door.\n\n弟弟 Ben: Two pockets? That does change things.\n\nLucy／第一人称旁白: He pulls off the hoodie and hands it back. I check the pocket and find a toy car, a clean tissue, and a tiny rubber duck. Please ask me first next time.\n\n弟弟 Ben: Deal. Can I borrow it tomorrow?\n\nLucy／第一人称旁白: Maybe. Ask me tomorrow. For now, your duck needs a new apartment.\n\n弟弟 Ben: The blue jacket has room. He can have his own pocket.", "word_count": 221, "audio": "audio/08_wait_that_s_my_hoodie.mp3", "subtitle": "subtitles/08_wait_that_s_my_hoodie.srt", "transcript": "transcripts/08_wait_that_s_my_hoodie.md", "duration_seconds": 85.152, "words_per_minute_including_pauses": 155.7}, {"id": 9, "title": "The Bus Going the Other Way", "title_zh": "公交车方向坐反了？", "category": "出行与办事", "summary_zh": "Lucy和爸爸在上车前发现站错方向，及时换到马路对面。", "focus": "问方向、确认站点、询问车程", "words": {"across the street": "在街道对面", "stop": "站点", "direction": "方向"}, "phrases": ["Does this bus go to the museum?", "You're on the wrong side of the street.", "How many stops is it?"], "segments": [{"speaker": "lucy", "text": "Little Moments. The Bus Going the Other Way. Dad and I are taking the bus to the museum. We find a stop with the right number and wait under the sign. I feel very proud of my excellent planning."}, {"speaker": "dad", "text": "Did you check which direction it's going?"}, {"speaker": "lucy", "text": "Same number, same bus. Isn't that enough? Dad points across the street. There's another stop with the same number. Before I can answer, a bus pulls up."}, {"speaker": "staff", "text": "Morning. Where are you headed?"}, {"speaker": "lucy", "text": "Does this bus go to the museum?"}, {"speaker": "staff", "text": "It does on the way back, but you're on the wrong side of the street. You want the stop across from this one."}, {"speaker": "dad", "text": "Thanks for checking. We'll cross at the lights."}, {"speaker": "lucy", "text": "We wait for the crossing signal and walk to the other stop. The little route map shows the museum four stops away. My excellent planning needs a small update."}, {"speaker": "dad", "text": "Good thing we asked before we sat down."}, {"speaker": "lucy", "text": "When the next bus arrives, I ask the driver again. This time, she says yes. How many stops is it?"}, {"speaker": "clerk", "text": "Four from here. I'll call out the museum stop, too."}, {"speaker": "lucy", "text": "Thank you. We sit near the middle, and I watch the names appear on the screen."}, {"speaker": "dad", "text": "Still our chief trip planner?"}, {"speaker": "lucy", "text": "Absolutely. I've just added a new rule to my system. Check the number, check the direction, and don't act like a genius until you're on the right bus."}], "role_names": {"staff": "去程方向司机", "clerk": "返程方向司机"}, "slug": "09_the_bus_going_the_other_way", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "staff": {"name": "老师／男性服务人员（按每集角色表）", "voice": "en-US-ChristopherNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "97ce31f4befad5055704b4c3ec70e808811feb2a2ca466f3205e9645e5adfd3d", "speech": "Lucy／第一人称旁白: Little Moments. The Bus Going the Other Way. Dad and I are taking the bus to the museum. We find a stop with the right number and wait under the sign. I feel very proud of my excellent planning.\n\n爸爸: Did you check which direction it's going?\n\nLucy／第一人称旁白: Same number, same bus. Isn't that enough? Dad points across the street. There's another stop with the same number. Before I can answer, a bus pulls up.\n\n去程方向司机: Morning. Where are you headed?\n\nLucy／第一人称旁白: Does this bus go to the museum?\n\n去程方向司机: It does on the way back, but you're on the wrong side of the street. You want the stop across from this one.\n\n爸爸: Thanks for checking. We'll cross at the lights.\n\nLucy／第一人称旁白: We wait for the crossing signal and walk to the other stop. The little route map shows the museum four stops away. My excellent planning needs a small update.\n\n爸爸: Good thing we asked before we sat down.\n\nLucy／第一人称旁白: When the next bus arrives, I ask the driver again. This time, she says yes. How many stops is it?\n\n返程方向司机: Four from here. I'll call out the museum stop, too.\n\nLucy／第一人称旁白: Thank you. We sit near the middle, and I watch the names appear on the screen.\n\n爸爸: Still our chief trip planner?\n\nLucy／第一人称旁白: Absolutely. I've just added a new rule to my system. Check the number, check the direction, and don't act like a genius until you're on the right bus.", "word_count": 232, "audio": "audio/09_the_bus_going_the_other_way.mp3", "subtitle": "subtitles/09_the_bus_going_the_other_way.srt", "transcript": "transcripts/09_the_bus_going_the_other_way.md", "duration_seconds": 79.176, "words_per_minute_including_pauses": 175.8}, {"id": 10, "title": "The Almost-Perfect Picnic", "title_zh": "差一点完美的野餐", "category": "周末与朋友", "summary_zh": "野餐快开始时才发现没带餐具，朋友们一起想办法。", "focus": "检查准备、说明遗漏、调整计划", "words": {"picnic": "野餐", "fork": "叉子", "spread out": "铺开"}, "phrases": ["Did anyone bring forks?", "I thought you had them.", "We can still make this work."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Almost-Perfect Picnic. Emma and I spread out a blanket in the park. Mom sets down the cooler, and Ben arrives carrying a bag of chips like it's a precious treasure. The weather is perfect. The food looks great. Then I open the pasta salad."}, {"speaker": "emma", "text": "Did anyone bring forks?"}, {"speaker": "lucy", "text": "I thought you had them."}, {"speaker": "emma", "text": "I brought plates. You said you were bringing the other stuff."}, {"speaker": "ben", "text": "I brought chips. I did my job beautifully."}, {"speaker": "mom", "text": "Let's see what we have before we go anywhere. Sandwiches, fruit, crackers, and that pasta salad."}, {"speaker": "lucy", "text": "We can still make this work. We eat the sandwiches first. Emma passes around the fruit, and Ben opens his very important bag of chips. Nobody seems unhappy."}, {"speaker": "emma", "text": "The pasta can come home with us. It'll be an excellent second picnic on the kitchen table."}, {"speaker": "mom", "text": "Good plan. I'll keep it cold in the cooler until we get home."}, {"speaker": "lucy", "text": "We watch a tiny dog trying to carry a stick twice its size. Ben puts a cracker next to his sandwich and says he's building a food castle."}, {"speaker": "emma", "text": "Next time, let's make one list and put our names beside the things we're bringing."}, {"speaker": "ben", "text": "Put me down for chips again. I'm experienced now."}, {"speaker": "lucy", "text": "On the way home, I add forks to our next picnic list. Then I add a second line underneath: Check that someone actually packed the forks. That feels like an important detail."}], "role_names": {}, "slug": "10_the_almost_perfect_picnic", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "d6aba7c3ef214cbb2ebfb38e4121c24adfdd307ce3d31362f18a9a6fb739cd8f", "speech": "Lucy／第一人称旁白: Little Moments. The Almost-Perfect Picnic. Emma and I spread out a blanket in the park. Mom sets down the cooler, and Ben arrives carrying a bag  It's warm, fluffy, and much taller than it looked in the dryer. Can you help me fold these, Ben?"}, {"speaker": "ben", "text": "Only if I can be in charge of socks. I'm very good at socks."}, {"speaker": "lucy", "text": "Five minutes later, he hands me a red sock and a striped sock. These two don't match."}, {"speaker": "ben", "text": "They both fit on feet. That's something."}, {"speaker": "mom", "text": "There should be another red one somewhere. Check the bigger clothes before we blame the washing machine."}, {"speaker": "lucy", "text": "We shake out a towel. Nothing. We check a pillowcase. Still nothing. Ben holds up Dad's sweatshirt and makes it dance."}, {"speaker": "ben", "text": "Maybe the sock moved away. Maybe it wanted a bigger closet."}, {"speaker": "lucy", "text": "Wait. There's a little lump in that sleeve. Turn it inside out."}, {"speaker": "ben", "text": "Aha! One red sock, hiding from its responsibilities."}, {"speaker": "lucy", "text": "We put the pair together and finish the basket. I fold shirts while Ben matches the rest of the socks. This time, he checks the colors and patterns."}, {"speaker": "mom", "text": "Nice work. You two make a good team."}, {"speaker": "ben", "text": "Do good teams get a snack break?"}, {"speaker": "lucy", "text": "Mom points toward the kitchen. Ben races off, then comes back holding one striped sock."}, {"speaker": "ben", "text": "Small problem. This one is alone now."}, {"speaker": "lucy", "text": "I look at the empty basket. The mystery is not over. Our snack break, however, is absolutely still happening."}], "role_names": {}, "slug": "11_the_red_sock_mystery", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "8b1d90888b2b838592e26ded806d073a02f25f751ecf6ab2679f9b85ef967
