segments": [{"speaker": "lucy", "text": "Little Moments. Can I Try Another Size? Dad takes me shopping for new sneakers because my old ones are getting tight. At the store, I find a purple pair with bright yellow laces. They're exactly the colors I wanted."}, {"speaker": "clerk", "text": "What size do you usually wear?"}, {"speaker": "lucy", "text": "A six, I think. The clerk brings a box, and I sit down to try them on. They look amazing. My toes do not seem as excited as I am."}, {"speaker": "dad", "text": "How do they feel?"}, {"speaker": "lucy", "text": "These feel a little tight. Maybe they'll be okay if I don't move much."}, {"speaker": "dad", "text": "That could be a problem for shoes."}, {"speaker": "clerk", "text": "We can try half a size up. You should be able to walk comfortably."}, {"speaker": "lucy", "text": "Can I try another size? The clerk brings the bigger pair, and I put both shoes on this time."}, {"speaker": "clerk", "text": "Take a few steps. See if your heel stays in place and your toes have room."}, {"speaker": "lucy", "text": "I walk toward the mirror and back. Much better. I can actually imagine running for the bus in these."}, {"speaker": "dad", "text": "Hopefully, we'll leave early enough that you won't need to."}, {"speaker": "lucy", "text": "At the counter, the clerk asks if I want to wear them out of the store. I say yes and put my old shoes in the box."}, {"speaker": "dad", "text": "Ready?"}, {"speaker": "lucy", "text": "More than ready. I take one big, comfortable step. The yellow laces bounce. My toes and I have finally agreed on something."}], "role_names": {}, "slug": "12_can_i_try_another_size", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "949bb60e1ee4d79eeac95688c5a2ac9b7a9784ec2b5b6f81b84bc68d9732496a", "speech": "Lucy／第一人称旁白: Little Moments. Can I Try Another Size? Dad takes me shopping for new sneakers because my old ones are getting tight. At the store, I find a purple pair with bright yellow laces. They're exactly the colors I wanted.\n\n店员: What size do you usually wear?\n\nLucy／第一人称旁白: A six, I think. The clerk brings a box, and I sit down to try them on. They look amazing. My toes do not seem as excited as I am.\n\n爸爸: How do they feel?\n\nLucy／第一人称旁白: These feel a little tight. Maybe they'll be okay if I don't move much.\n\n爸爸: That could be a problem for shoes.\n\n店员: We can try half a size up. You should be able to walk comfortably.\n\nLucy／第一人称旁白: Can I try another size? The clerk brings the bigger pair, and I put both shoes on this time.\n\n店员: Take a few steps. See if your heel stays in place and your toes have room.\n\nLucy／第一人称旁白: I walk toward the mirror and back. Much better. I can actually imagine running for the bus in these.\n\n爸爸: Hopefully, we'll leave early enough that you won't need to.\n\nLucy／第一人称旁白: At the counter, the clerk asks if I want to wear them out of the store. I say yes and put my old shoes in the box.\n\n爸爸: Ready?\n\nLucy／第一人称旁白: More than ready. I take one big, comfortable step. The yellow laces bounce. My toes and I have finally agreed on something.", "word_count": 228, "audio": "audio/12_can_i_try_another_size.mp3", "subtitle": "subtitles/12_can_i_try_another_size.srt", "transcript": "transcripts/12_can_i_try_another_size.md", "duration_seconds": 76.584, "words_per_minute_including_pauses": 178.6}, {"id": 13, "title": "You Got My Name Almost Right", "title_zh": "名字差一点就对了", "category": "吃饭与购物", "summary_zh": "取餐单把Lucy写成了Lucky，引出轻松的小对话。", "focus": "报名字、拼写、确认订单", "words": {"spell": "拼写", "order": "订单", "pickup": "取餐"}, "phrases": ["Could you spell that for me?", "I think that's my order.", "Close enough."], "segments": [{"speaker": "lucy", "text": "Little Moments. You Got My Name Almost Right. Emma and I order sandwiches at a busy cafe. The person at the register asks for my name, but the coffee machine starts making a loud noise just as I answer."}, {"speaker": "clerk", "text": "Sorry, what was that?"}, {"speaker": "lucy", "text": "Lucy."}, {"speaker": "clerk", "text": "Got it. Two sandwiches. We'll call you when they're ready."}, {"speaker": "lucy", "text": "We find a table near the pickup counter. Emma takes off her jacket, and I watch people walk past the window. A minute later, someone calls out a name I don't recognize."}, {"speaker": "clerk", "text": "Lucky! Order for Lucky!"}, {"speaker": "emma", "text": "Are we lucky today? Because those look a lot like our sandwiches."}, {"speaker": "lucy", "text": "I walk over and check the bag. One cheese sandwich, one turkey sandwich. I think that's my order."}, {"speaker": "clerk", "text": "Lucky?"}, {"speaker": "lucy", "text": "Lucy, actually. Close enough."}, {"speaker": "clerk", "text": "Oh, sorry about that. Could you spell that for me?"}, {"speaker": "lucy", "text": "L, U, C, Y. The clerk corrects the name on the receipt and gives me the bag. I thank her and bring lunch to our table."}, {"speaker": "emma", "text": "Congratulations on your new name. Does it come with extra cookies?"}, {"speaker": "lucy", "text": "Apparently not. I check the bag just in case. Only sandwiches and napkins. But my sandwich has an especially big slice of cheese, so maybe I am lucky."}, {"speaker": "emma", "text": "Next time, I'll order under my name."}, {"speaker": "lucy", "text": "Good idea. Let's see if you become Emily, Emma, or Excellent. I think Excellent would suit you for at least one lunch."}], "role_names": {}, "slug": "13_you_got_my_name_almost_right", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "f69b961fa924216783f4597f6e902725b192cc593b764e33f9b820d066b163db", "speech": "Lucy／第一人称旁白: Little Moments. You Got My Name Almost Right. Emma and I order sandwiches at a busy cafe. The person at the register asks for my name, but the coffee machine starts making a loud noise just as I answer.\n\n店员: Sorry, what was that?\n\nLucy／第一人称旁白: Lucy.\n\n店员: Got it. Two sandwiches. We'll call you when they're ready.\n\nLucy／第一人称旁白: We find a table near the pickup counter. Emma takes off her jacket, and I watch people walk past the window. A minute later, someone calls out a name I don't recognize.\n\n店员: Lucky! Order for Lucky!\n\n朋友 Emma: Are we lucky today? Because those look a lot like our sandwiches.\n\nLucy／第一人称旁白: I walk over and check the bag. One cheese sandwich, one turkey sandwich. I think that's my order.\n\n店员: Lucky?\n\nLucy／第一人称旁白: Lucy, actually. Close enough.\n\n店员: Oh, sorry about that. Could you spell that for me?\n\nLucy／第一人称旁白: L, U, C, Y. The clerk corrects the name on the receipt and gives me the bag. I thank her and bring lunch to our table.\n\n朋友 Emma: Congratulations on your new name. Does it come with extra cookies?\n\nLucy／第一人称旁白: Apparently not. I check the bag just in case. Only sandwiches and napkins. But my sandwich has an especially big slice of cheese, so maybe I am lucky.\n\n朋友 Emma: Next time, I'll order under my name.\n\nLucy／第一人称旁白: Good idea. Let's see if you become Emily, Emma, or Excellent. I think Excellent would suit you for at least one lunch.", "word_count": 229, "audio": "audio/13_you_got_my_name_almost_right.mp3", "subtitle": "subtitles/13_you_got_my_name_almost_right.srt", "transcript": "transcripts/13_you_got_my_name_almost_right.md", "duration_seconds": 86.064, "words_per_minute_including_pauses": 159.6}, {"id": 14, "title": "The Homework Help Call", "title_zh": "一起弄懂作业要求", "category": "校园生活", "summary_zh": "Lucy和Emma通话核对作业，发现自己看错了页码。", "focus": "请求解释、澄清要求、核对信息", "words": {"instructions": "说明", "page": "页码", "explain": "解释"}, "phrases": ["Could you explain that again?", "Which page are you on?", "That makes more sense."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Homework Help Call. I'm staring at my notebook when Emma calls. She's already finished our English assignment. I have written exactly one word, and that word is my name."}, {"speaker": "emma", "text": "How's it going?"}, {"speaker": "lucy", "text": "Slowly. I don't understand why we need to write about a jungle. Our class was talking about neighborhoods today."}, {"speaker": "emma", "text": "A jungle? Which page are you on?"}, {"speaker": "lucy", "text": "Thirty-eight. The instructions say to describe an adventure. I was about to put a tiger next to the grocery store."}, {"speaker": "emma", "text": "We're on page eighty-three. Describe your neighborhood, then add one place you'd like to have nearby."}, {"speaker": "lucy", "text": "I turn the pages. There it is. That makes more sense. Could you explain that again? Just the part about the new place."}, {"speaker": "emma", "text": "Write about a real place first. Then imagine something useful or fun, like a swimming pool or a bigger park. The rest is your choice."}, {"speaker": "lucy", "text": "Thanks. What did you pick?"}, {"speaker": "emma", "text": "A library with comfortable reading chairs. But you should choose something you actually want."}, {"speaker": "lucy", "text": "I look out my window at the empty lot down the street. I would love a little basketball court there. I start writing before the idea disappears."}, {"speaker": "emma", "text": "All set now?"}, {"speaker": "lucy", "text": "I think so. No more jungle."}, {"speaker": "emma", "text": "You can save the tiger for another assignment."}, {"speaker": "lucy", "text": "I write the page number at the top of my notebook. Eighty-three. I check it twice. My neighborhood already feels much safer without that tiger beside the vegetables."}], "role_names": {}, "slug": "14_the_homework_help_call", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "7e980fae74dff16f58334e7c6e7e1ba1edd4db18a5dfcdb62f815c5fd1f2c93d", "speech": "Lucy／第一人称旁白: Little Moments. The Homework Help Call. I'm staring at my notebook when Emma calls. She's already finished our English assignment. I have written exactly one word, and that word is my name.\n\n朋友 Emma: How's it going?\n\nLucy／第一人称旁白: Slowly. I don't understand why we need to write about a jungle. Our class was talking about neighborhoods today.\n\n朋友 Emma: A jungle? Which page are you on?\n\nLucy／第一人称旁白: Thirty-eight. The instructions say to describe an adventure. I was about to put a tiger next to the grocery store.\n\n朋友 Emma: We're on page eighty-three. Describe your neighborhood, then add one place you'd like to have nearby.\n\nLucy／第一人称旁白: I turn the pages. There it is. That makes more sense. Could you explain that again? Just the part about the new place.\n\n朋友 Emma: Write about a real place first. Then imagine something useful or fun, like a swimming pool or a bigger park. The rest is your choice.\n\nLucy／第一人称旁白: Thanks. What did you pick?\n\n朋友 Emma: A library with comfortable reading chairs. But you should choose something you actually want.\n\nLucy／第一人称旁白: I look out my window at the empty lot down the street. I would love a little basketball court there. I start writing before the idea disappears.\n\n朋友 Emma: All set now?\n\nLucy／第一人称旁白: I think so. No more jungle.\n\n朋友 Emma: You can save the tiger for another assignment.\n\nLucy／第一人称旁白: I write the page number at the top of my notebook. Eighty-three. I check it twice. My neighborhood already feels much safer without that tiger beside the vegetables.", "word_count": 239, "audio": "audio/14_the_homework_help_call.mp3", "subtitle": "subtitles/14_the_homework_help_call.srt", "transcript": "transcripts/14_the_homework_help_call.md", "duration_seconds": 84.216, "words_per_minute_including_pauses": 170.3}, {"id": 15, "title": "Who Turned Off the Wi-Fi?", "title_zh": "家里的网络掉线了", "category": "家庭日常", "summary_zh": "视频突然停住，一家人一起找出简单原因。", "focus": "描述问题、确认连接、请求等待", "words": {"frozen": "画面卡住的", "plug": "插头", "connection": "连接"}, "phrases": ["The screen is frozen.", "Is it working for you?", "Give it a minute."], "segments": [{"speaker": "lucy", "text": "Little Moments. Who Turned Off the Wi-Fi? Emma and I are on a video call, planning our class poster. She holds up a sketch, opens her mouth, and turns into a statue. The screen is frozen. Emma? Can you hear me?"}, {"speaker": "ben", "text": "If she's doing a robot impression, it's really good."}, {"speaker": "lucy", "text": "My phone says there's no connection. Is it working for you? Ben checks his tablet and shakes his head. We call Dad, who is putting away the vacuum cleaner."}, {"speaker": "dad", "text": "Let me have a look. Did it stop just now?"}, {"speaker": "lucy", "text": "About a minute ago. Dad follows the cable from the router to the wall. The plug is hanging loose beside the outlet."}, {"speaker": "dad", "text": "That would explain it. I must have unplugged it when I moved the vacuum. My mistake."}, {"speaker": "ben", "text": "So the internet wasn't broken. It was just taking a nap."}, {"speaker": "dad", "text": "Something like that. I'll plug it back in. Give it a minute."}, {"speaker": "lucy", "text": "We wait while the little lights come back on. I open our call again, and Emma finally starts moving."}, {"speaker": "emma", "text": "There you are! Did you see my drawing?"}, {"speaker": "lucy", "text": "Only the first half. You looked very serious for a while."}, {"speaker": "emma", "text": "That's my thinking face."}, {"speaker": "lucy", "text": "We finish planning on paper, then take photos to share. Dad promises to check the plugs next time he cleans. Ben promises to tell everyone he personally watched the internet wake up. Somehow, that becomes the biggest news of the afternoon."}], "role_names": {}, "slug": "15_who_turned_off_the_wi_fi", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "2461ba45663ff36a509b5c692457f8f070957948d4dd9e82d005ec967a43749d", "speech": "Lucy／第一人称旁白: Little Moments. Who Turned Off the Wi-Fi? Emma and I are on a video call, planning our class poster. She holds up a sketch, opens her mouth, and turns into a statue. The screen is frozen. Emma? Can you hear me?\n\n弟弟 Ben: If she's doing a robot impression, it's really good.\n\nLucy／第一人称旁白: My phone says there's no connection. Is it working for you? Ben checks his tablet and shakes his head. We call Dad, who is putting away the vacuum cleaner.\n\n爸爸: Let me have a look. Did it stop just now?\n\nLucy／第一人称旁白: About a minute ago. Dad follows the cable from the router to the wall. The plug is hanging loose beside the outlet.\n\n爸爸: That would explain it. I must have unplugged it when I moved the vacuum. My mistake.\n\n弟弟 Ben: So the internet wasn't broken. It was just taking a nap.\n\n爸爸: Something like that. I'll plug it back in. Give it a minute.\n\nLucy／第一人称旁白: We wait while the little lights come back on. I open our call again, and Emma finally starts moving.\n\n朋友 Emma: There you are! Did you see my drawing?\n\nLucy／第一人称旁白: Only the first half. You looked very serious for a while.\n\n朋友 Emma: That's my thinking face.\n\nLucy／第一人称旁白: We finish planning on paper, then take photos to share. Dad promises to check the plugs next time he cleans. Ben promises to tell everyone he personally watched the internet wake up. Somehow, that becomes the biggest news of the afternoon.", "word_count": 234, "audio": "audio/15_who_turned_off_the_wi_fi.mp3", "subtitle": "subtitles/15_who_turned_off_the_wi_fi.srt", "transcript": "transcripts/15_who_turned_off_the_wi_fi.md", "duration_seconds": 83.04, "words_per_minute_including_pauses": 169.1}, {"id": 16, "title": "Two Tickets, Please", "title_zh": "买两张电影票", "category": "周末与朋友", "summary_zh": "选座、买票和找影厅，Lucy第一次认真参与安排。", "focus": "选择座位、确认时间、询问位置", "words": {"ticket": "票", "row": "排", "middle": "中间"}, "phrases": ["Two tickets, please.", "Are there seats near the middle?", "Which way is theater three?"], "segments": [{"speaker": "lucy", "text": "Little Moments. Two Tickets, Please. Dad and I arrive at the movie theater twenty minutes early. I have one job today: help choose the seats. Dad says this is more important than choosing the popcorn. I am not completely convinced."}, {"speaker": "clerk", "text": "Hi there. What would you like to see?"}, {"speaker": "lucy", "text": "The animated movie at two thirty. Two tickets, please."}, {"speaker": "clerk", "text": "Sure. Here's the seating chart. The gray seats are taken, and the blue ones are available."}, {"speaker": "lucy", "text": "Are there seats near the middle?"}, {"speaker": "clerk", "text": "Row six has two together. Or you can sit closer to the front in row three."}, {"speaker": "dad", "text": "Row six sounds good to me. What do you think?"}, {"speaker": "lucy", "text": "Perfect. I don't want to spend the whole movie looking straight up. We get our tickets and move away from the counter. Then I realize I forgot to ask one thing. Which way is theater three?"}, {"speaker": "clerk", "text": "Down the hall on your left, just past the restrooms."}, {"speaker": "lucy", "text": "Thanks. We find our seats with plenty of time. I check the numbers twice before we sit down."}, {"speaker": "dad", "text": "Excellent planning. Now, about that popcorn."}, {"speaker": "lucy", "text": "I knew it was important. We share a small bag and watch the screen fill with trailers. Before the movie starts, Dad silences his phone, and I do the same."}, {"speaker": "dad", "text": "Ready for the adventure?"}, {"speaker": "lucy", "text": "Yes. Middle seats, snacks, and no neck pain. I think my first day as the family seat expert is going pretty well."}], "role_names": {}, "slug": "16_two_tickets_please", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "75b75981d2c7495b814421851afad398038d42bd444ab8a5d8d50330f53b887c", "speech": "Lucy／第一人称旁白: Little Moments. Two Tickets, Please. Dad and I arrive at the movie theater twenty minutes early. I have one job today: help choose the seats. Dad says this is more important than choosing the popcorn. I am not completely convinced.\n\n店员: Hi there. What would you like to see?\n\nLucy／第一人称旁白: The animated movie at two thirty. Two tickets, please.\n\n店员: Sure. Here's the seating chart. The gray seats are taken, and the blue ones are available.\n\nLucy／第一人称旁白: Are there seats near the middle?\n\n店员: Row six has two together. Or you can sit closer to the front in row three.\n\n爸爸: Row six sounds good to me. What do you think?\n\nLucy／第一人称旁白: Perfect. I don't want to spend the whole movie looking straight up. We get our tickets and move away from the counter. Then I realize I forgot to ask one thing. Which way is theater three?\n\n店员: Down the hall on your left, just past the restrooms.\n\nLucy／第一人称旁白: Thanks. We find our seats with plenty of time. I check the numbers twice before we sit down.\n\n爸爸: Excellent planning. Now, about that popcorn.\n\nLucy／第一人称旁白: I knew it was important. We share a small bag and watch the screen fill with trailers. Before the movie starts, Dad silences his phone, and I do the same.\n\n爸爸: Ready for the adventure?\n\nLucy／第一人称旁白: Yes. Middle seats, snacks, and no neck pain. I think my first day as the family seat expert is going pretty well.", "word_count": 231, "audio": "audio/16_two_tickets_please.mp3", "subtitle": "subtitles/16_two_tickets_please.srt", "transcript": "transcripts/16_two_tickets_please.md", "duration_seconds": 85.224, "words_per_minute_including_pauses": 162.6}, {"id": 17, "title": "The Tiny Birthday Secret", "title_zh": "小小的生日秘密", "category": "周末与朋友", "summary_zh": "Lucy和Emma准备惊喜卡片，Ben努力保守秘密。", "focus": "邀请帮忙、约定时间、保守惊喜", "words": {"surprise": "惊喜", "card": "卡片", "secret": "秘密"}, "phrases": ["Don't tell her yet.", "What time should I come over?", "I'll keep it a secret."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Tiny Birthday Secret. Mom's birthday is tomorrow. Emma has offered to help me make a big card, and Ben has offered to help by asking a lot of questions. I call Emma after dinner."}, {"speaker": "emma", "text": "What time should I come over?"}, {"speaker": "lucy", "text": "Ten tomorrow morning. Dad's taking Mom out for breakfast. We'll have about an hour to finish the card and set the table."}, {"speaker": "ben", "text": "Are we having cake? Is the cake a secret? Can I taste the secret?"}, {"speaker": "lucy", "text": "Everything is a secret until Mom gets home. Don't tell her yet."}, {"speaker": "ben", "text": "I'll keep it a secret. I am excellent at not talking."}, {"speaker": "lucy", "text": "He proves this by talking for another five minutes. The next morning, Emma arrives with colored paper and stickers. We write little messages inside the card. Mine says thank you for helping me even when I'm grumpy."}, {"speaker": "emma", "text": "That's a good message. Mine says happy birthday to the best pancake maker I know."}, {"speaker": "ben", "text": "Mine says I love you more than cake. Is that believable?"}, {"speaker": "lucy", "text": "Very generous of you. We hear the front door, so we hide the card behind our backs. Mom walks into the kitchen and stops."}, {"speaker": "mom", "text": "Why is everybody standing so strangely?"}, {"speaker": "ben", "text": "No reason. Definitely not because of a giant card."}, {"speaker": "lucy", "text": "We all laugh and hold it up. Surprise! Mom reads every message slowly. Then she hugs us, including our terrible little secret keeper. The card is slightly crooked, but her smile is perfect."}], "role_names": {}, "slug": "17_the_tiny_birthday_secret", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "1ce84d6c6285457ca3d2e429fbafe59967de4951820dd792fb9e3c348dbee760", "speech": "Lucy／第一人称旁白: Little Moments. The Tiny Birthday Secret. Mom's birthday is tomorrow. Emma has offered to help me make a big card, and Ben has offered to help by asking a lot of questions. I call Emma after dinner.\n\n朋友 Emma: What time should I come over?\n\nLucy／第一人称旁白: Ten tomorrow morning. Dad's taking Mom out for breakfast. We'll have about an hour to finish the card and set the table.\n\n弟弟 Ben: Are we having cake? Is the cake a secret? Can I taste the secret?\n\nLucy／第一人称旁白: Everything is a secret until Mom gets home. Don't tell her yet.\n\n弟弟 Ben: I'll keep it a secret. I am excellent at not talking.\n\nLucy／第一人称旁白: He proves this by talking for another five minutes. The next morning, Emma arrives with colored paper and stickers. We write little messages inside the card. Mine says thank you for helping me even when I'm grumpy.\n\n朋友 Emma: That's a good message. Mine says happy birthday to the best pancake maker I know.\n\n弟弟 Ben: Mine says I love you more than cake. Is that believable?\n\nLucy／第一人称旁白: Very generous of you. We hear the front door, so we hide the card behind our backs. Mom walks into the kitchen and stops.\n\n妈妈: Why is everybody standing so strangely?\n\n弟弟 Ben: No reason. Definitely not because of a giant card.\n\nLucy／第一人称旁白: We all laugh and hold it up. Surprise! Mom reads every message slowly. Then she hugs us, including our terrible little secret keeper. The card is slightly crooked, but her smile is perfect.", "word_count": 237, "audio": "audio/17_the_tiny_birthday_secret.mp3", "subtitle": "subtitles/17_the_tiny_birthday_secret.srt", "transcript": "transcripts/17_the_tiny_birthday_secret.md", "duration_seconds": 84.528, "words_per_minute_including_pauses": 168.2}, {"id": 18, "title": "The Group Project Problem", "title_zh": "小组作业怎么分工", "category": "校园生活", "summary_zh": "海报作业快到期限，两个朋友重新商量分工。", "focus": "分配任务、说明进度、提出帮助", "words": {"project": "项目作业", "outline": "提纲", "deadline": "截止时间"}, "phrases": ["What have we finished so far?", "Could you handle the pictures?", "Let's make a simple plan."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Group Project Problem. Emma and I are making a poster about our neighborhood. Yesterday, we both thought the other person was bringing the pictures. Today, we have a beautiful blank sheet of paper."}, {"speaker": "emma", "text": "What have we finished so far?"}, {"speaker": "lucy", "text": "The title. And I brought a very nice marker."}, {"speaker": "emma", "text": "Great. At this speed, we'll finish by the time we're eighty."}, {"speaker": "lucy", "text": "Let's make a simple plan. I open my notebook and draw two columns. We need pictures, short descriptions, a map, and a little time to put everything together."}, {"speaker": "emma", "text": "I can draw the map. I actually like drawing maps. Could you handle the pictures?"}, {"speaker": "lucy", "text": "Sure. I've already taken photos of the park and the library. I can print them tonight. We each choose two places to write about, then agree to bring everything tomorrow."}, {"speaker": "staff", "text": "How's the project going over here?"}, {"speaker": "emma", "text": "Much better now. We finally gave the jobs to actual people instead of hoping they would do themselves."}, {"speaker": "staff", "text": "That's usually helpful. Leave time to check the whole poster before you hand it in."}, {"speaker": "lucy", "text": "The next day, Emma brings the map, and I bring the pictures. We lay everything out before we start gluing. One picture is upside down, and one street has an extra letter. We fix both."}, {"speaker": "emma", "text": "Look at that. A real poster."}, {"speaker": "lucy", "text": "And we're nowhere near eighty. I put a check beside every job on our list. Even the nice marker finally gets something useful to do."}], "role_names": {"staff": "老师"}, "slug": "18_the_group_project_problem", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}, "staff": {"name": "老师／男性服务人员（按每集角色表）", "voice": "en-US-ChristopherNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "cbccbf409aa61589b48bc86203bbe2fc15e8ebd141ba6280feb921267d18a031", "speech": "Lucy／第一人称旁白: Little Moments. The Group Project Problem. Emma and I are making a poster about our neighborhood. Yesterday, we both thought the other person was bringing the pictures. Today, we have a beautiful blank sheet of paper.\n\n朋友 Emma: What have we finished so far?\n\nLucy／第一人称旁白: The title. And I brought a very nice marker.\n\n朋友 Emma: Great. At this speed, we'll finish by the time we're eighty.\n\nLucy／第一人称旁白: Let's make a simple plan. I open my notebook and draw two columns. We need pictures, short descriptions, a map, and a little time to put everything together.\n\n朋友 Emma: I can draw the map. I actually like drawing maps. Could you handle the pictures?\n\nLucy／第一人称旁白: Sure. I've already taken photos of the park and the library. I can print them tonight. We each choose two places to write about, then agree to bring everything tomorrow.\n\n老师: How's the project going over here?\n\n朋友 Emma: Much better now. We finally gave the jobs to actual people instead of hoping they would do themselves.\n\n老师: That's usually helpful. Leave time to check the whole poster before you hand it in.\n\nLucy／第一人称旁白: The next day, Emma brings the map, and I bring the pictures. We lay everything out before we start gluing. One picture is upside down, and one street has an extra letter. We fix both.\n\n朋友 Emma: Look at that. A real poster.\n\nLucy／第一人称旁白: And we're nowhere near eighty. I put a check beside every job on our list. Even the nice marker finally gets something useful to do.", "word_count": 240, "audio": "audio/18_the_group_project_problem.mp3", "subtitle": "subtitles/18_the_group_project_problem.srt", "transcript": "transcripts/18_the_group_project_problem.md", "duration_seconds": 81.768, "words_per_minute_including_pauses": 176.1}, {"id": 19, "title": "A Table by the Window", "title_zh": "想坐窗边的位置", "category": "吃饭与购物", "summary_zh": "餐厅没有空窗边桌，Lucy学会在等待和先入座之间选择。", "focus": "询问等位、表达偏好、确认人数", "words": {"table": "餐桌", "available": "可用的", "wait": "等待"}, "phrases": ["A table for three, please.", "How long is the wait?", "This table is fine."], "segments": [{"speaker": "lucy", "text": "Little Moments. A Table by the Window. Mom, Ben, and I stop at a diner for lunch. I spot a table by the window with sunlight falling across it. Unfortunately, another family spots it about three seconds before I do."}, {"speaker": "mom", "text": "A table for three, please."}, {"speaker": "clerk", "text": "Of course. We have a booth available near the back."}, {"speaker": "lucy", "text": "Could we sit by the window instead?"}, {"speaker": "clerk", "text": "You can, but those tables are all taken right now."}, {"speaker": "mom", "text": "How long is the wait?"}, {"speaker": "clerk", "text": "Probably fifteen or twenty minutes. I can't promise an exact time."}, {"speaker": "ben", "text": "My stomach says that is a very long time."}, {"speaker": "lucy", "text": "I look at the booth near the back. It has soft seats and a tiny picture of a dog wearing sunglasses above it. Actually, this table is fine."}, {"speaker": "clerk", "text": "Right this way. Here are your menus. I'll give you a few minutes."}, {"speaker": "lucy", "text": "We slide into the booth. Ben immediately points at the dog picture and decides it's the owner of the restaurant."}, {"speaker": "mom", "text": "A dog who runs a diner? That's a busy dog."}, {"speaker": "ben", "text": "He probably checks all the hamburgers personally."}, {"speaker": "lucy", "text": "We order lunch and share a glass bottle of ketchup. By the time our food arrives, I have completely forgotten about the window. The booth is comfortable, Ben is telling dog stories, and Mom looks relaxed."}, {"speaker": "mom", "text": "Still wish we had waited?"}, {"speaker": "lucy", "text": "Not at all. This table comes with entertainment. I point to Ben. Unfortunately, there doesn't seem to be an off switch."}], "role_names": {}, "slug": "19_a_table_by_the_window", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "8137ccdeafcfc55ee78881ac37ae9d72b028a82033157ccda0f7e702f721a87a", "speech": "Lucy／第一人称旁白: Little Moments. A Table by the Window. Mom, Ben, and I stop at a diner for lunch. I spot a table by the window with sunlight falling across it. Unfortunately, another family spots it about three seconds before I do.\n\n妈妈: A table for three, please.\n\n店员: Of course. We have a booth available near the back.\n\nLucy／第一人称旁白: Could we sit by the window instead?\n\n店员: You can, but those tables are all taken right now.\n\n妈妈: How long is the wait?\n\n店员: Probably fifteen or twenty minutes. I can't promise an exact time.\n\n弟弟 Ben: My stomach says that is a very long time.\n\nLucy／第一人称旁白: I look at the booth near the back. It has soft seats and a tiny picture of a dog wearing sunglasses above it. Actually, this table is fine.\n\n店员: Right this way. Here are your menus. I'll give you a few minutes.\n\nLucy／第一人称旁白: We slide into the booth. Ben immediately points at the dog picture and decides it's the owner of the restaurant.\n\n妈妈: A dog who runs a diner? That's a busy dog.\n\n弟弟 Ben: He probably checks all the hamburgers personally.\n\nLucy／第一人称旁白: We order lunch and share a glass bottle of ketchup. By the time our food arrives, I have completely forgotten about the window. The booth is comfortable, Ben is telling dog stories, and Mom looks relaxed.\n\n妈妈: Still wish we had waited?\n\nLucy／第一人称旁白: Not at all. This table comes with entertainment. I point to Ben. Unfortunately, there doesn't seem to be an off switch.", "word_count": 237, "audio": "audio/19_a_table_by_the_window.mp3", "subtitle": "subtitles/19_a_table_by_the_window.srt", "transcript": "transcripts/19_a_table_by_the_window.md", "duration_seconds": 84.744, "words_per_minute_including_pauses": 167.8}, {"id": 20, "title": "Please Don't Feed the Ducks", "title_zh": "给鸭子当观众", "category": "周末与朋友", "summary_zh": "姐弟俩在公园发现标牌，换一种方式亲近鸭子。", "focus": "读标牌、提醒规则、提出替代活动", "words": {"sign": "标牌", "pond": "池塘", "watch": "观察"}, "phrases": ["What does that sign say?", "Let's watch them from here.", "That one looks like it's in a hurry."], "segments": [{"speaker": "lucy", "text": "Little Moments. Please Don't Feed the Ducks. Ben and I walk around the park pond with Dad. Ben is carrying the last piece of his sandwich. When three ducks swim toward us, he starts pulling the bread into little pieces."}, {"speaker": "dad", "text": "Hold on a second. What does that sign say?"}, {"speaker": "lucy", "text": "Please don't feed the ducks. Ben looks at the bread, then at the ducks. They seem extremely interested in ignoring the sign."}, {"speaker": "ben", "text": "But they came all this way. It feels rude not to offer them anything."}, {"speaker": "dad", "text": "The park asks visitors to let the ducks find their own food. We can enjoy watching them without feeding them."}, {"speaker": "lucy", "text": "Let's watch them from here. We sit on a bench a little way back from the water. Ben keeps his sandwich for himself, and I start counting ducks."}, {"speaker": "ben", "text": "That one looks like it's in a hurry."}, {"speaker": "lucy", "text": "A small duck paddles past a much bigger one and disappears behind some reeds. Maybe it's late for duck school."}, {"speaker": "dad", "text": "Or maybe it just knows a good place to look for lunch."}, {"speaker": "lucy", "text": "We see one duck shake water off its feathers and another tuck its head down for a rest. Suddenly, watching them feels more interesting than throwing bread."}, {"speaker": "ben", "text": "The sleepy one is me on Monday morning."}, {"speaker": "lucy", "text": "On the way out, we put our sandwich wrapper in a trash can. Ben waves at the pond. The ducks don't wave back, but one gives a very loud quack. We decide that counts."}], "role_names": {}, "slug": "20_please_don_t_feed_the_ducks", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}}, "input_sha256": "0ffd1389fcaa62ce9064dcf16e0e7af62765ae3f787982e98e795ee4405d8773", "speech": "Lucy／第一人称旁白: Little Moments. Please Don't Feed the Ducks. Ben and I walk around the park pond with Dad. Ben is carrying the last piece of his sandwich. When three ducks swim toward us, he starts pulling the bread into little pieces.\n\n爸爸: Hold on a second. What does that sign say?\n\nLucy／第一人称旁白: Please don't feed the ducks. Ben looks at the bread, then at the ducks. They seem extremely interested in ignoring the sign.\n\n弟弟 Ben: But they came all this way. It feels rude not to offer them anything.\n\n爸爸: The park asks visitors to let the ducks find their own food. We can enjoy watching them without feeding them.\n\nLucy／第一人称旁白: Let's watch them from here. We sit on a bench a little way back from the water. Ben keeps his sandwich for himself, and I start counting ducks.\n\n弟弟 Ben: That one looks like it's in a hurry.\n\nLucy／第一人称旁白: A small duck paddles past a much bigger one and disappears behind some reeds. Maybe it's late for duck school.\n\n爸爸: Or maybe it just knows a good place to look for lunch.\n\nLucy／第一人称旁白: We see one duck shake water off its feathers and another tuck its head down for a rest. Suddenly, watching them feels more interesting than throwing bread.\n\n弟弟 Ben: The sleepy one is me on Monday morning.\n\nLucy／第一人称旁白: On the way out, we put our sandwich wrapper in a trash can. Ben waves at the pond. The ducks don't wave back, but one gives a very loud quack. We decide that counts.", "word_count": 242, "audio": "audio/20_please_don_t_feed_the_ducks.mp3", "subtitle": "subtitles/20_please_don_t_feed_the_ducks.srt", "transcript": "transcripts/20_please_don_t_feed_the_ducks.md", "duration_seconds": 78.0, "words_per_minute_including_pauses": 186.2}, {"id": 21, "title": "The Missing Water Bottle", "title_zh": "水杯失物招领", "category": "校园生活", "summary_zh": "Lucy在失物招领处用颜色和细节找回水杯。", "focus": "描述失物、提供特征、确认归属", "words": {"lost and found": "失物招领处", "sticker": "贴纸", "lid": "盖子"}, "phrases": ["I think I left it in the gym.", "What does it look like?", "That's the one!"], "segments": [{"speaker": "lucy", "text": "Little Moments. The Missing Water Bottle. After gym class, I reach into the side pocket of my backpack. No water bottle. I check the other side, even though it has never lived there. Still nothing."}, {"speaker": "emma", "text": "When did you last have it?"}, {"speaker": "lucy", "text": "Before basketball. I think I left it in the gym. We go back, but the bench is empty. Emma suggests checking the school office, where there's a box for lost things."}, {"speaker": "staff", "text": "Looking for something?"}, {"speaker": "lucy", "text": "My water bottle. I had it this morning, and now it's missing."}, {"speaker": "staff", "text": "What does it look like?"}, {"speaker": "lucy", "text": "It's dark blue with a silver lid. There's a little moon sticker on one side and a scratch near the bottom."}, {"speaker": "staff", "text": "Let's see. We have two blue bottles here. Does either of these look familiar?"}, {"speaker": "lucy", "text": "The first one has a red lid. The second has my little moon, slightly peeling at one corner. That's the one!"}, {"speaker": "emma", "text": "Your moon brought you home."}, {"speaker": "staff", "text": "Is your name on it anywhere?"}, {"speaker": "lucy", "text": "Not yet. I should probably fix that."}, {"speaker": "staff", "text": "A name label would make it easier to return next time."}, {"speaker": "lucy", "text": "At home, I dry the bottle and add a small label under the moon. Ben offers to write an exciting name instead of Lucy. Later, I tell Emma about it on the phone."}, {"speaker": "emma", "text": "Like what?"}, {"speaker": "lucy", "text": "Captain Splash. I decide Lucy is more useful for the school office. Captain Splash can be its name at home, where nobody needs to fill out a lost-and-found form."}], "role_names": {"staff": "学校办公室老师"}, "slug": "21_the_missing_water_bottle", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}, "staff": {"name": "老师／男性服务人员（按每集角色表）", "voice": "en-US-ChristopherNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "f9e1f3a6ac87a0c9a432e3c6b0e4b1b1f4afe0dd80424129168afd5c2d81bcf0", "speech": "Lucy／第一人称旁白: Little Moments. The Missing Water Bottle. After gym class, I reach into the side pocket of my backpack. No water bottle. I check the other side, even though it has never lived there. Still nothing.\n\n朋友 Emma: When did you last have it?\n\nLucy／第一人称旁白: Before basketball. I think I left it in the gym. We go back, but the bench is empty. Emma suggests checking the school office, where there's a box for lost things.\n\n学校办公室老师: Looking for something?\n\nLucy／第一人称旁白: My water bottle. I had it this morning, and now it's missing.\n\n学校办公室老师: What does it look like?\n\nLucy／第一人称旁白: It's dark blue with a silver lid. There's a little moon sticker on one side and a scratch near the bottom.\n\n学校办公室老师: Let's see. We have two blue bottles here. Does either of these look familiar?\n\nLucy／第一人称旁白: The first one has a red lid. The second has my little moon, slightly peeling at one corner. That's the one!\n\n朋友 Emma: Your moon brought you home.\n\n学校办公室老师: Is your name on it anywhere?\n\nLucy／第一人称旁白: Not yet. I should probably fix that.\n\n学校办公室老师: A name label would make it easier to return next time.\n\nLucy／第一人称旁白: At home, I dry the bottle and add a small label under the moon. Ben offers to write an exciting name instead of Lucy. Later, I tell Emma about it on the phone.\n\n朋友 Emma: Like what?\n\nLucy／第一人称旁白: Captain Splash. I decide Lucy is more useful for the school office. Captain Splash can be its name at home, where nobody needs to fill out a lost-and-found form.", "word_count": 243, "audio": "audio/21_the_missing_water_bottle.mp3", "subtitle": "subtitles/21_the_missing_water_bottle.srt", "transcript": "transcripts/21_the_missing_water_bottle.md", "duration_seconds": 83.496, "words_per_minute_including_pauses": 174.6}, {"id": 22, "title": "The Video Call With Grandma", "title_zh": "给奶奶打视频电话", "category": "家庭日常", "summary_zh": "一家人视频聊天，先解决镜头角度和听不清的小问题。", "focus": "检查声音、调整镜头、分享近况", "words": {"camera": "摄像头", "volume": "音量", "hear": "听见"}, "phrases": ["Can you hear us now?", "Move the camera a little higher.", "What have you been up to?"], "segments": [{"speaker": "lucy", "text": "Little Moments. The Video Call With Grandma. Every Sunday, Mom calls Grandma, and we all squeeze onto the couch to say hello. Today, Grandma can see the ceiling, the top of Dad's head, and absolutely none of us."}, {"speaker": "mom", "text": "Move the camera a little higher. No, the other way. There. Now I can see everybody."}, {"speaker": "lucy", "text": "Mom is talking to Dad, who is balancing the tablet against a pillow. Grandma waves on the screen, but we can't hear her yet."}, {"speaker": "dad", "text": "I turned the volume down earlier. Let me fix that."}, {"speaker": "lucy", "text": "Can you hear us now? Grandma gives us a thumbs-up. She says she can hear Ben better than anyone, which is not surprising. He's sitting closest to the microphone."}, {"speaker": "ben", "text": "Hi, Grandma! I lost a tooth!"}, {"speaker": "mom", "text": "You don't have to shout. She's far away, but the microphone is right here."}, {"speaker": "lucy", "text": "Grandma laughs and asks us what we've been doing. Mom points the camera toward me. What have you been up to? That's Grandma's favorite question, and this time I have something ready to show her."}, {"speaker": "ben", "text": "Lucy made a poster. I helped by not spilling anything on it."}, {"speaker": "lucy", "text": "A very valuable contribution. I hold up the poster and tell Grandma about our neighborhood project. Then Ben shows the gap in his teeth from three different angles."}, {"speaker": "dad", "text": "Same time next Sunday?"}, {"speaker": "lucy", "text": "Grandma nods. We wave goodbye, and Dad carefully moves the tablet off the pillow. Next week, we'll try to show her our faces right from the beginning."}], "role_names": {}, "slug": "22_the_video_call_with_grandma", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "ec07e0b5a7bc9cdb7c56ce8bb0260a1c05db6a26d79b08463c7280963bc340f6", "speech": "Lucy／第一人称旁白: Little Moments. The Video Call With Grandma. Every Sunday, Mom calls Grandma, and we all squeeze onto the couch to say hello. Today, Grandma can see the ceiling, the top of Dad's head, and absolutely none of us.\n\n妈妈: Move the camera a little higher. No, the other way. There. Now I can see everybody.\n\nLucy／第一人称旁白: Mom is talking to Dad, who is balancing the tablet against a pillow. Grandma waves on the screen, but we can't hear her yet.\n\n爸爸: I turned the volume down earlier. Let me fix that.\n\nLucy／第一人称旁白: Can you hear us now? Grandma gives us a thumbs-up. She says she can hear Ben better than anyone, which is not surprising. He's sitting closest to the microphone.\n\n弟弟 Ben: Hi, Grandma! I lost a tooth!\n\n妈妈: You don't have to shout. She's far away, but the microphone is right here.\n\nLucy／第一人称旁白: Grandma laughs and asks us what we've been doing. Mom points the camera toward me. What have you been up to? That's Grandma's favorite question, and this time I have something ready to show her.\n\n弟弟 Ben: Lucy made a poster. I helped by not spilling anything on it.\n\nLucy／第一人称旁白: A very valuable contribution. I hold up the poster and tell Grandma about our neighborhood project. Then Ben shows the gap in his teeth from three different angles.\n\n爸爸: Same time next Sunday?\n\nLucy／第一人称旁白: Grandma nods. We wave goodbye, and Dad carefully moves the tablet off the pillow. Next week, we'll try to show her our faces right from the beginning.", "word_count": 244, "audio": "audio/22_the_video_call_with_grandma.mp3", "subtitle": "subtitles/22_the_video_call_with_grandma.srt", "transcript": "transcripts/22_the_video_call_with_grandma.md", "duration_seconds": 86.376, "words_per_minute_including_pauses": 169.5}, {"id": 23, "title": "The Backpack That Wouldn't Close", "title_zh": "拉不上拉链的书包", "category": "校园生活", "summary_zh": "Lucy带了太多东西，和爸爸一起整理书包。", "focus": "确认需要、取出多余物品、整理空间", "words": {"zipper": "拉链", "pocket": "口袋", "leave behind": "留下不带"}, "phrases": ["Do you need all of that?", "Let's take everything out.", "That can stay at home."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Backpack That Wouldn't Close. It's Sunday evening, and my backpack refuses to close. I pull the zipper, push on the top, and try asking nicely. Nothing works. Dad walks past my door and stops."}, {"speaker": "dad", "text": "Do you need all of that?"}, {"speaker": "lucy", "text": "Probably. Maybe. I'm prepared for everything."}, {"speaker": "dad", "text": "Let's take everything out. Then we can see what everything actually means."}, {"speaker": "lucy", "text": "We put my things on the bed. Three notebooks, two library books, a pencil case, a sweater, an old art project, and a rock that looks a little like a potato."}, {"speaker": "dad", "text": "Is the rock part of your homework?"}, {"speaker": "lucy", "text": "No. I found it last week. It has a nice personality."}, {"speaker": "dad", "text": "Then it can keep your desk company. That can stay at home."}, {"speaker": "lucy", "text": "I check tomorrow's schedule. I only need two notebooks, and the art project was finished days ago. One library book is due tomorrow, so that goes back in."}, {"speaker": "ben", "text": "Can I have the potato rock?"}, {"speaker": "lucy", "text": "You may visit it on my desk. It's not ready to move out. I put the heavier books close to the back and the smaller things in the front pocket. The zipper finally closes without a fight."}, {"speaker": "dad", "text": "How does it feel now?"}, {"speaker": "lucy", "text": "Much better. I lift the backpack with one hand, then try it on. Ben watches carefully from the doorway."}, {"speaker": "ben", "text": "Your bag looks happier."}, {"speaker": "lucy", "text": "So do my shoulders. The rock remains on my desk, looking quietly supportive. Tomorrow, I will be prepared for school, which is probably enough."}], "role_names": {}, "slug": "23_the_backpack_that_wouldn_t_close", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "ben": {"name": "弟弟 Ben", "voice": "en-US-EricNeural", "rate": "+20%", "pitch": "+6Hz"}}, "input_sha256": "b20e6df1ccdf1c8a87d05c768722a2b6ee068f9436836b5ff7452ea7a2a77b5b", "speech": "Lucy／第一人称旁白: Little Moments. The Backpack That Wouldn't Close. It's Sunday evening, and my backpack refuses to close. I pull the zipper, push on the top, and try asking nicely. Nothing works. Dad walks past my door and stops.\n\n爸爸: Do you need all of that?\n\nLucy／第一人称旁白: Probably. Maybe. I'm prepared for everything.\n\n爸爸: Let's take everything out. Then we can see what everything actually means.\n\nLucy／第一人称旁白: We put my things on the bed. Three notebooks, two library books, a pencil case, a sweater, an old art project, and a rock that looks a little like a potato.\n\n爸爸: Is the rock part of your homework?\n\nLucy／第一人称旁白: No. I found it last week. It has a nice personality.\n\n爸爸: Then it can keep your desk company. That can stay at home.\n\nLucy／第一人称旁白: I check tomorrow's schedule. I only need two notebooks, and the art project was finished days ago. One library book is due tomorrow, so that goes back in.\n\n弟弟 Ben: Can I have the potato rock?\n\nLucy／第一人称旁白: You may visit it on my desk. It's not ready to move out. I put the heavier books close to the back and the smaller things in the front pocket. The zipper finally closes without a fight.\n\n爸爸: How does it feel now?\n\nLucy／第一人称旁白: Much better. I lift the backpack with one hand, then try it on. Ben watches carefully from the doorway.\n\n弟弟 Ben: Your bag looks happier.\n\nLucy／第一人称旁白: So do my shoulders. The rock remains on my desk, looking quietly supportive. Tomorrow, I will be prepared for school, which is probably enough.", "word_count": 245, "audio": "audio/23_the_backpack_that_wouldn_t_close.mp3", "subtitle": "subtitles/23_the_backpack_that_wouldn_t_close.srt", "transcript": "transcripts/23_the_backpack_that_wouldn_t_close.md", "duration_seconds": 90.576, "words_per_minute_including_pauses": 162.3}, {"id": 24, "title": "A Haircut, Just a Little", "title_zh": "头发只剪一点点", "category": "出行与办事", "summary_zh": "理发前说清楚想剪多少，比只说一点点更有用。", "focus": "描述长度、澄清程度、确认效果", "words": {"haircut": "理发", "trim": "修剪", "shoulder": "肩膀"}, "phrases": ["Just a little off, please.", "About this much?", "I'd like to keep it long."], "segments": [{"speaker": "lucy", "text": "Little Moments. A Haircut, Just a Little. Mom takes me to the hair salon after school. I sit in a big chair while the stylist puts a cape around my shoulders. In the mirror, I look like a person wearing a very fancy tablecloth."}, {"speaker": "clerk", "text": "What would you like today?"}, {"speaker": "lucy", "text": "Just a little off, please."}, {"speaker": "clerk", "text": "Sure. About this much?"}, {"speaker": "lucy", "text": "She holds her fingers a short distance apart. Maybe a little less. I'd like to keep it long."}, {"speaker": "clerk", "text": "No problem. I'll trim the ends and keep it below your shoulders. Does that sound right?"}, {"speaker": "lucy", "text": "Yes, exactly. I feel better now that we've agreed on what a little means. Mom sits nearby, reading a magazine with a very serious cake on the cover."}, {"speaker": "mom", "text": "Comfortable?"}, {"speaker": "lucy", "text": "Mostly. My nose has decided to itch, and my hands are trapped under this cape."}, {"speaker": "clerk", "text": "You can move your hand out. Just tell me before you move your head."}, {"speaker": "lucy", "text": "I scratch my nose, and the haircut continues. Small pieces of hair fall to the floor. When the stylist finishes, she gives me a hand mirror so I can see the back."}, {"speaker": "clerk", "text": "What do you think?"}, {"speaker": "lucy", "text": "I like it. It still feels like my hair, just a little neater."}, {"speaker": "mom", "text": "Ready to go?"}, {"speaker": "lucy", "text": "Almost. I turn my head once more in the mirror. A little was exactly the right amount. Next time, I'll use my fingers to show it instead of expecting someone to guess."}], "role_names": {"clerk": "理发师"}, "slug": "24_a_haircut_just_a_little", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "af64cc77ae1d95f670225f89258d27424e426eec30fc9728e8a2e0f77ebafe52", "speech": "Lucy／第一人称旁白: Little Moments. A Haircut, Just a Little. Mom takes me to the hair salon after school. I sit in a big chair while the stylist puts a cape around my shoulders. In the mirror, I look like a person wearing a very fancy tablecloth.\n\n理发师: What would you like today?\n\nLucy／第一人称旁白: Just a little off, please.\n\n理发师: Sure. About this much?\n\nLucy／第一人称旁白: She holds her fingers a short distance apart. Maybe a little less. I'd like to keep it long.\n\n理发师: No problem. I'll trim the ends and keep it below your shoulders. Does that sound right?\n\nLucy／第一人称旁白: Yes, exactly. I feel better now that we've agreed on what a little means. Mom sits nearby, reading a magazine with a very serious cake on the cover.\n\n妈妈: Comfortable?\n\nLucy／第一人称旁白: Mostly. My nose has decided to itch, and my hands are trapped under this cape.\n\n理发师: You can move your hand out. Just tell me before you move your head.\n\nLucy／第一人称旁白: I scratch my nose, and the haircut continues. Small pieces of hair fall to the floor. When the stylist finishes, she gives me a hand mirror so I can see the back.\n\n理发师: What do you think?\n\nLucy／第一人称旁白: I like it. It still feels like my hair, just a little neater.\n\n妈妈: Ready to go?\n\nLucy／第一人称旁白: Almost. I turn my head once more in the mirror. A little was exactly the right amount. Next time, I'll use my fingers to show it instead of expecting someone to guess.", "word_count": 234, "audio": "audio/24_a_haircut_just_a_little.mp3", "subtitle": "subtitles/24_a_haircut_just_a_little.srt", "transcript": "transcripts/24_a_haircut_just_a_little.md", "duration_seconds": 81.888, "words_per_minute_including_pauses": 171.5}, {"id": 25, "title": "The Rainy Walk Home", "title_zh": "雨天一起回家", "category": "出行与办事", "summary_zh": "放学下雨，两个朋友商量怎样共用一把伞。", "focus": "提出同行、提醒注意、商量路线", "words": {"umbrella": "雨伞", "puddle": "水坑", "shortcut": "近路"}, "phrases": ["Do you want to share my umbrella?", "Let's take the longer way.", "You're getting wet on that side."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Rainy Walk Home. School ends, and rain is falling hard outside the front doors. Emma opens her umbrella. I open my backpack and find a notebook, a snack, and no umbrella at all."}, {"speaker": "emma", "text": "Do you want to share my umbrella?"}, {"speaker": "lucy", "text": "Yes, please. Mine is doing an excellent job of staying dry at home. We step outside together and immediately discover that walking under one umbrella takes teamwork."}, {"speaker": "emma", "text": "You're getting wet on that side. Come a little closer."}, {"speaker": "lucy", "text": "I move closer. Our backpacks bump. We take three steps and bump again. After a minute, we find a rhythm that doesn't involve walking into each other."}, {"speaker": "emma", "text": "Should we take the shortcut through the park?"}, {"speaker": "lucy", "text": "Let's take the longer way. The path gets muddy, and I don't want to bring half the park home on my shoes."}, {"speaker": "emma", "text": "Good point. Sidewalk it is."}, {"speaker": "lucy", "text": "At the corner, we stop before a giant puddle. I go around the left side while Emma starts going right. The umbrella can't decide who to follow."}, {"speaker": "emma", "text": "Same side, Lucy. We need to choose the same side."}, {"speaker": "lucy", "text": "Right. This is more complicated than our group project. We laugh and carefully walk around together. When we reach my house, Mom opens the door with a towel."}, {"speaker": "mom", "text": "Come in, both of you. You look like you've had an adventure."}, {"speaker": "lucy", "text": "A very small, very wet adventure. Tomorrow, my umbrella is coming to school. It has enjoyed enough time off."}], "role_names": {}, "slug": "25_the_rainy_walk_home", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "mom": {"name": "妈妈", "voice": "en-US-AriaNeural", "rate": "+20%", "pitch": "+0Hz"}, "emma": {"name": "朋友 Emma", "voice": "en-US-EmmaMultilingualNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "70bef889f9b17bea284859bcbc297394adc4ec469001ca0a687c3a09ec9f0f41", "speech": "Lucy／第一人称旁白: Little Moments. The Rainy Walk Home. School ends, and rain is falling hard outside the front doors. Emma opens her umbrella. I open my backpack and find a notebook, a snack, and no umbrella at all.\n\n朋友 Emma: Do you want to share my umbrella?\n\nLucy／第一人称旁白: Yes, please. Mine is doing an excellent job of staying dry at home. We step outside together and immediately discover that walking under one umbrella takes teamwork.\n\n朋友 Emma: You're getting wet on that side. Come a little closer.\n\nLucy／第一人称旁白: I move closer. Our backpacks bump. We take three steps and bump again. After a minute, we find a rhythm that doesn't involve walking into each other.\n\n朋友 Emma: Should we take the shortcut through the park?\n\nLucy／第一人称旁白: Let's take the longer way. The path gets muddy, and I don't want to bring half the park home on my shoes.\n\n朋友 Emma: Good point. Sidewalk it is.\n\nLucy／第一人称旁白: At the corner, we stop before a giant puddle. I go around the left side while Emma starts going right. The umbrella can't decide who to follow.\n\n朋友 Emma: Same side, Lucy. We need to choose the same side.\n\nLucy／第一人称旁白: Right. This is more complicated than our group project. We laugh and carefully walk around together. When we reach my house, Mom opens the door with a towel.\n\n妈妈: Come in, both of you. You look like you've had an adventure.\n\nLucy／第一人称旁白: A very small, very wet adventure. Tomorrow, my umbrella is coming to school. It has enjoyed enough time off.", "word_count": 238, "audio": "audio/25_the_rainy_walk_home.mp3", "subtitle": "subtitles/25_the_rainy_walk_home.srt", "transcript": "transcripts/25_the_rainy_walk_home.md", "duration_seconds": 82.056, "words_per_minute_including_pauses": 174.0}, {"id": 26, "title": "The Package Next Door", "title_zh": "送到隔壁的包裹", "category": "出行与办事", "summary_zh": "包裹显示送达却找不到，Lucy和爸爸查看照片后解开谜团。", "focus": "核对地址、说明误送、礼貌求助", "words": {"package": "包裹", "address": "地址", "doorstep": "门前台阶"}, "phrases": ["The photo doesn't look like our door.", "Could you check the address?", "Thanks for bringing it over."], "segments": [{"speaker": "lucy", "text": "Little Moments. The Package Next Door. Dad ordered a new desk lamp, and the delivery message says it has arrived. I open the front door. There's a welcome mat, a flowerpot, and no lamp. I look behind the flowerpot, even though it's much too small."}, {"speaker": "dad", "text": "Does the message include a photo?"}, {"speaker": "lucy", "text": "Yes, but the photo doesn't look like our door. Our mat is green. The one in the picture says Hello in big yellow letters."}, {"speaker": "dad", "text": "That's next door. Let's check the house number on the label before we go over."}, {"speaker": "lucy", "text": "Dad calls our neighbor, Mrs. Lee. She has just found the package outside and noticed the address. A minute later, she meets us by the gate."}, {"speaker": "clerk", "text": "I was about to bring this over. Could you check the address? I think it's yours."}, {"speaker": "dad", "text": "Yes, that's our number. Thanks for bringing it over."}, {"speaker": "lucy", "text": "We carry the box inside. Dad opens it, and I help remove the paper around the lamp. Everything looks fine. We place it on my desk and turn it on."}, {"speaker": "dad", "text": "Better light for your homework."}, {"speaker": "lucy", "text": "Definitely. My potato-shaped rock now looks very important under it."}, {"speaker": "dad", "text": "Glad the lamp is serving a useful purpose."}, {"speaker": "lucy", "text": "We flatten the cardboard box for recycling. I look at the delivery photo one more time. Next time something goes missing, I'll check the details before searching behind a tiny flowerpot. Detective Lucy is learning. Slowly, but with excellent lighting."}], "role_names": {"clerk": "邻居 Mrs. Lee"}, "slug": "26_the_package_next_door", "cast": {"lucy": {"name": "Lucy／第一人称旁白", "voice": "en-US-MichelleNeural", "rate": "+20%", "pitch": "+0Hz"}, "dad": {"name": "爸爸", "voice": "en-US-GuyNeural", "rate": "+20%", "pitch": "+0Hz"}, "clerk": {"name": "店员", "voice": "en-US-JennyNeural", "rate": "+20%", "pitch": "+0Hz"}}, "input_sha256": "b63ff2e06f6b7d4e231f1f7cf9c120952e0f4b33525eb35a3b10efc205c740c6", "speech": "Lucy／第一人称旁白: Little Moments. The Package Next Door. Dad ordered a new desk lamp, and the delivery message says it has arrived. I open the front door. There's a welcome mat, a flowerpot, and no lamp. I look behind the flowerpot, even though it's much too small.\n\n爸爸: Does the message include a photo?\n\nLucy／第一人称旁白: Yes, but the photo doesn't look like our door. Our mat is green. The one in the picture says Hello in big yellow letters.\n\n爸爸: That's next door. Let's check the house number on the label before we go over.\n\nLucy／第一人称旁白: Dad calls our neighbor, Mrs. Lee. She
